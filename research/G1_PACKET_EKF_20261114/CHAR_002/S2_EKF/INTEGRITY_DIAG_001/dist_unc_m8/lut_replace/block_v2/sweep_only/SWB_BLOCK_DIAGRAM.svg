<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="sans-serif">
<title>Station sweep 기반 블록 SWB 구성</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5"/></marker></defs>
<rect width="680" height="590" fill="#ffffff"/>
<rect x="200" y="30" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="50" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Station sweep</text><text x="340.0" y="70" text-anchor="middle" font-size="12" fill="#5F5E5A">40열 × 5줄 × 36 yaw, s_full</text>
<path d="M340 86 L340 98 L130 98 L130 108" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M340 86 L340 108" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M340 86 L340 98 L550 98 L550 108" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="130.0" y="130" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">근거리 &lt; 3 m</text><text x="130.0" y="150" text-anchor="middle" font-size="12" fill="#534AB7">측정 곡선 그대로</text>
<rect x="250" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="130" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">중거리 3–6 m</text><text x="340.0" y="150" text-anchor="middle" font-size="12" fill="#534AB7">χ 보간, 흩어짐 제거</text>
<rect x="460" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="550.0" y="130" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">원거리 ≥ 6 m</text><text x="550.0" y="150" text-anchor="middle" font-size="12" fill="#534AB7">±3열 × 5줄 평균</text>
<line x1="220" y1="138" x2="248" y2="138" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="460" y1="138" x2="432" y2="138" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="340" y="190" text-anchor="middle" font-size="12" fill="#5F5E5A">점선: 근거리·원거리가 중거리 χ_ref의 기준점</text>
<path d="M130 166 L130 214 L198 214 L198 228" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M340 200 L340 228" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M550 166 L550 214 L482 214 L482 228" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180" y="230" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="250" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Station 곡선</text><text x="340.0" y="270" text-anchor="middle" font-size="12" fill="#0F6E56">ψ 조화 19개 전체 유지</text>
<path d="M340 286 L340 318" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180" y="320" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">연속 블록 m(x, y, ψ)</text><text x="340.0" y="360" text-anchor="middle" font-size="12" fill="#0F6E56">x spline, y 선형, ψ 해석적</text>
<path d="M300 376 L300 392 L190 392 L190 408" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M380 376 L380 392 L490 392 L490 408" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="60" y="410" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="190.0" y="430" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Jacobian</text><text x="190.0" y="450" text-anchor="middle" font-size="12" fill="#0F6E56">∂m/∂(x, y, ψ) 해석적</text>
<rect x="360" y="410" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="490.0" y="430" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">분산 표</text><text x="490.0" y="450" text-anchor="middle" font-size="12" fill="#0F6E56">x 열 제외 잔차 → c₁a² + c₀</text>
<path d="M190 466 L190 484 L310 484 L310 498" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/><path d="M490 466 L490 484 L370 484 L370 498" fill="none" stroke="#73726c" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="200" y="500" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="520" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">EKF (F2)</text><text x="340.0" y="540" text-anchor="middle" font-size="12" fill="#5F5E5A">h = m, 평균 보정 μ_s 없음</text>
</svg>