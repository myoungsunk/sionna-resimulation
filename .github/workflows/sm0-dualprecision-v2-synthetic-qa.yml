name: SM0 V2 dual precision synthetic audit preflight
on:
  push:
    branches: ['fix/sm0-dualprecision-canary-20261104']
    paths:
      - '.github/workflows/sm0-dualprecision-v2-synthetic-qa.yml'
      - 'research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only sparse source checkout; do not download original RF
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout: |
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/producer.py
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/native_math.py
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/precision_qa.py
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/test_native_math.py
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/test_precision_qa.py
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/recheck_preserved_canary.py
      - name: Python 3.11 for pure NumPy preflight
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact pinned NumPy version
        run: python -m pip install numpy==1.26.4
      - name: Run synthetic QA without PathSolver or scene input
        working-directory: research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v test_native_math test_precision_qa 2>&1 | tee /tmp/sm0_dualprecision_synthetic.log
          python -B -m py_compile producer.py precision_qa.py recheck_preserved_canary.py native_math.py
      - name: Archive synthetic-only log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sm0-dualprecision-synthetic-${{ github.run_id }}
          path: /tmp/sm0_dualprecision_synthetic.log
          retention-days: 30
