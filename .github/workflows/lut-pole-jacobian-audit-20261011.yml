name: Frozen FFD LUT near-vertical pole numerical and actual LoS check
on:
  push:
    branches: [codex/range-only-bias-consistency-20261011]
    paths:
      - '.github/workflows/lut-pole-jacobian-audit-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_lut_pole_jacobian_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polar-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_lut_pole_jacobian_audit.py
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/CASES.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.2.4' 'pandas==2.2.3' 'tabulate==0.9.0'
      - name: Evaluate actual native LOS and interpolated LUT derivatives, no new H
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_lut_pole_jacobian_audit.py
          python -X utf8 research/HEADING_RELIABILITY_20261010/run_lut_pole_jacobian_audit.py --out research_results/POLE_LUT_20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-lut-polar-singularity-actual-data-20261011
          path: research_results/POLE_LUT_20261011
          if-no-files-found: warn
          retention-days: 30
