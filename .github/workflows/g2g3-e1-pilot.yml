name: G2G3 audited one-cell E heading benchmark
on:
  push:
    branches: [research/g2g3-bf-audited-20261014]
    paths:
      - research/G2G3_BF_STAGED_20261014/E1_APPROVAL.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g2g3-e1-pilot
  cancel-in-progress: false
jobs:
  e1-one-cell-original-r0:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/G2G3_BF_STAGED_20261014/E1_pilot.py
            /research/G2G3_BF_STAGED_20261014/E1_PRE_RUN_REVIEW_KO.md
            /research/G2G3_BF_STAGED_20261014/E1_APPROVAL.json
            /.github/workflows/g2g3-e1-pilot.yml
            /research/EKF3_INDEPENDENT_20261013/diagnostics/h3_offline/results/H3_OFFLINE_20261014_01a1380d/STAGE4_SMOKE_01/SMOKE_PARTIAL.csv
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/INPUTS/timeline_R2_Tnone.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all execution sources first
        run: python research/G2G3_BF_STAGED_20261014/E1_pilot.py audit
      - name: Install pinned posterior scoring dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Score original G3 validated single-cell posterior against archived G2 results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/G2G3_BF_STAGED_20261014/E1_pilot.py run
      - name: Preserve failure and success receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2g3-e1-one-cell-evidence
          path: outputs/g2g3_e1_pilot/
          retention-days: 30
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path('outputs/g2g3_e1_pilot/E1_ONE_CELL_RESULT.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# G2/G3 E pilot: one-cell accuracy, NOT full E/F\n\n')
              if file.is_file():
                  info=json.loads(file.read_text())
                  for k in ('execution','calculation','hypothesis','truth_yaw_deg',
                            'original_methods','numerical_G3','scientific_claim','next'):
                      f.write('**'+k+'**: '+str(info.get(k))+'\n\n')
              else:f.write('No result receipt; claim hold.\n')
          PY
