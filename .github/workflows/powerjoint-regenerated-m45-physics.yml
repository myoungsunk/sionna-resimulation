name: POWERJOINT R4 R5 regenerated Mount45 native RF regional physics
on:
  push:
    branches: ['research/powerjoint-crosscase-mechanism-20261020']
    paths: ['.github/workflows/powerjoint-regenerated-m45-physics.yml']
permissions:
  contents: read
  actions: read
jobs:
  physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        route: [R4, R5]
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_CROSSCASE_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Fetch regenerated native Full / Direct LoS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 39279851027 --repo myoungsunk/sionna-resimulation --name "pj-regenerated-m45-${{ matrix.route }}-39279851027" --dir "$RUNNER_TEMP/source"
      - name: Evaluate T10 first-catalog native RF physics separately from EKF
        run: |
          set -euo pipefail
          python research/POWERJOINT_CROSSCASE_20261020/evaluate_regenerated_m45_physics.py "$RUNNER_TEMP/source/data" "$RUNNER_TEMP/results" "${{ matrix.route }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pj-r4r5-m45-regional-physics-${{ matrix.route }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results/**
          retention-days: 30
          if-no-files-found: warn
