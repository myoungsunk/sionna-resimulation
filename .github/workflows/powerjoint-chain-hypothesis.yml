name: POWERJOINT causal chain hypotheses A-E
on:
  push:
    branches: ['research/powerjoint-chain-hypothesis-20261019']
    paths: ['research/CHAIN_HYPOTHESIS_20261019/**', '.github/workflows/powerjoint-chain-hypothesis.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hypotheses:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Read fixed scientific sources and isolated experiment code
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          cd source
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/CHAIN_HYPOTHESIS_20261019/**\n/research/FFD_P0P3_20261016/**\n/research/R5_N4B_20261015/*.py\n/research/R5_N4C_20261015/*.py\n/research/R5_FULLRF_B0_GATES_20261015/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/*.json\n/research/EKF3_INDEPENDENT_20261013/*.py\n/research/EKF3_INDEPENDENT_20261013/*.json\n/research/PHYSICS_RS_STAGED_20261015/code/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pinned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Restore immutable inputs directly in execution environment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,zipfile,hashlib,urllib.request,pathlib,shutil
          root=pathlib.Path.cwd(); source=root/'source'; (root/'ffd_p0p3/out').mkdir(parents=True,exist_ok=True); out=root/'out'; out.mkdir(exist_ok=True)
          records=[]
          for artifact,name in [(11948391783,'physics_rs_inputs.zip'),(11782748118,'rf_frozen.zip'),(12034154094,'ffd_original.zip')]:
              req=urllib.request.Request('https://api.github.com/repos/myoungsunk/sionna-resimulation/actions/artifacts/'+str(artifact)+'/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              target=root/name
              with urllib.request.urlopen(req,timeout=90) as response,target.open('wb') as f: shutil.copyfileobj(response,f)
              with target.open('rb') as f: h=hashlib.file_digest(f,'sha256').hexdigest()
              records.append({'artifact':artifact,'file':name,'bytes':target.stat().st_size,'sha256':h})
              with zipfile.ZipFile(target) as z:
                  if z.testzip(): raise RuntimeError('DAMAGED_ZIP:'+name)
                  if name=='physics_rs_inputs.zip':
                      for info in z.infolist():
                          if info.is_dir(): continue
                          p=pathlib.PurePosixPath(info.filename)
                          if '..' in p.parts or p.is_absolute(): raise RuntimeError('UNSAFE_PATH')
                          dest=source/pathlib.Path(*p.parts); dest.parent.mkdir(parents=True,exist_ok=True)
                          if not dest.exists():
                              with z.open(info) as i,dest.open('wb') as o: shutil.copyfileobj(i,o)
                  elif name=='ffd_original.zip':
                      for expected in ['LP_plus45_bank.npz','LP_minus45_bank.npz']:
                          members=[p for p in z.namelist() if p.endswith(expected)]
                          if len(members)!=1: raise RuntimeError('BANK_AMBIGUOUS')
                          with z.open(members[0]) as i,(root/expected).open('wb') as o: shutil.copyfileobj(i,o)
          banks={'LP_plus45_bank.npz':'b29ae471a64617eacb0cf02ddbbcc3b2db190de171fba85f05dddb9cec0c453b','LP_minus45_bank.npz':'39729fe9f02cf80119a8492be8fcc43e08e2e9e00beebda2909e7c9819c76eb9'}
          for n,h in banks.items():
              with (root/n).open('rb') as f: got=hashlib.file_digest(f,'sha256').hexdigest()
              records.append({'file':n,'sha256':got,'expected':h,'matches_original':got==h})
              if got!=h: raise RuntimeError('Original recovery produced different bank bytes; inspect arrays before scientific reuse')
          (root/'BANK_MANIFEST.json').write_text(json.dumps({'npz_sha256':banks}))
          (out/'INPUT_RECEIPT.json').write_text(json.dumps(records,indent=2))
          print('INPUTS_RECOVERED',json.dumps(records),flush=True)
          manifest=json.loads((source/'research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json').read_text())
          print('CASES',json.dumps(manifest['cases']),flush=True)
          with zipfile.ZipFile(root/'rf_frozen.zip') as z: print('RF_MEMBERS',json.dumps(z.namelist()[:20]),flush=True)
          PY
      - name: Hypothesis execution (when code registered)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/research/CHAIN_HYPOTHESIS_20261019/run.py ]; then
            python -u source/research/CHAIN_HYPOTHESIS_20261019/run.py --out "$GITHUB_WORKSPACE/out"
          else
            echo 'INPUT PREPARATION ONLY: hypothesis code not yet registered'
          fi
      - name: Preserve all completed results and errors, never infer scientific pass from CI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerjoint-chain-hypotheses-${{ github.run_id }}
          path: out/
          retention-days: 30
          compression-level: 4
          if-no-files-found: warn
