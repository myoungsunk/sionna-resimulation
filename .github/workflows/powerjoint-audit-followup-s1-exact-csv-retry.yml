name: Powerjoint followup S1 exact CSV retry R2 R5
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s1-exact-csv-retry.yml]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        route: [R2, R5]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: work/source
          sparse-checkout: |
            research/POWERJOINT_AUDIT_FOLLOWUP_20261020
            research/POWERJOINT_AUDIT_RERUN_20261020
            research/CHAIN_HYPOTHESIS_20261019
            research/CHAIN_VALIDATED_RESULTS_20261019
            research/FFD_P0P3_20261016
            research/EKF4_RANGE_S_STAGED_20261014
            research/R5_N4B_20261015
            research/R5_N4C_20261015
            research/PHYSICS_RS_STAGED_20261015/code
            research/R5_FULLRF_SAME_START_EKF4_20261015
            research/POWERJOINT_M45_COMPACT_20261019
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.5
      - name: Restore immutable release inputs
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
      - name: Restore frozen legacy controls and parameters
        if: startsWith(matrix.route, 'R')
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/prepare_old.py
      - name: Legacy revised event replay after committed lock
        if: startsWith(matrix.route, 'R')
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/replay_events.py --route ${{ matrix.route }} --bundle old_bundle/BUNDLE.json --execution-root . --out s1/${{ matrix.route }}
      - name: Restore durable T2 input traces
        if: ${{ !startsWith(matrix.route, 'R') }}
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/restore_t2.py --route ${{ matrix.route }} --out canonical_t2
      - name: Restore actual Full and Native LoS source arrays
        if: ${{ !startsWith(matrix.route, 'R') }}
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore_route.py --route ${{ matrix.route }} --out source_route
      - name: Certify exact source pairing and actual visibility
        if: ${{ !startsWith(matrix.route, 'R') }}
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/prepare_new.py --route ${{ matrix.route }} --t2-root canonical_t2 --release-root source_route --out s1_inputs
      - name: New revised event replay after committed lock
        if: ${{ !startsWith(matrix.route, 'R') }}
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/replay_events.py --route ${{ matrix.route }} --bundle s1_inputs/BUNDLE.json --execution-root . --out s1/${{ matrix.route }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s1-${{ matrix.route }}-${{ github.run_id }}
          path: |
            work/s1
            work/s1_inputs
            work/RESTORE_RECEIPT.json
            work/old_bundle/BUNDLE.json
            work/canonical_t2/*/S1_RESTORE_RECEIPT.json
            work/source_route/ARCHIVE_CONTENTS_AND_SHA.json
          retention-days: 30
