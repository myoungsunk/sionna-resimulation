name: MBVAR A010 C3 ULP source truth DEV3 micro canary (nonindependent, NO RT)
on:
  push:
    branches: [fix/mbvar-a010-dev3-c3-source-truth-20261104]
    paths:
      - '.github/workflows/mbvar-a010-c3-ulp-20rv-canary-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MKL_DYNAMIC: 'FALSE'
  GH_TOKEN: ${{ github.token }}
  S1_RUN: '41769652106'
  S1_SOURCE_NAME: P2_S1V5_DEV3_USER_EXPLORATORY_run_41769652106
jobs:
  one-field-rv-sensor0-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 pytest==8.3.3
      - name: Original 49-code lock + unchanged source S1 authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,os,pathlib
          p=pathlib.Path(os.environ["EXP"])
          sys.path.insert(0,str(p/"code"))
          import contract_lock as CL,manifest as MF
          r=json.loads((p/"RUN_REQUEST.json").read_text())
          lk=CL.effective_lock()
          assert r["phase"]=="P2_C3V5" and r["split"]=="DEV3"
          assert lk["code_sha256"]==MF.code_hashes() and len(lk["code_sha256"])==49
          original=lk.get("A010_ORIGINAL_S1V5_SOURCE",{})
          assert original.get("source_git_sha")=="0bd5d706710f172ff6becb562eadd7573b5d3ffd"
          assert len(original.get("code_sha256",{}))==49
          assert lk["reviewer_status"]=="USER_AUTHORIZED_NONINDEPENDENT"
          assert lk["independent_auditor_signed"] is False
          assert lk["revision_scope"].startswith("POST_EXPOSURE")
          print("C3_ULP_SCOPED_LOCK_ORIGINAL_SOURCE_PASS")
          PY
      - name: Stage S1 aggregate and original FFD source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$EXP/results/$S1_SOURCE_NAME" "$RUNNER_TEMP/canary"
          gh run download "$S1_RUN" --repo ${{ github.repository }} --name a010-dev3-s1-aggregate-$S1_RUN \
            --dir "$GITHUB_WORKSPACE/$EXP/results/$S1_SOURCE_NAME"
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
          echo "28de7b01c9ef29175a7f5920b12ad700488c22f0b64eb9b5e0f4797eaa88d9ee  $REFLECT_ROOT/out/INPUT_LOCK.sha256" | sha256sum -c -
      - name: Technical canary field 20 RV sensor 0 only, original S1 source, all candidate terminals
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          export S1V5_RUN="$S1_SOURCE_NAME"
          python -u - <<'PY' 2>&1 | tee "$RUNNER_TEMP/canary/C3_ULP_MICRO_CANARY.log"
          import pathlib,os,sys
          p=pathlib.Path(os.environ["EXP"])
          sys.path.insert(0,str(p/"code"))
          import s1_mc as M
          M.SENSOR_SEEDS=(0,)
          import c3v5 as C
          print("START C3_TRUTH_ULP canary, field=20 group=RV seed=0, 16 batch rows only",flush=True)
          rc=C.cmd_run(20,"RV",pathlib.Path(os.environ["RUNNER_TEMP"])/"canary")
          assert rc==0
          print("C3_TRUTH_ULP_CANARY_FIELD20_RV_SEED0_SUCCESS")
          PY
      - name: Ensure 16 source original Batch keys and 160 terminal receipts were written
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,pandas as pd,os
          p=os.environ["RUNNER_TEMP"]+"/canary/"
          df=pd.read_csv(glob.glob(p+"C3V5_ROWS_20_RV.csv")[0])
          t=pd.read_csv(glob.glob(p+"C3V5_R5_TERMINAL_CERT_20_RV.csv")[0])
          assert len(df)==16,(len(df),df.columns.tolist())
          assert len(t)==160,len(t)
          assert df["TRUTH_ONLY_VERIFIED"].astype(str).str.lower().eq("true").all()
          assert df["OPTIMIZER_BOUNDARY_EXACT"].astype(str).str.lower().eq("true").all()
          assert (df["RECEIPT_ARRAY_EXACT"].astype(str).str.lower()=="true").all()
          print("A010_C3_ULP_ORIGINAL_S1_CANARY_16_BATCH_160_TERMINAL_PASS",df["TRUTH_REGEN_N_NONBYTE"].max())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-c3-ulp-original-source-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/canary/
          retention-days: 90
          if-no-files-found: warn
