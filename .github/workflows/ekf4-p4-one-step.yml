name: EKF4 P4 audited frozen real RF one-step
on:
  push:
    branches: ['research/ekf4-r3-p6-staged-20261014']
    paths:
      - '.github/workflows/ekf4-p4-one-step.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/p4_one_step.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/p4_pre_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p4-audited-one-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout frozen RF inputs and unchanged P0 code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/**\n/.github/workflows/ekf4-p4-one-step.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json').read_text())
          paths=['/research/EKF4_RANGE_S_STAGED_20261014/**',
                 '/research/EKF3_INDEPENDENT_20261013/**',
                 '/.github/workflows/ekf4-p4-one-step.yml']
          paths.extend('/'+a['path'] for a in j['assets'])
          paths.append('/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**')
          Path('/tmp/p4sparse').write_text('\n'.join(paths)+'\n')
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/p4sparse
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory p4_pre_audit.py before calculation or diagnostics
        run: python research/EKF4_RANGE_S_STAGED_20261014/p4_pre_audit.py
      - name: Install dependencies after audit
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - name: Verify all 39 frozen RF inputs and pose parity
        run: python research/EKF3_INDEPENDENT_20261013/p0_verify_inputs.py | tee "$RUNNER_TEMP/P4_P0_PARITY.json"
      - name: P4 common 4-state prior / joint / fixed-sequential / iterated MAP
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p4_one_step.py --out "$RUNNER_TEMP/p4_out" | tee "$RUNNER_TEMP/p4.log"
      - name: Save raw P4 outcomes even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p4-real-rf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/P4_PRE_RUN.json
            ${{ runner.temp }}/P4_P0_PARITY.json
            ${{ runner.temp }}/p4_out/**
            ${{ runner.temp }}/p4.log
            research/EKF4_RANGE_S_STAGED_20261014/p4_one_step.py
            research/EKF4_RANGE_S_STAGED_20261014/p4_pre_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/P4_REAL_RF_ONE_STEP_PREAUDIT_KO.md
          if-no-files-found: warn
          retention-days: 30
