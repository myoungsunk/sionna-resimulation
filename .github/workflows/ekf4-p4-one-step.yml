name: EKF4 P4 audit-first frozen RF one-step LoS Full
on:
  push:
    branches: ['research/ekf4-r3-to-p6-20261014']
    paths:
      - '.github/workflows/ekf4-p4-one-step.yml'
      - 'research/EKF4_P4_ONESTEP_20261014/p4_one_step.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekf4-p4-audited-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audited-one-step-r0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Sparse checkout exact source at event SHA before any testing
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_P4_ONESTEP_20261014/**\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/research/EKF3_INDEPENDENT_20261013/ekf3.py\n/research/EKF3_INDEPENDENT_20261013/p2_frozen_rf_one_step.py\n/.github/workflows/ekf4-p4-one-step.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source/contract audit BEFORE any numerical verification
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_P4_ONESTEP_20261014/p4_one_step.py --phase audit --out "$RUNNER_TEMP/p4_source_audit" | tee "$RUNNER_TEMP/p4_audit.log"
      - name: Checkout only frozen selected RF H/LoS/LUT/source assets after audit
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,pathlib; m=json.loads(pathlib.Path("research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json").read_text()); c=next(x for x in m["cases"] if x["id"]=="R2_aA_m0"); select=[a["path"] for a in m["assets"] if a["kind"] in ("FREQUENCY","HS_LUT","HS_LUT_META","AUDITED_SOURCE","SENSOR_CONFIG","TIMELINE_TNONE") or a["path"] in (c["los_path"],c["full_path"],c["samples_path"])]; f=pathlib.Path(".git/info/sparse-checkout"); f.open("a").writelines("/"+p+"\n" for p in select)'
          printf '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/**\n' >> .git/info/sparse-checkout
          git checkout --detach HEAD
      - name: Install pinned scientific dependencies AFTER audit
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: P4 frozen R0 same-prior RF one-step and 4state mathematics
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_P4_ONESTEP_20261014/p4_one_step.py --phase evaluate --audit "$RUNNER_TEMP/p4_source_audit" --out "$RUNNER_TEMP/p4_outputs" | tee "$RUNNER_TEMP/p4_run.log"
      - name: Preserve source audit and one-step outputs on all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p4-r0-one-step-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p4_source_audit/**
            ${{ runner.temp }}/p4_outputs/**
            ${{ runner.temp }}/p4_audit.log
            ${{ runner.temp }}/p4_run.log
            research/EKF4_P4_ONESTEP_20261014/*.py
            research/EKF4_P4_ONESTEP_20261014/*.md
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
