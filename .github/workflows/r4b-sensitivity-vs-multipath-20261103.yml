name: R4B R5B sensitivity vs RF error exact pose comparison
on:
  push:
    branches: ['codex/r4b-ray-attrib-20261103']
    paths:
      - '.github/workflows/r4b-sensitivity-vs-multipath-20261103.yml'
      - 'research/R4B_RAY_ATTRIB_20261103/sensitivity_vs_multipath.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sparse checkout exact original immutable per-pose gradient and residual tables
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'LIST'
          /research/R4B_RAY_ATTRIB_20261103/sensitivity_vs_multipath.py
          /research/DS_MASK_CAUSAL_X1_X2_20261026/pol_azimuth_alloc/C1_PACKETS.csv.gz
          /research/DS_MASK_CAUSAL_X1_X2_20261026/pol_azimuth_alloc/C1B_PACKETS.csv.gz
          LIST
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3
      - name: Exact original Jacobian and multipath residual join
        shell: bash
        run: |
          set -euo pipefail
          python -u research/R4B_RAY_ATTRIB_20261103/sensitivity_vs_multipath.py | tee /tmp/sensitivity_vs_multipath.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4b-r5b-sensitivity-${{ github.run_id }}
          path: |
            /tmp/sensitivity_vs_multipath.log
            /tmp/sensitivity_vs_multipath.csv
          retention-days: 30
