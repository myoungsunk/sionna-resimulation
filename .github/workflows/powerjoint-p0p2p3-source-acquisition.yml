name: POWERJOINT P0 P2 P3 pinned source acquisition
on:
  push:
    branches: ['research/powerjoint-p0p2p3-execution-20261016']
    paths: ['.github/workflows/powerjoint-p0p2p3-source-acquisition.yml']
permissions:
  contents: read
jobs:
  immutable-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 4c0682a55298ae33f3495a4c7249f3a8c34633ad
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Read pinned source without changing original branches
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$SOURCE_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/.gitattributes\n/LP_plus45_bank.npz\n/LP_minus45_bank.npz\n/research/R5_N4C_20261015/**\n/research/R5_N4B_20261015/**\n/research/POLE_RECURSIVE_20261016/**\n/research/EXP234_CAUSAL_20261016/**\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/p0p2p3_source"
          cp -a research "$RUNNER_TEMP/p0p2p3_source/"
          python3 - <<'PY'
          import pathlib,json,os
          a={}
          for name in ['LP_plus45_bank.npz','LP_minus45_bank.npz']:
              a[name]=pathlib.Path(name).read_text()
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'p0p2p3_source/LFS_POINTERS.json').write_text(json.dumps(a,indent=2))
          PY
      - name: Try actual original LFS objects, preserve failure separately
        shell: bash
        run: |
          set -uo pipefail
          git lfs version
          git lfs fetch origin "$SOURCE_SHA" --include='LP_plus45_bank.npz,LP_minus45_bank.npz' --exclude='' > "$RUNNER_TEMP/p0p2p3_source/LFS_FETCH.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/p0p2p3_source/LFS_FETCH_EXIT.txt"
          git lfs checkout LP_plus45_bank.npz LP_minus45_bank.npz >> "$RUNNER_TEMP/p0p2p3_source/LFS_FETCH.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p0p2p3_source'
          ptr=json.loads((out/'LFS_POINTERS.json').read_text()); rows=[]
          for name,text in ptr.items():
              fields=dict(line.split(' ',1) for line in text.splitlines())
              expected=fields['oid'].split(':')[1]; size=int(fields['size']); p=pathlib.Path(name)
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              ok=p.stat().st_size==size and h.hexdigest()==expected
              rows.append({'name':name,'expected_sha256':expected,'actual_sha256':h.hexdigest(),'expected_bytes':size,'actual_bytes':p.stat().st_size,'verified_original_bytes':ok})
              if ok: shutil.copy2(p,out/name)
          receipt={'source_sha':os.environ['SOURCE_SHA'],'scientific_pass':False,'stage':'INPUT_ACQUISITION_ONLY','files':rows,'readiness':'ORIGINAL_BANKS_AVAILABLE' if all(r['verified_original_bytes'] for r in rows) else 'BLOCKED_INPUT'}
          (out/'SOURCE_RECEIPT.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
          PY
      - name: Preserve source receipt and only verified original banks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerjoint-p0p2p3-source-${{ github.run_id }}
          path: ${{ runner.temp }}/p0p2p3_source/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
