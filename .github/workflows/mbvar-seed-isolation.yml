name: MB_VAR R5-B seed-factor diagnostic
on:
  push:
    branches: ['research/mbvar-e2-e5-revalidation-20261029']
    paths: ['.github/workflows/mbvar-seed-isolation.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  DEST: research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 3, 8, 9]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_control_correction_20261029
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Reuse identical hashed inputs
        run: gh run download 40830330560 --repo "$GITHUB_REPOSITORY" --name reval-inputs-40830330560 --dir "$RUNNER_TEMP/inputs"
      - name: Cross sensor/control seed with four initial-state seeds
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/inputs"
          mkdir -p "$RUNNER_TEMP/out"
          python -m py_compile "$DEST/seed_isolation.py"
          python -u "$DEST/seed_isolation.py" --control-seed '${{ matrix.seed }}' --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/LOG_SEED_${{ matrix.seed }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seed-factor-${{ matrix.seed }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
  aggregate:
    needs: seed
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2 tabulate==0.9.0
      - name: Aggregate factorial results
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards" "$RUNNER_TEMP/out"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'seed-factor-*' --dir "$RUNNER_TEMP/shards"
          find "$RUNNER_TEMP/shards" -type f -exec cp {} "$RUNNER_TEMP/out/" \;
          cp "$DEST/seed_isolation.py" "$RUNNER_TEMP/out/"
          python "$DEST/seed_isolation.py" --aggregate --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seed-factor-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: Publish additive seed-factor evidence
        if: always()
        run: |
          set -euo pipefail
          TARGET="$DEST/results/seed_run_$GITHUB_RUN_ID"
          mkdir -p "$TARGET"; cp -R "$RUNNER_TEMP/out/". "$TARGET/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"; git commit -m "R5-B seed-factor evidence run $GITHUB_RUN_ID" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git -c http.extraheader="$AUTH" pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
