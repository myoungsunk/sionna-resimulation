name: EKF4 R5 audited expanded 185 candidate reconciliation
on:
  push:
    branches: ['research/ekf4-r5-expanded-reconciled-20261015']
    paths:
      - '.github/workflows/ekf4-r5-panel-reconcile.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/p4_panel_reconcile*.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preaudit-then-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout source exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/p4_panel_reconcile*.py\n/.github/workflows/ekf4-r5-panel-reconcile.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory read-only source audit before interpreting numbers
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p4_panel_reconcile_audit.py --out "$RUNNER_TEMP/r5_final_preaudit" | tee "$RUNNER_TEMP/r5_final_audit.log"
      - name: Retrieve two immutable source evidence archives
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11945850940/zip > "$RUNNER_TEMP/r5_original_expanded.zip"
          echo 'b9c1b1af65aa7ded34b331d6d775fc06721fa8e46abb3c96d3f3ec157bb57ffd  '"$RUNNER_TEMP/r5_original_expanded.zip" | sha256sum -c
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11945896554/zip > "$RUNNER_TEMP/r5_original_three.zip"
          echo '66b74f1cc2d82a4a6acff6faf6bf27fbd414722bca29ddb187f2f5f0aa3cfde9  '"$RUNNER_TEMP/r5_original_three.zip" | sha256sum -c
      - name: Reconcile all 185 original immutable cases with three strict no-step roundtrip facts
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p4_panel_reconcile.py --panel "$RUNNER_TEMP/r5_original_expanded.zip" --three "$RUNNER_TEMP/r5_original_three.zip" --audit "$RUNNER_TEMP/r5_final_preaudit/AUDIT.json" --out "$RUNNER_TEMP/r5_final" | tee "$RUNNER_TEMP/r5_final.log"
      - name: Preserve audit and reconciliation on failure too
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-r5-reconciled-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r5_final_preaudit/**
            ${{ runner.temp }}/r5_final/**
            ${{ runner.temp }}/r5_final_audit.log
            ${{ runner.temp }}/r5_final.log
            research/EKF4_RANGE_S_STAGED_20261014/p4_panel_reconcile*.py
            .github/workflows/ekf4-r5-panel-reconcile.yml
          if-no-files-found: warn
