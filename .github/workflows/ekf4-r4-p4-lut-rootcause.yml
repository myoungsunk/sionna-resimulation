name: EKF4 R4 P4 audit-first LUT numerical root-cause diagnostic
on:
  push:
    branches: ['research/ekf4-r4-p4-lut-rootcause-20261015']
    paths:
      - '.github/workflows/ekf4-r4-p4-lut-rootcause.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/p4_lut_*.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-frozen-failure-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exact source checkout and readonly frozen P3 LUT
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/ekf4-r4-p4-lut-rootcause.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory code source and failure provenance audit before diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p4_lut_diag_audit.py --out "$RUNNER_TEMP/p4_d4_pre_audit" | tee "$RUNNER_TEMP/p4_d4_audit.log"
      - name: Fetch original P4 failed MAP archive with SHA256
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11937707221/zip > "$RUNNER_TEMP/p4_original_failures.zip"
          echo 'db1bda22f9fdbb56ba95817ea4c02016bba294c35a4c126daca448284a285ec4  '"$RUNNER_TEMP/p4_original_failures.zip" | sha256sum -c
      - name: Install pinned numerics only after code audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Audit-bound immutable representative failure replays and LUT knot diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p4_lut_failure_diag.py --artifact "$RUNNER_TEMP/p4_original_failures.zip" --audit "$RUNNER_TEMP/p4_d4_pre_audit/P4_D4_PREAUDIT.json" --out "$RUNNER_TEMP/p4_d4_result" | tee "$RUNNER_TEMP/p4_d4.log"
      - name: Preserve even blocked/failed audit and read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-r4-p4-d4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p4_d4_pre_audit/**
            ${{ runner.temp }}/p4_d4_result/**
            ${{ runner.temp }}/p4_d4_audit.log
            ${{ runner.temp }}/p4_d4.log
            research/EKF4_RANGE_S_STAGED_20261014/p4_lut_diag_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/p4_lut_failure_diag.py
            .github/workflows/ekf4-r4-p4-lut-rootcause.yml
          if-no-files-found: warn
          retention-days: 30
