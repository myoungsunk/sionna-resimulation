name: POWERJOINT S1 preserve existing outputs only
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s1-preserve.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S0_CORRECTIONS/github_io.py
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/preserve_outputs.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install requests==2.32.5
      - name: Preserve full existing S1 archives and byte-identical summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/preserve_outputs.py --cache '${{ runner.temp }}/s1-output-preservation'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s1-preservation-${{ github.run_id }}
          path: research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/
          retention-days: 30
