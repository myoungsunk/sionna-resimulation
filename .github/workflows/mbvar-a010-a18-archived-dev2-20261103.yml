name: MBVAR A010 A18 latest-code real R5 precision archived DEV2 K1 K2 (NO science)
on:
  push:
    branches:
      - 'implement/mbvar-a010-a18-failclosed-20261103'
    paths:
      - '.github/workflows/mbvar-a010-a18-archived-dev2-20261103.yml'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit/a010_r5_archived_dev2_qualification.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MKL_DYNAMIC: 'FALSE'
  PIP_PKGS: numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 pytest==8.3.3
jobs:
  archived-dev2-r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/scripts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/contracts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/RUN_REQUEST.json
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/results/P2_A010P0_GEN_run_41269011836
      - name: Original contract and forensic input guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"status": "FROZEN"' "$EXP/contracts/AMENDMENT-010.md"; then exit 1; fi
          echo '9e6b8bd72f9e935315eecdfd0c38c42f18db58f535c1596dbbfe391db383b77b  '"$EXP/RUN_REQUEST.json" | sha256sum -c -
          test "$(git hash-object "$EXP/code/contract_lock.py")" = 'a62d43dfce65d7a9ec9cc061916ecc836960d4e9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check $PIP_PKGS
      - name: Fetch pinned FFD input code only (FETCH_RF=0)
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Run exact archived DEV2 K1 and K2 common-probe R5 qualification
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          mkdir -p "$RUNNER_TEMP/r5"
          python "$EXP/audit/a010_r5_archived_dev2_qualification.py" \
            --out "$RUNNER_TEMP/r5/R5_ARCHIVED_DEV2_TERMINAL_CERT.json" \
            2>&1 | tee "$RUNNER_TEMP/r5/R5_ARCHIVED_DEV2_EXECUTION.log"
          python - "$RUNNER_TEMP/r5/R5_ARCHIVED_DEV2_TERMINAL_CERT.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert [x["case"] for x in r["cases"]]==["K1","K2"]
          assert all(len(x["terminal_solutions"])==10 for x in r["cases"])
          assert all(x["negative_case_mutations_rejected"]==["cap","descent","nonfinite"] for x in r["cases"])
          assert r["A010_SCIENCE_FROZEN"] is False
          assert r["DEV3"]==r["HOLDOUT2"]==r["RT"]=="NO-GO"
          print("A010_R5_DEV2_RAW_TERMINAL_RECORDS_VERIFIED")
          PY
      - name: Fail if repository worktree modified
        if: always()
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-a18-archived-dev2-${{ github.run_id }}
          path: ${{ runner.temp }}/r5/
          if-no-files-found: warn
          retention-days: 90
