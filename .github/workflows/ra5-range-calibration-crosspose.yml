name: RA5 range calibrated integer and fractional ToA cross-pose heldout transfer
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-range-calibration-crosspose.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/range_bias_cross_pose_transfer.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  SRC: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  crosspose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: R5_aA_m0
            poses: '100,900'
          - case: R2_aA_m45
            poses: '200,500'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3
      - name: Verify source H, frequency and original pose coordinates SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source";mkdir -p "$ROOT"
          git init --bare "$RUNNER_TEMP/src.git"
          git -C "$RUNNER_TEMP/src.git" remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -C "$RUNNER_TEMP/src.git" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$SRC"
          CASE="${{ matrix.case }}"
          BLK=results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
          git -C "$RUNNER_TEMP/src.git" cat-file -p "$SRC:$BLK/FULL_RF/H_$CASE.npy" > "$ROOT/H_$CASE.npy"
          git -C "$RUNNER_TEMP/src.git" cat-file -p "$SRC:$BLK/$CASE/SAMPLES.json" > "$ROOT/SAMPLES_$CASE.json"
          git -C "$RUNNER_TEMP/src.git" cat-file -p "$SRC:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
          python - "$ROOT" "$CASE" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);case=sys.argv[2]
          lock=json.loads(pathlib.Path('research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json').read_text())
          assets={x['path']:x for x in lock['assets'] if x.get('sha256')}
          files={}
          for key,name in [('FULL_RF/H_'+case+'.npy','H_'+case+'.npy'),(case+'/SAMPLES.json','SAMPLES_'+case+'.json'),('freqs_hz.npy','freqs_hz.npy')]:
              p=next(a for a in assets if a.endswith(key))
              b=(root/name).read_bytes()
              got=hashlib.sha256(b).hexdigest()
              assert got==assets[p]['sha256'],p
              files[name]=got
          (root/'SOURCE_LOCK.json').write_text(json.dumps({'H_sha256':files['H_'+case+'.npy'],
           'samples_sha256':files['SAMPLES_'+case+'.json'],'freq_sha256':files['freqs_hz.npy']},indent=2))
          PY
      - name: Train one original pose, evaluate the other without target bias fitting
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python -u "$EXP/range_bias_cross_pose_transfer.py" --case "${{ matrix.case }}" \
            --poses "${{ matrix.poses }}" --source "$RUNNER_TEMP/source" --lock "$RUNNER_TEMP/source/SOURCE_LOCK.json" \
            --train 128 --test 192 --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-range-crosspose-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
