name: Refit N4-B POWER using corrected near-pole 9519 Full RF labels
on:
  push:
    branches: ['research/lut-pole-integration-replay-20261016']
    paths:
      - '.github/workflows/lut-pole-power-retrain.yml'
      - 'research/POLE_LUT_INTEGRATION_20261016/pole_power_refit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fit_corrected_power_and_r2_recursive:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact source revision frozen N4-B and N4-C and pole-FFDLUT adapter checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/POLE_LUT_INTEGRATION_20261016/pole_power_refit.py\n/research/POLE_LUT_SINGULARITY_20261016/pole_lut_fix.py\n/research/R5_N4B_20261015/n4b_rf_errors.py\n/research/R5_N4C_20261015/n4c_joint_sr4.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/lut-pole-power-retrain.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory SHA pinned source audit before retraining
        shell: bash
        run: |
          set -euo pipefail
          python research/POLE_LUT_INTEGRATION_20261016/pole_power_refit.py --phase pre --out "$RUNNER_TEMP/refit_pre" | tee "$RUNNER_TEMP/refit_pre.log"
      - name: Fetch corrected 9519 labels and original frozen RF N4B N4C archives with hashes
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/12026687616/zip > "$RUNNER_TEMP/pole.zip"
          echo 'b0d41653fbecf8a01c4773e534edae8f501198cb7bf4cc27f066ccca66864636  '"$RUNNER_TEMP/pole.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/n4b.zip"
          echo '170a646f8167f1e440316abf42b614afa4efc3d77037c0e19bf470a817fc334b  '"$RUNNER_TEMP/n4b.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/rf.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/rf.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11962810669/zip > "$RUNNER_TEMP/n4c.zip"
          echo 'f807346e806adcc88ce5772d901cb82f83e423d56c1b5f7b846b6871fcaefad9  '"$RUNNER_TEMP/n4c.zip" | sha256sum -c
      - name: Install exact frozen N4B scikit-learn and numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Original N4-B regression SPD and original Joint/SR source mathematical canaries
        shell: bash
        run: |
          set -euo pipefail
          python research/POLE_LUT_INTEGRATION_20261016/pole_power_refit.py --phase test | tee "$RUNNER_TEMP/refit_test.log"
      - name: Strict source reproduction 9519 and retrain 5 corrected GT labels and paired real recursive filter
        shell: bash
        run: |
          set -euo pipefail
          python research/POLE_LUT_INTEGRATION_20261016/pole_power_refit.py --phase run --out "$RUNNER_TEMP/refit_results" --audit "$RUNNER_TEMP/refit_pre/PRE_AUDIT.json" --pole "$RUNNER_TEMP/pole.zip" --n4b "$RUNNER_TEMP/n4b.zip" --rf "$RUNNER_TEMP/rf.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/refit_run.log"
      - name: Preserve all corrected model and unchanged original audit parity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pole-power-retrain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/refit_pre/**
            ${{ runner.temp }}/refit_results/**
            ${{ runner.temp }}/refit_pre.log
            ${{ runner.temp }}/refit_test.log
            ${{ runner.temp }}/refit_run.log
          if-no-files-found: warn
          retention-days: 30
