name: EKF4 audited frozen RF P3-P6 scoped execution
on:
  push:
    branches: ['research/ekf4-p3p6-frozen-reuse-20261014']
    paths:
      - '.github/workflows/ekf4-frozen-rf-p3p6.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf_adapter4.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf_stage_audit.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-rf-p3p6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-audited-p3-through-p6:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact model plus only frozen LUT and manifest assets
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**\n/.github/workflows/ekf4-frozen-rf-p3p6.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Fetch previously source-verified 14 frozen case/channel traces
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/frozen_rf_one_step.zip"
          test -s "$RUNNER_TEMP/frozen_rf_one_step.zip"
      - name: Mandatory pre-run P3 source/archive/provenance audit
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_stage_audit.py --stage P3 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --out "$RUNNER_TEMP/AUDIT_P3" | tee "$RUNNER_TEMP/audit_P3.log"
      - name: Install pinned numerical tools after initial source audit
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: P3 frozen raw-S/r forward-model parity verification
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py --stage P3 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --audit "$RUNNER_TEMP/AUDIT_P3/PRE_RUN_AUDIT.json" --out "$RUNNER_TEMP/P3" | tee "$RUNNER_TEMP/P3.log"
      - name: Mandatory P4 audit (same SHA; P3 source parity required)
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_stage_audit.py --stage P4 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --prior "$RUNNER_TEMP/P3" --out "$RUNNER_TEMP/AUDIT_P4"
      - name: P4 3/4-state same-prior RF joint update parity
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py --stage P4 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --audit "$RUNNER_TEMP/AUDIT_P4/PRE_RUN_AUDIT.json" --out "$RUNNER_TEMP/P4" | tee "$RUNNER_TEMP/P4.log"
      - name: Mandatory P5 audit (position-integrated G3 claim excluded)
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_stage_audit.py --stage P5 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --prior "$RUNNER_TEMP/P3" --out "$RUNNER_TEMP/AUDIT_P5"
      - name: P5 limited fixed-position nonlinear Heading posterior quadrature
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py --stage P5 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --audit "$RUNNER_TEMP/AUDIT_P5/PRE_RUN_AUDIT.json" --out "$RUNNER_TEMP/P5" | tee "$RUNNER_TEMP/P5.log"
      - name: Mandatory P6 audit (P3 data parity independent from G3 failure)
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_stage_audit.py --stage P6 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --prior "$RUNNER_TEMP/P3" --out "$RUNNER_TEMP/AUDIT_P6"
      - name: P6 recursive 3/4-state R0 LoS-Full joint fusion, seed0
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py --stage P6 --archive "$RUNNER_TEMP/frozen_rf_one_step.zip" --audit "$RUNNER_TEMP/AUDIT_P6/PRE_RUN_AUDIT.json" --out "$RUNNER_TEMP/P6" | tee "$RUNNER_TEMP/P6.log"
      - name: Preserve each scoped audit, numerical outcome and trace source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-frozen-rf-p3p6-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/AUDIT_P3/**
            ${{ runner.temp }}/AUDIT_P4/**
            ${{ runner.temp }}/AUDIT_P5/**
            ${{ runner.temp }}/AUDIT_P6/**
            ${{ runner.temp }}/P3/**
            ${{ runner.temp }}/P4/**
            ${{ runner.temp }}/P5/**
            ${{ runner.temp }}/P6/**
            ${{ runner.temp }}/P3.log
            ${{ runner.temp }}/P4.log
            ${{ runner.temp }}/P5.log
            ${{ runner.temp }}/P6.log
            research/EKF4_RANGE_S_STAGED_20261014/rf_adapter4.py
            research/EKF4_RANGE_S_STAGED_20261014/rf_staged.py
            research/EKF4_RANGE_S_STAGED_20261014/P3_P6_FROZEN_RF_CONTRACT_KO.md
            .github/workflows/ekf4-frozen-rf-p3p6.yml
          if-no-files-found: warn
          retention-days: 30
