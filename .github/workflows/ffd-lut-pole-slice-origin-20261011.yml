name: Native LoS original FFD LUT theta0 pole origin diagnostic
on:
  push:
    branches: [codex/ffd-pole-origin-audit-20261011]
    paths:
      - '.github/workflows/ffd-lut-pole-slice-origin-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_pole_slice_lut_native_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-lut-pole:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_pole_slice_lut_native_diagnostic.py
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/CASES.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.4 pandas==2.2.3 tabulate==0.9.0
      - name: Pole theta0/2/4 native LoS source check
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_pole_slice_lut_native_diagnostic.py
          python research/HEADING_RELIABILITY_20261010/run_pole_slice_lut_native_diagnostic.py --out results_audit/POLE_SLICE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ffd-lut-pole-slice-20261011
          path: results_audit/
          if-no-files-found: warn
          retention-days: 30
