name: Stage A V01 native5 legacy12 full archive equivalence
on:
  push:
    branches: [codex/p0-close-p1-factorial-20261011]
    paths:
      - '.github/workflows/p0-finish-v01-native5-archive-20261011.yml'
      - 'research/P0_FINISH_20261011/V01_archive_family_parity.py'
      - 'research/P0_FINISH_20261011/prepare_V01_original_inputs.py'
  workflow_dispatch:
concurrency:
  group: p0-v01-archive-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  v01-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /research/P0_RESTORE_20261011/
            /research/P0_FINISH_20261011/
            /results/DRIVE_SIM_NOISY_PROBE_20261010/RUN_01a125b3/
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R2.json
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R4.json
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R5.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/freqs_hz.npy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.4 pandas==2.2.3
      - name: Validate original archive input objects and matched full-channel data
        run: |
          python -m py_compile research/P0_FINISH_20261011/V01_archive_family_parity.py research/P0_FINISH_20261011/prepare_V01_original_inputs.py
          python -X utf8 research/P0_FINISH_20261011/prepare_V01_original_inputs.py --out stageA_results/V01_FULL_ARCHIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-a-v01-native5-legacy12-archive-20261011
          path: |
            stageA_results/V01_FULL_ARCHIVE/*.json
            stageA_results/V01_FULL_ARCHIVE/*.csv
            stageA_results/V01_FULL_ARCHIVE/*.csv.gz
            stageA_results/V01_FULL_ARCHIVE/source_snapshot/
          if-no-files-found: warn
          retention-days: 30
