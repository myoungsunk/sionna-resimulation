name: RA5 P2 original seven H source-locked 3x3 joint covariance and LORO predictive calibration
on:
  push:
    branches: [audit/ra5-prior-joint-recursive-p0-20261030]
    paths:
      - '.github/workflows/ra5-online-p2-covariance-preflight.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/joint_covariance_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
  SRC: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  P2_covariance_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
            docs/research-governance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
      - name: Verify upstream P0 and noise-switch source QA, not physical result
        shell: bash
        run: |
          set -euo pipefail
          REPO=myoungsunk/sionna-resimulation
          test "$(gh api "repos/$REPO/actions/runs/40994216940" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/41000128768" --jq '.conclusion')" = success
          export REFLECT_ROOT="$RUNNER_TEMP/rf"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
      - name: Fetch original 7 H and source pose table with immutability checks in Python
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rf"
          BLK=results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
          for CASE in R2_aA_m0 R2_aB_m0 R2_aA_m45 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            git -C "$ROOT/.src.git" cat-file -p "$SRC:$BLK/FULL_RF/H_$CASE.npy" > "$ROOT/H_$CASE.npy"
            git -C "$ROOT/.src.git" cat-file -p "$SRC:$BLK/$CASE/SAMPLES.json" > "$ROOT/SAMPLES_$CASE.json"
          done
          git -C "$ROOT/.src.git" cat-file -p "$SRC:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
      - name: Run 3 route-block folds using actual original H and train-only r-s0-ds1 covariance
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/rf"
          for HELD in R2 R4 R5; do
            mkdir -p "$RUNNER_TEMP/result/$HELD"
            python -u "$EXP/joint_covariance_preflight.py" --rf-root "$RUNNER_TEMP/rf" \
              --input-manifest research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json \
              --held-route "$HELD" --out "$RUNNER_TEMP/result/$HELD" | tee "$RUNNER_TEMP/result/$HELD/RUN_LOG.txt"
          done
      - name: Check exact 3-fold denominator and record contract/output SHAs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/result";mkdir -p "$ROOT"
          python - "$ROOT" <<'PY'
          import datetime,hashlib,json,pathlib,sys,os
          p=pathlib.Path(sys.argv[1])
          files=list(p.rglob("RA5_P2_QA.json"))
          if len(files)==3:
              q=[json.loads(x.read_text()) for x in files]
              assert {r["held_route"] for r in q}=={"R2","R4","R5"}
              assert all(r["status"]=="PASS_RA5_P2_SOURCE_COVARIANCE_ALGEBRA_AND_HELDOUT_DIAG" for r in q)
          receipt=dict(status="COMPLETED" if len(files)==3 else "PARTIAL_FAILURE",
             role="IMPLEMENTER",contract="RA5-ONLINE-P0-DRAFT",
             full_execution_sha=os.environ["GITHUB_SHA"],
             source_sha="9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13",
             n_held_routes=len(files),records=[x.name for x in files],
             timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat(),
             no_new_RT=True,independent_auditor=False)
          (p/"RA5_P2_RUN_RECEIPT.json").write_text(json.dumps(receipt,indent=2))
          PY
          (cd "$ROOT" && find . -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-p2-joint-covariance-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
