name: MBVAR PRR RT preexecution static READY checks (NO SIONNA CALL)
on:
  push:
    branches: [prepare/mbvar-prr-sm0-native-rt-runnable-20261104]
    paths:
      - '.github/workflows/mbvar-prr-native-rt-static-ready-20261104.yml'
      - '.github/workflows/mbvar-prr-native-rt-manual-8224-20261104.yml'
      - '.github/workflows/mbvar-prr-sm0-onebin-sionna-rt-20261104.yml'
      - 'research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/**'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  static-no-raytracing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/INPUT_LOCK_DRAFT_002.json
            /.github/workflows/mbvar-prr-native-rt-manual-8224-20261104.yml
            /.github/workflows/mbvar-prr-sm0-onebin-sionna-rt-20261104.yml
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/**
            /src/qclean_uwb/**
            /scripts/corridor_sionna_run.py
            /scripts/g2_completion/sionna_native_runtime.py
            /results/SIONNA_NATIVE41_REFRESH_20260925_01a0d84e/CONFIG.json
            /results/SIONNA_G2_FFD_NOFLIP_20260924_01a0d30b/bank/BANK_MANIFEST.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/freqs_hz.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/H_LoS_R4_aB_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aB_m0/MANIFEST.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aB_m0/SAMPLES.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/INPUTS/timeline_R4_Tnone.csv
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned non-raytracing arithmetic dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.14.1' 'pytest==8.3.3' 'PyYAML==6.0.2'
      - name: Parse both YAML workflows and assert manual ONLY / no solver-on-push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml,pathlib
          for name in ('mbvar-prr-native-rt-manual-8224-20261104.yml',
                       'mbvar-prr-sm0-onebin-sionna-rt-20261104.yml'):
            path=pathlib.Path('.github/workflows')/name
            assert path.is_file(),path
            doc=yaml.safe_load(path.read_text())
            on=doc.get('on',doc.get(True))
            assert isinstance(on,dict) and 'workflow_dispatch' in on,(name,on)
            assert 'schedule' not in on
            if '8224' in name:
              assert set(on)=={'push','workflow_dispatch'}
              assert on['push']['branches']==['prepare/mbvar-prr-sm0-native-rt-runnable-20261104']
              assert on['push']['paths']==['research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/RT_EXECUTION_APPROVAL_EFFECTIVE.json']
            else:
              assert set(on)=={'workflow_dispatch'}
            if '8224' in name:
              assert len(doc['jobs'])==5
              assert all(x in doc['jobs'] for x in ('guard','c00','c00_qa','paired','paired_qa'))
              assert doc['jobs']['paired']['needs']==['guard','c00_qa']
              assert doc['jobs']['paired']['strategy']['max-parallel']==4
            print('GITHUB_RT_MANUAL_ONLY_YAML_VALID',name)
          PY
      - name: Syntax validation for full pilot and one-bin hotfix
        run: |
          set -euo pipefail
          python -m py_compile \
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/run_onebin.py \
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/native_rt_batch.py \
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/native_rt_aggregate.py
      - name: Verify all original inputs 4 poses and authorization stays CLOSED
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ready"
          python research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/native_rt_batch.py --static \
            | tee "$RUNNER_TEMP/ready/STATIC_SOURCE_QA.log"
      - name: Frozen safety, estimator and scene negative fixtures WITHOUT Sionna import
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -v -p no:cacheprovider \
            research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/test_native_rt_static.py \
            2>&1 | tee "$RUNNER_TEMP/ready/P3_STATIC_TESTS.log"
      - name: Assert scripts not mutated
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mbvar-prr-rt-static-ready-${{ github.run_id }}
          path: ${{ runner.temp }}/ready/
          if-no-files-found: warn
          retention-days: 90
