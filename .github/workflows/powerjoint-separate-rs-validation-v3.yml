name: POWERJOINT separate Range-s recursive validation V3
on:
  push:
    branches: ['research/powerjoint-separate-marginals-correlation-20261020']
    paths: ['.github/workflows/powerjoint-separate-rs-validation-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/pj_output
  PJ_BANK_DOWNLOAD: /tmp/pj_bankdownload
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        case: [R2_aA_m0, R2_aA_m45, R2_aB_m0, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 tabulate==0.9.0
      - name: Stage original RF and already-trained frozen parameters unchanged
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_BANK_DOWNLOAD"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39375640360 --repo myoungsunk/sionna-resimulation --name separate-rs-prepared-39375640360 --dir "$PJ_OUT"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: B0 L2 Full LoS recursive nine-arm comparison
        run: |
          set -euo pipefail
          python -u research/PJ_SEPARATE_RS_20261020/replay_rounding_checked.py --phase replay --case '${{ matrix.case }}'
      - name: Preserve every saved state and matrix for independent rescoring
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: separate-rs-final-replay-${{ matrix.case }}-${{ github.run_id }}
          path: |
            /tmp/pj_output/*_TRACE.npz
            /tmp/pj_output/R*_SCORES.csv
            /tmp/pj_output/*_QA.csv
            /tmp/pj_output/*_UPDATE_ORIGINS.csv.gz
            /tmp/pj_output/*POSE_QUANTIZATION_QA.json
            /tmp/pj_output/ACTUAL_REPLAY_EXECUTED.py
            /tmp/pj_output/POSE_ROUNDING_FIX.json
            /tmp/pj_output/MATH_QA.json
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Re-score actual saved traces and join all completed comparisons
        run: |
          set -euo pipefail
          mkdir -p "$PJ_OUT/prepared"
          gh run download 39375640360 --repo myoungsunk/sionna-resimulation --name separate-rs-prepared-39375640360 --dir "$PJ_OUT/prepared"
          gh run download "${{ github.run_id }}" --repo myoungsunk/sionna-resimulation --pattern 'separate-rs-final-replay-*' --dir "$PJ_OUT"
          cp -r research/PJ_SEPARATE_RS_20261020 "$PJ_OUT/FINAL_SOURCE"
          python -u research/PJ_SEPARATE_RS_20261020/summarize_filtered.py
          cat "$PJ_OUT/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish all numerical results QA and code
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_${{ github.run_id }}
          path: /tmp/pj_output/**
          retention-days: 30
          if-no-files-found: error
