name: MBVAR A010 canonical input technical smoke
on:
  push:
    branches:
      - 'research/mbvar-info-a010-canonical-smoke-20261101'
    paths:
      - '.github/workflows/mbvar-a010-canonical-smoke-20261101.yml'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/a10_canonical.py'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/s1v5.py'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/c3v5.py'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests/test_a10_canonical.py'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit/a10_canonical_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a010-canonical-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout only technical code and previous forensic evidence
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '%s\n' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/a10_canonical.py' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/s1v5.py' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/c3v5.py' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests/test_a10_canonical.py' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit/a10_canonical_smoke.py' \
            '/research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/results/P2_A010P0_GEN_run_41269011836/**' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install smoke dependencies
        run: python -m pip install numpy==2.1.3 pytest==8.3.4
      - name: Compile frozen-safe S1V5/C3V5 draft code without imports or DEV3
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
          python -m py_compile "$ROOT/code/a10_canonical.py" "$ROOT/code/s1v5.py" "$ROOT/code/c3v5.py"
      - name: Execute negative-fixture tests without RF or new fields
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
          python -m pytest -q "$ROOT/tests/test_a10_canonical.py" | tee "$RUNNER_TEMP/a10_canonical_pytest.log"
      - name: Produce machine-readable technical smoke receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
          python "$ROOT/audit/a10_canonical_smoke.py" --out "$RUNNER_TEMP/a10_canonical_smoke.json"
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a010-canonical-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a10_canonical_pytest.log
            ${{ runner.temp }}/a10_canonical_smoke.json
          if-no-files-found: warn
          retention-days: 30
