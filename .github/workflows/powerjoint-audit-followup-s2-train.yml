name: POWERJOINT followup S2 fit frozen old-route models only
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s2-train.yml]
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: work/source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/**
            /research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T0_INPUTS/INPUT_RECEIPT.json
            /research/POWERJOINT_AUDIT_RERUN_20261020/scalar_power.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T9_SPEC/TRAIN_PARAMS.json
            /research/R5_N4B_20261015/n4b_rf_errors.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.5
      - name: Restore immutable original inputs with full SHA checks
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
      - name: Train four folds once and certify scalar/cache/serialization parity
        working-directory: work
        run: python -u source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/train.py --execution-root . --out s2_train
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s2-train-${{ github.run_id }}
          path: |
            work/s2_train
            work/RESTORE_RECEIPT.json
          retention-days: 30
