name: N4-Q Q0-Q3 geometry observability versus RF integrity
on:
  push:
    branches: ['research/n4q-geometry-integrity-staged-20261015']
    paths:
      - '.github/workflows/n4q-q0q3-integrity.yml'
      - 'research/N4_Q_GEOM_RF_20261015/q0q3_geometry_integrity.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n4q-geom-integrity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen_q0_q1_q2_q3:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact sparse original FFD and RF checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/N4_Q_GEOM_RF_20261015/q0q3_geometry_integrity.py\n/research/R5_N4B_20261015/n4b_rf_errors.py\n/research/R5_N4B_POL_V1_20261015/n4b_pol_geometry.py\n/research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/PHYSICS_RS_STAGED_20261015/code/features.py\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/n4q-q0q3-integrity.yml\n' > .git/info/sparse-checkout
          BASE='results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C'
          printf '/%s/FULL_RF/*.npy\n/%s/H_LoS_*.npy\n/%s/freqs_hz.npy\n' "$BASE" "$BASE" "$BASE" >> .git/info/sparse-checkout
          for CASE in R2_aA_m0 R2_aA_m45 R2_aB_m0 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            printf '/%s/%s/SAMPLES.json\n' "$BASE" "$CASE" >> .git/info/sparse-checkout
          done
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory pinned FFD RF observer source and raw input audit before numerical work
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q_GEOM_RF_20261015/q0q3_geometry_integrity.py --phase pre --out "$RUNNER_TEMP/n4q_pre" | tee "$RUNNER_TEMP/n4q_pre.log"
      - name: Download validated original RF and original R2 recursive archives
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/RAW_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/RAW_RF.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/RAW_R2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/RAW_R2.zip" | sha256sum -c
      - name: Pinned numerical dependencies after audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Synthetic FFD geometry information and clean RF negative tests
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q_GEOM_RF_20261015/q0q3_geometry_integrity.py --phase test | tee "$RUNNER_TEMP/n4q_test.log"
      - name: Execute Q1 geometry Q2 paired native-Los RF errors Q3 two-axis confusion
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q_GEOM_RF_20261015/q0q3_geometry_integrity.py --phase run --out "$RUNNER_TEMP/n4q_output" --audit "$RUNNER_TEMP/n4q_pre/Q0_PRE_AUDIT.json" --rf "$RUNNER_TEMP/RAW_RF.zip" --r2 "$RUNNER_TEMP/RAW_R2.zip" | tee "$RUNNER_TEMP/n4q_run.log"
      - name: Always preserve original code failure evidence and numerical outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4q-q0q3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n4q_pre/**
            ${{ runner.temp }}/n4q_output/**
            ${{ runner.temp }}/n4q_pre.log
            ${{ runner.temp }}/n4q_test.log
            ${{ runner.temp }}/n4q_run.log
          if-no-files-found: warn
          retention-days: 30
