name: R1B PREC-V2 prospective 4 full raw recheck
on:
  push:
    branches:
      - research/dlp-r1b-precision-bridge-v1-20261103
    paths:
      - .github/workflows/dlp-r1b-precision-v2-prospective4.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  verify:
    name: Recheck existing 4 Native RT raw arrays by source-only DrJit V2 and independent arithmetic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/DLP_R1B_CH4_20261103/precision_v2/**
            /research/DLP_R1B_CH4_20261103/precision_v1/independent_raw_audit.py
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 mitsuba==3.8.0 drjit==1.3.1
          if ! ldconfig -p | grep -q libLLVM.so; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm-18 libllvm18
          fi
      - name: Restore the original immutable prospective Native solver artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review_input qa
          gh run download 41599666331 --repo myoungsunk/sionna-resimulation             --name r1b-precision-v1-prospective4-41599666331 --dir review_input
          for p in 0075 0305 0610 0809; do
            test -s "review_input/new_native/pose_${p}.npz"
            test -s "review_input/new_native/pose_${p}.json"
          done
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('review_input/new_native/PREC_V1_PROSPECTIVE_NATIVE_QA.json')
          r=json.loads(p.read_text())
          assert r['source_sha']=='f08a376a01ff2be1cd749a6a0d691b2414b2a65f'
          assert r['new_native_pose_ids']==[75,305,610,809]
          assert r['status']=='PROSPECTIVE_NATIVE_NUMERIC_PASS'
          assert r['solver_calls']==2056
          assert r['independent_science_audit']=='PENDING'
          print('ORIGINAL_NEW_NATIVE_ARTIFACT_PROVENANCE_PASS',flush=True)
          PY
      - name: Verify V2 exact DrJit source-only representation on four prospective original arrays
        shell: bash
        run: |
          set -euo pipefail
          python -u research/DLP_R1B_CH4_20261103/precision_v2/solver_matched_delay.py             --raw-dir review_input/new_native --poses 75 305 610 809             --out qa/V2_PROSPECTIVE_4_NUMERICAL_QA.json
      - name: Independent arithmetic audit without importing V2 code or rerunning Native RT
        shell: bash
        run: |
          set -euo pipefail
          python -u research/DLP_R1B_CH4_20261103/precision_v1/independent_raw_audit.py             --raw-dir review_input/new_native             --out qa/INDEPENDENT_4_RAW_AUDIT.json
          python - <<'PY'
          import json, pathlib, hashlib
          v=json.loads(pathlib.Path('qa/V2_PROSPECTIVE_4_NUMERICAL_QA.json').read_text())
          i=json.loads(pathlib.Path('qa/INDEPENDENT_4_RAW_AUDIT.json').read_text())
          assert v['pose_ids']==[75,305,610,809]
          assert v['verdict']=='NUMERIC_PARITY_PASS'
          assert i['status']=='INDEPENDENT_ARITHMETIC_PASS'
          assert i['metrics']['n']==4
          assert i['metrics']['bridge_complex_rms']<=1e-4
          assert all(x['native_tau_equals_source_drjit_tau_on_all_bins_DIAGNOSTIC'] for x in v['records'])
          assert abs(v['counts']['bridge_rms']-i['metrics']['bridge_complex_rms'])<=1e-11
          assert abs(v['counts']['bridge_max']-i['metrics']['bridge_complex_max'])<=1e-11
          files=[]
          for p in sorted(pathlib.Path('qa').glob('*.json')):
            files.append(dict(name=p.name,size_bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
          receipt=dict(status='NUMERICAL_REPRODUCTION_PASS_NOT_SCIENTIFIC_SIGNOFF',
             original_V2_science_status='HOLD_RF_PARITY',all_4_prospective_exact_tau_match=True,
             source_data='GitHub Action 41599666331 immutable raw artifact',
             raw_provenance_still_pending_independent_scientific_signoff=True,files=files)
          pathlib.Path('qa/SUMMARY_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('FOUR_PROSPECTIVE_NATIVE_V2_AND_INDEPENDENT_RECHECK_PASS',flush=True)
          PY
      - name: Archive all crosscheck receipts including failure state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1b-precision-v2-prospective4-${{ github.run_id }}
          path: qa/
          if-no-files-found: warn
          retention-days: 30
