name: Chain hypotheses source preparation and training
on:
  push:
    branches: ['research/powerjoint-chain-hypotheses-20261019']
    paths: ['.github/workflows/chain-hypothesis-prepare.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_LFS_SKIP_SMUDGE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/FFD_P0P3_20261016
            research/R5_N4B_20261015
            research/R5_N4C_20261015
            research/R5_FULLRF_B0_GATES_20261015
            research/PHYSICS_RS_STAGED_20261015
            research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Assemble separate workspace from frozen repository inputs
        shell: bash
        run: |
          set -euo pipefail
          gh run download 39242745585 --repo myoungsunk/sionna-resimulation --name chain-inputs-39242745585 --dir "$RUNNER_TEMP/chain_inputs"
          mkdir -p "$RUNNER_TEMP/model/source/research"
          unzip -q "$RUNNER_TEMP/chain_inputs/physics.zip" -d "$RUNNER_TEMP/model/source"
          unzip -q "$RUNNER_TEMP/chain_inputs/bank.zip" -d "$RUNNER_TEMP/model"
          cp -R research/FFD_P0P3_20261016 "$RUNNER_TEMP/model/source/research/"
          cp -R research/R5_N4B_20261015 "$RUNNER_TEMP/model/source/research/"
          cp -R research/R5_N4C_20261015 "$RUNNER_TEMP/model/source/research/"
          cp -R research/R5_FULLRF_B0_GATES_20261015 "$RUNNER_TEMP/model/source/research/"
          cp -R research/PHYSICS_RS_STAGED_20261015/. "$RUNNER_TEMP/model/source/research/PHYSICS_RS_STAGED_20261015/"
          cp "$RUNNER_TEMP/chain_inputs/RECOVERY_RECEIPT.json" "$RUNNER_TEMP/model/RECOVERY_RECEIPT.json"
      - name: Numerical runtime and equal-marginal augmentation tests
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
          python research/CHAIN_HYPOTHESES_20261019/colored_math.py
      - name: Rebuild SourceFFD labels and held-route train-only models
        shell: bash
        run: |
          set -euo pipefail
          python research/CHAIN_HYPOTHESES_20261019/prepare_data.py --work "$RUNNER_TEMP/model" --inputs "$RUNNER_TEMP/chain_inputs" | tee "$RUNNER_TEMP/model/PREPARE.log"
      - name: Save exact numerical model, inputs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-model-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/model/*.npz
            ${{ runner.temp }}/model/*.json
            ${{ runner.temp }}/model/*.csv*
            ${{ runner.temp }}/model/*.log
            ${{ runner.temp }}/model/source/research/**/*.py
            ${{ runner.temp }}/model/source/research/**/P0_INPUT_MANIFEST.json
            ${{ runner.temp }}/model/source/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/**
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
