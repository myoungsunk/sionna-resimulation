name: POL-XCORR-001 P0_PREFLIGHT (DRAFT v0.2, label-free)
on:
  push:
    branches: ['research/pol-xcorr-p0-actions-20261029']
    paths:
      - '.github/workflows/pol-xcorr-p0-preflight.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/scripts/p0_preflight.py'
      - 'research/POL_XCORR_UNRESOLVED_20261029/config/P0_REFERENCES_v0.2.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies (pinned, same as repo convention)
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Fetch R-13b reference artifact (supplementary; failure is recorded, not fatal)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/r13b
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation \
            --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/r13b
          f=$(find /tmp/r13b -name 'OBSERVATION_FEATURES_LABELS.csv.gz' | head -1)
          test -n "$f"
          echo "R13B_PATH=$f" >> "$GITHUB_ENV"
          sha256sum "$f"
      - name: Fixtures only (unit, never a P0 PASS)
        run: |
          set -euo pipefail
          python -u research/POL_XCORR_UNRESOLVED_20261029/scripts/p0_preflight.py \
            --repo-root . --out /tmp/p0_fixtures --fixtures-only || true
          cat /tmp/p0_fixtures/P0_CHECKS.json | head -40
      - name: P0_PREFLIGHT on locked inputs
        id: p0
        run: |
          set -uo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/results_p0/run_${GITHUB_RUN_ID}"
          export OUT; echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS=(--repo-root . --out "$OUT")
          if [ -n "${R13B_PATH:-}" ]; then ARGS+=(--g5-artifact "$R13B_PATH"); fi
          python -u research/POL_XCORR_UNRESOLVED_20261029/scripts/p0_preflight.py "${ARGS[@]}"
          rc=$?
          echo "P0 exit code: $rc (0 = TECHNICAL_QA_ONLY, 2 = BLOCKED/CORE_FAIL)"
          printf '{"github_run_id": "%s", "head_sha": "%s", "exit_code": %s, "r13b_path": "%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$rc" "${R13B_PATH:-}" > "$OUT/RUN_RECEIPT.json"
          python - <<'EOF'
          import json, os
          c = json.load(open(os.environ['OUT'] + '/P0_CHECKS.json'))
          print('RESULT', c['result_status'])
          for k, v in c['checks'].items():
              print(f"{k:45s} {v['class']:14s} {v['status']}")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pol-xcorr-p0-${{ github.run_id }}
          path: research/POL_XCORR_UNRESOLVED_20261029/results_p0/
          retention-days: 30
          if-no-files-found: error
      - name: Commit P0 outputs (append-only new run folder)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "POL-XCORR-001 P0_PREFLIGHT outputs from run $GITHUB_RUN_ID (label-free, DRAFT v0.2)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
