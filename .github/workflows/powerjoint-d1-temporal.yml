name: POWERJOINT D1 temporal residual analysis
on:
  push:
    branches: ['research/powerjoint-d1-temporal-20261021']
    paths: ['.github/workflows/powerjoint-d1-temporal.yml', 'research/PJ_D1_TEMPORAL_20261021/*.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/pj_d1
  PJ_ART: /tmp/pj_art
  PJ_BANK_DOWNLOAD: /tmp/pj_bankdownload
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        case: [R2_aA_m0, R2_aA_m45, R2_aB_m0, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
            /research/PJ_D1_TEMPORAL_20261021/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 tabulate==0.9.0
      - name: Stage original source, verified banks and immutable final traces
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_BANK_DOWNLOAD" "$PJ_ART"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py 2>&1 | tee "$PJ_OUT/${{ matrix.case }}_D1_STAGE_LOG.txt"
      - name: D1 decomposition and surrogates
        run: |
          set -o pipefail
          python -u research/PJ_D1_TEMPORAL_20261021/d1_temporal.py --case '${{ matrix.case }}' 2>&1 | tee "$PJ_OUT/${{ matrix.case }}_D1_LOG.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-${{ matrix.case }}-${{ github.run_id }}
          path: |
            /tmp/pj_d1/*_D1_*.csv
            /tmp/pj_d1/*_D1_QA.json
            /tmp/pj_d1/*_HEADING_COMPONENTS.npz
            /tmp/pj_d1/*_LOG.txt
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_D1_TEMPORAL_20261021/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Aggregate and judge
        env:
          PJ_IN: /tmp/pj_d1_in
          PJ_RESULTS: ${{ github.workspace }}/research/PJ_D1_TEMPORAL_20261021/results
        run: |
          set -euo pipefail
          mkdir -p "$PJ_IN"
          gh run download "${{ github.run_id }}" --repo myoungsunk/sionna-resimulation --pattern 'd1-*' --dir "$PJ_IN"
          mkdir -p "$PJ_RESULTS/logs" "$PJ_RESULTS/heading_components"
          for f in $(find "$PJ_IN" -name '*_LOG.txt'); do tail -c 20000 "$f" > "$PJ_RESULTS/logs/$(basename "$f")"; done
          python -u research/PJ_D1_TEMPORAL_20261021/d1_summary.py 2>&1 | tee "$PJ_RESULTS/logs/SUMMARY_LOG.txt" || echo SUMMARY_FAILED
          find "$PJ_IN" -name '*_HEADING_COMPONENTS.npz' -exec cp {} "$PJ_RESULTS/heading_components/" \;
          cat "$PJ_RESULTS/D1_RESULTS.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit results back to research branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_D1_TEMPORAL_20261021/results || true
          git commit -m "D1 results from run ${{ github.run_id }} (automated, no model change)" || echo 'nothing to commit'
          git push origin HEAD:${{ github.ref_name }}
