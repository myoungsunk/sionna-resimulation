name: G3 original 25 rays + H recomposition + hypothetical tau sensitivity
on:
  push:
    branches: ['audit/g3-original23-physical-h-revalidation-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_23_full_h_physical_audit.py'
      - '.github/workflows/g3-original23-h-physical-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/g3
  ORIGINAL: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  original-ray-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/g3
            src/qclean_uwb
            results/SIONNA_G2_FFD_NOFLIP_20260924_01a0d30b/bank/BANK_MANIFEST.json
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          ref: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
          path: original
          sparse-checkout: |
            results/DRIVE_SIM_20261007/S1/routes
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Retrieve hash-verified original FFD banks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/banks" "$RUNNER_TEMP/qa"
          SRC="https://media.githubusercontent.com/media/myoungsunk/sionna-resimulation/9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/banks/LP_plus45_bank.npz" "$SRC/LP_plus45_bank.npz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/banks/LP_minus45_bank.npz" "$SRC/LP_minus45_bank.npz"
          (cd "$RUNNER_TEMP/banks"; echo 'b29ae471a64617eacb0cf02ddbbcc3b2db190de171fba85f05dddb9cec0c453b  LP_plus45_bank.npz' | sha256sum -c -)
          (cd "$RUNNER_TEMP/banks"; echo '39729fe9f02cf80119a8492be8fcc43e08e2e9e00beebda2909e7c9819c76eb9  LP_minus45_bank.npz' | sha256sum -c -)
      - name: Verify 23 delivered traces, 25 original rays, and reconstruct original H
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          X="$EXP/original_source_delivery_20261029"
          B="original/results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF"
          P="original/results/DRIVE_SIM_20261007/S1/routes"
          python -u "$EXP/g3_23_full_h_physical_audit.py"             --zip "$X/G3_ORIGINAL_23_TRACE_PAIRS.zip"             --manifest "$X/G3_REQUESTED_SOURCE_MANIFEST.json"             --lock "$EXP/G3_23_ORIGINAL_SOURCE_LOCK.json"             --bank_dir "$RUNNER_TEMP/banks"             --h_dir "$B" --poses_dir "$P" --out "$RUNNER_TEMP/qa"             2>&1 | tee "$RUNNER_TEMP/qa/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-original25-h-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/qa/
          retention-days: 30
          if-no-files-found: warn
