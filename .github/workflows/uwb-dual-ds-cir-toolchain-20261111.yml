name: UWB ESP32 3.3.7 toolchain (bounded transfer)
on:
  push:
    branches: [build/uwb-dual-ds-cir-toolchain-20261111]
    paths: [.github/workflows/uwb-dual-ds-cir-toolchain-20261111.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repackage verified toolchain without reinstalling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh run download 42942741189 --repo myoungsunk/sionna-resimulation --name esp32-3.3.7-linux-toolchain --dir transfer
          cd transfer
          sha256sum -c evidence/SHA256SUMS
          split -b 240M -d -a 2 esp32-3.3.7-linux-toolchain.tar.xz toolchain.part.
          sha256sum toolchain.part.* > evidence/PART_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-00
          path: transfer/toolchain.part.00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-01
          path: transfer/toolchain.part.01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-02
          path: transfer/toolchain.part.02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-03
          path: transfer/toolchain.part.03
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-part-04
          path: transfer/toolchain.part.04
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-evidence
          path: transfer/evidence/
          retention-days: 3
