name: DLP-EKF P1 frozen C0 SourceFFD harmonization science
on:
  push:
    branches:
      - research/dual-lp-p1-frozen-execution-20261101
    paths:
      - '.github/workflows/dlp-p1-frozen-science.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/p1_runtime/p1_source_harmonization.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  DLP_BANK_DIR: /tmp/dlp_p1_banks
  DLP_TRACE_DIR: /tmp/dlp_p1_original_traces
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  frozen-p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Read-only sparse checkout; verify original proposer HEAD is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          ORIGINAL=$(git ls-remote origin refs/heads/research/dual-lp-p1-proposer-lock-20261101 | cut -f1)
          test "$ORIGINAL" = "340877f3537b4cc65cdaa9d687423cba92e0b28b" || { echo "BLOCKED: proposed original science HEAD moved"; exit 1; }
          export GIT_LFS_SKIP_SMUDGE=1
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat >.git/info/sparse-checkout <<'LIST'
          /research/DUAL_LP_PAPER_GAP_20261030/contracts/**
          /research/DUAL_LP_PAPER_GAP_20261030/p1_runtime/**
          /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          LIST
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json').read_text())
          paths=[
            '/research/DUAL_LP_PAPER_GAP_20261030/contracts/**',
            '/research/DUAL_LP_PAPER_GAP_20261030/p1_runtime/**',
            '/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json',
            '/research/FFD_P0P3_20261016/**',
            '/research/EKF4_RANGE_S_STAGED_20261014/p3_rf_adapter4.py',
            '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**',
            '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**']
          paths+=['/'+a['path'] for a in data['base_assets']]
          paths+=['/'+a['path'] for a in data['locked_source_code']]
          Path('/tmp/dlp_p1_sparse').write_text('\n'.join(sorted(set(paths)))+'\n')
          print('P1 required sparse paths',len(set(paths)))
          PY
          git sparse-checkout set --no-cone --stdin </tmp/dlp_p1_sparse
          test -s research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_FROZEN_RATIFICATION_20261101.json
          test -s results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m0.npy
          echo "P1 source and C0 physical input files checked out; no science before freeze verification."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin run dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Fetch immutable source banks and original archived RF traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DLP_BANK_DIR" "$DLP_TRACE_DIR"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation \
            --name ffd-verified-original-38875080492 --dir "$DLP_BANK_DIR"
          gh run download 38331588521 --repo myoungsunk/sionna-resimulation \
            --name ekf3-p2-frozen-rf-one-step --dir "$DLP_TRACE_DIR"
          find "$DLP_BANK_DIR" -maxdepth 2 -name '*bank.npz' -printf '%f %s bytes\n'
          find "$DLP_TRACE_DIR" -maxdepth 3 -name 'P2_ONE_STEP_SUMMARY.json' -printf '%p %s bytes\n'
      - name: Execute P1 strictly after SHA-frozen dual-role ratification
        shell: bash
        run: |
          set -uo pipefail
          export DLP_OUT="/tmp/dlp_p1_science/${GITHUB_RUN_ID}"
          mkdir -p "$DLP_OUT"
          python -u research/DUAL_LP_PAPER_GAP_20261030/p1_runtime/p1_source_harmonization.py \
             2>&1 | tee "$DLP_OUT/P1_LOG.txt"
          RC=${PIPESTATUS[0]}
          python - <<'PY'
          import hashlib,json,os,pathlib,platform,sys,datetime
          p=pathlib.Path(os.environ['DLP_OUT'])
          names=sorted(q for q in p.iterdir() if q.is_file() and q.name!='P1_MANIFEST.json')
          entries=[]
          for q in names:
            h=hashlib.sha256()
            with q.open('rb') as f:
              for block in iter(lambda:f.read(1048576),b''): h.update(block)
            entries.append({'name':q.name,'bytes':q.stat().st_size,'sha256':h.hexdigest()})
          qa=p/'P1_SCIENCE_QA.json'
          status=json.loads(qa.read_text())['status'] if qa.exists() else 'BLOCKED_NO_QA'
          manifest={'schema':'DLP_P1_APPEND_ONLY_RUN_MANIFEST_V1',
              'status':status,'run_id':os.environ.get('GITHUB_RUN_ID'),
              'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'phase':'P1_C0_SOURCE_OBSERVER_AND_DESCRIPTIVE_ONLY',
              'github_head':os.getenv('GITHUB_SHA'),
              'original_proposer_head':'340877f3537b4cc65cdaa9d687423cba92e0b28b',
              'contract_sha256':'373781e0a2395032faa49ff0228d84ebf8d93bb9c880e0504105bc5e12e82594',
              'source_bank_artifact_run':38875080492,
              'original_trace_artifact_run':38331588521,
              'command':'python -u research/DUAL_LP_PAPER_GAP_20261030/p1_runtime/p1_source_harmonization.py',
              'versions':{'python':sys.version,'platform':platform.platform()},
              'outputs':entries,
              'science_limit':'one historical C0 scene, no P2-P4, no new training or independent holdout',
              'all_original_files_immutable':True}
          (p/'P1_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('P1_FINAL_MANIFEST',status,'outputs',len(entries),flush=True)
          PY
          exit "$RC"
      - name: Preserve complete P1 successful and unsuccessful receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlp-p1-frozen-results-${{ github.run_id }}
          path: /tmp/dlp_p1_science/${{ github.run_id }}/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit append-only evidence to P1 branch (never merge or overwrite original)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/dlp_p1_science/${GITHUB_RUN_ID}"
          test -d "$SRC" || { echo "No run output directory"; exit 0; }
          D="research/DUAL_LP_PAPER_GAP_20261030/runs/P1_SOURCE_HARMONIZATION_${GITHUB_RUN_ID}"
          mkdir -p "$D"
          cp -a "$SRC/." "$D/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$D"
          git commit -m "science(p1): preserve frozen SourceFFD C0 run ${GITHUB_RUN_ID} unconditionally" || { echo "No file changed"; exit 0; }
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
