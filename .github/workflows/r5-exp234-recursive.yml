name: R5 Exp2 Factor Exp3 Range Oracle Exp4 Native LoS
on:
  push:
    branches: ['research/r5-exp1234-20261016']
    paths:
      - '.github/workflows/r5-exp234-recursive.yml'
      - 'research/EXP234_CAUSAL_20261016/exp234_recursive.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_and_validate_all:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout immutable N4C R2 observer and actual LoS FFD library
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EXP234_CAUSAL_20261016/exp234_recursive.py\n/research/R5_N4C_20261015/n4c_joint_sr4.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-exp234-recursive.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory audit source code, FFD lookup table and workflow before results
        shell: bash
        run: |
          set -euo pipefail
          python research/EXP234_CAUSAL_20261016/exp234_recursive.py --phase audit --out "$RUNNER_TEMP/exp_pre" | tee "$RUNNER_TEMP/exp_pre.log"
      - name: Download verified source RF and frozen N4B N4C archives
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/rf.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/rf.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/r2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/r2.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/n4b.zip"
          echo '170a646f8167f1e440316abf42b614afa4efc3d77037c0e19bf470a817fc334b  '"$RUNNER_TEMP/n4b.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11962810669/zip > "$RUNNER_TEMP/n4c.zip"
          echo 'f807346e806adcc88ce5772d901cb82f83e423d56c1b5f7b846b6871fcaefad9  '"$RUNNER_TEMP/n4c.zip" | sha256sum -c
      - name: Install pinned frozen numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3
      - name: Frozen N4C correlated SR4 and mean covariance factorial unit tests
        shell: bash
        run: |
          set -euo pipefail
          python research/EXP234_CAUSAL_20261016/exp234_recursive.py --phase test | tee "$RUNNER_TEMP/exp_unit.log"
      - name: EXP2 frozen original gate six-way mean vs covariance factorial
        shell: bash
        run: |
          set -euo pipefail
          python research/EXP234_CAUSAL_20261016/exp234_recursive.py --phase exp2 --out "$RUNNER_TEMP/exp2" --audit "$RUNNER_TEMP/exp_pre/PRE_AUDIT.json" --rf "$RUNNER_TEMP/rf.zip" --r2 "$RUNNER_TEMP/r2.zip" --n4b "$RUNNER_TEMP/n4b.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/exp2.log"
      - name: EXP3 retrospective GT-range causal LPF and shifted-placebo recursions
        shell: bash
        run: |
          set -euo pipefail
          python research/EXP234_CAUSAL_20261016/exp234_recursive.py --phase exp3 --out "$RUNNER_TEMP/exp3" --audit "$RUNNER_TEMP/exp_pre/PRE_AUDIT.json" --rf "$RUNNER_TEMP/rf.zip" --r2 "$RUNNER_TEMP/r2.zip" --n4b "$RUNNER_TEMP/n4b.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/exp3.log"
      - name: EXP4 original Native LoS q-based POWER and R0 recursive safety
        shell: bash
        run: |
          set -euo pipefail
          python research/EXP234_CAUSAL_20261016/exp234_recursive.py --phase exp4 --out "$RUNNER_TEMP/exp4" --audit "$RUNNER_TEMP/exp_pre/PRE_AUDIT.json" --rf "$RUNNER_TEMP/rf.zip" --r2 "$RUNNER_TEMP/r2.zip" --n4b "$RUNNER_TEMP/n4b.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/exp4.log"
      - name: Preserve every success failure code audit and source-complete model trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-exp234-causal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exp_pre/**
            ${{ runner.temp }}/exp2/**
            ${{ runner.temp }}/exp3/**
            ${{ runner.temp }}/exp4/**
            ${{ runner.temp }}/exp_pre.log
            ${{ runner.temp }}/exp_unit.log
            ${{ runner.temp }}/exp2.log
            ${{ runner.temp }}/exp3.log
            ${{ runner.temp }}/exp4.log
          if-no-files-found: warn
          retention-days: 30
