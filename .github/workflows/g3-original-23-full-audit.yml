name: G3 recovered original 23 ray and H source forensic
on:
  push:
    branches: ['audit/g3-23-original-h-forensics-20261029']
    paths:
      - '.github/workflows/g3-original-23-full-audit.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_original_23_full_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXP: research/RA0_RA1_RA2_AUDIT_20261029/g3
      BLOCK: results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/qclean_uwb/**
            /research/RA0_RA1_RA2_AUDIT_20261029/g3/**
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R2.json
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R4.json
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R5.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aB_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R4_aA_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R4_aB_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R5_aA_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R5_aB_m0.npy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Fetch SHA-locked original LP banks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g3banks"
          for file in LP_plus45_bank.npz LP_minus45_bank.npz; do
            curl -fLsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/g3banks/$file" "https://media.githubusercontent.com/media/myoungsunk/sionna-resimulation/9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13/$file"
          done
      - name: Verify raw source and reconstruct H and G3 per-ray residuals
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g3audit"
          python -u "$EXP/g3_original_23_full_audit.py" --out "$RUNNER_TEMP/g3audit" --bank-dir "$RUNNER_TEMP/g3banks" 2>&1 | tee "$RUNNER_TEMP/g3audit/G3_RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-original-23-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/g3audit/
          retention-days: 30
          if-no-files-found: warn
