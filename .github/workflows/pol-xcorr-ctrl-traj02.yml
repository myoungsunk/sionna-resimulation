name: CTRL-TRAJ-02 real-SourceFFD controlled trajectory experiment (exploratory, label-free)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-ctrl-traj02.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_02/ctrl_traj_02.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '2'
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Download sha-verified FFD banks (run 38875080492)
        run: |
          set -euo pipefail
          mkdir -p /tmp/banks
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/banks
          find /tmp/banks -name '*.npz' -exec sha256sum {} \;
      - name: Run
        run: |
          set -euo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_02/results_run_${GITHUB_RUN_ID}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -I -u research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_02/ctrl_traj_02.py \
            --repo-root . --bank-dir /tmp/banks --out "$OUT" | tee /tmp/ctrl02_log.txt
          cp /tmp/ctrl02_log.txt "$OUT/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ctrl-traj02-${{ github.run_id }}
          path: research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_02/
          retention-days: 30
      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${OUT:-}" && test -d "$OUT" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "CTRL-TRAJ-02 outputs from run $GITHUB_RUN_ID (exploratory, label-free)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
