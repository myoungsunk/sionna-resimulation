name: R5 Full RF heading staged immutable R5-0 and R5-1 diagnostics
on:
  push:
    branches: ['research/r5-fullrf-heading-staged-20261015']
    paths:
      - '.github/workflows/r5-fullrf-heading-staged.yml'
      - 'research/R5_FULLRF_HEADING_20261015/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-fullrf-heading-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r5_0_audit_r5_1_diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact sparse source checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_FULLRF_HEADING_20261015/**\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-fullrf-heading-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Immutable pre-execution code and original input source audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_HEADING_20261015/r5_staged.py --phase pre --out "$RUNNER_TEMP/r5_pre" | tee "$RUNNER_TEMP/r5_pre.log"
      - name: Retrieve archived frozen RF and valid audited R2 replay
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/original_R2_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/original_R2_RF.zip" | sha256sum -c
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/audited_R2_replay.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/audited_R2_replay.zip" | sha256sum -c
      - name: Install exact numeric dependencies after audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - name: Numeric self-tests, differential observation covariance
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_HEADING_20261015/r5_staged.py --phase test | tee "$RUNNER_TEMP/r5_tests.log"
      - name: R5-0 original R2 parity and R5-1 independent RF decomposition
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_HEADING_20261015/r5_staged.py --phase run --raw "$RUNNER_TEMP/original_R2_RF.zip" --r2 "$RUNNER_TEMP/audited_R2_replay.zip" --pre "$RUNNER_TEMP/r5_pre/PRE_AUDIT.json" --out "$RUNNER_TEMP/r5_r1" | tee "$RUNNER_TEMP/r5_run.log"
      - name: Preserve audit/tests/numerics even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-fullrf-heading-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r5_pre/**
            ${{ runner.temp }}/r5_r1/**
            ${{ runner.temp }}/r5_pre.log
            ${{ runner.temp }}/r5_tests.log
            ${{ runner.temp }}/r5_run.log
            research/R5_FULLRF_HEADING_20261015/**
            .github/workflows/r5-fullrf-heading-staged.yml
          if-no-files-found: warn
          retention-days: 30
