name: POWERJOINT followup S0 offline statistics only
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s0-statistics.yml]
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S0_CORRECTIONS/**
            /research/POWERJOINT_AUDIT_RERUN_20261020/T6_RANGE/native_execution_r01/NATIVE_RESIDUALS.csv
            /research/POWERJOINT_AUDIT_RERUN_20261020/T3_SOURCEFFD_TABLES/SLIDE2_RANGE_STATS.csv
            /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.5
      - name: Recompute B_OLD residual and certified populations without filter replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S0_CORRECTIONS/residual_statistics.py --cache '${{ runner.temp }}/s0-inputs' --out s0-statistics-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s0-statistics-${{ github.run_id }}
          path: s0-statistics-results/
          retention-days: 30
