name: POWERJOINT event-level physical predictor falsification
on:
  push:
    branches: ['research/powerjoint-crosscase-mechanism-20261020']
    paths: ['.github/workflows/powerjoint-aggregate-physical-events.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_CROSSCASE_20261020/**
      - name: Join physical event metrics from all six independently uploaded cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input"
          for r in C01 C02 C03 O01 O02 O03; do
            gh run download 39349484700 --repo myoungsunk/sionna-resimulation --name "pj-extreme-physics-${r}-39349484700" --dir "$RUNNER_TEMP/input/$r"
          done
          python research/POWERJOINT_CROSSCASE_20261020/aggregate_best_worst.py "$RUNNER_TEMP/input" "$RUNNER_TEMP/output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pj-physical-event-discrimination-${{ github.run_id }}
          path: ${{ runner.temp }}/output/**
          retention-days: 30
          if-no-files-found: warn
