name: POWERJOINT S2 preserve training and all evaluation attempts only
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s2-preserve.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S0_CORRECTIONS/github_io.py
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/preserve_outputs.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install requests==2.32.5
      - name: Preserve original archives and failures; full release readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/preserve_outputs.py --cache '${{ runner.temp }}/s2-output-preservation' --runs 39374401047 39374960558 39375140765 39375368147 39375649673 39375791934
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s2-preservation-${{ github.run_id }}
          path: research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/
          retention-days: 30
