name: P2 ladder 2 - per-packet R_s rule (kappa x V_s)
on:
  push:
    branches: ['research/d0-cir-p2-recursive-20261022']
    paths: ['.github/workflows/p2-ladder2.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/p2_ladder2
  PJ_ART: /tmp/pj_art
  PJ_BANK_DOWNLOAD: /tmp/pj_bank
jobs:
  kappa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        held: [R2, R4, R5]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact P2 smoke dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Stage and SHA-verify immutable RF traces and banks
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_ART" "$PJ_BANK_DOWNLOAD" /tmp/p2_models
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: Download P1R heading grids (run 39752301964)
        run: |
          set -euo pipefail
          gh run download 39752301964 --repo myoungsunk/sionna-resimulation --pattern 'p1r-grid-*' --dir /tmp/p1r_grid
      - name: Train-only kappa per arm (reproduces P1R calib_R rows)
        run: |
          set -euo pipefail
          python -u research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_rkappa.py --held '${{ matrix.held }}' --grid /tmp/p1r_grid --out /tmp/p2_kappa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2kappa-${{ matrix.held }}-${{ github.run_id }}
          path: /tmp/p2_kappa/
          retention-days: 30
          if-no-files-found: error

  replay:
    needs: kappa
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {case: R2_aA_m0, held: R2}
          - {case: R2_aA_m45, held: R2}
          - {case: R2_aB_m0, held: R2}
          - {case: R4_aA_m0, held: R4}
          - {case: R4_aB_m0, held: R4}
          - {case: R5_aA_m0, held: R5}
          - {case: R5_aB_m0, held: R5}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact P2 smoke dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Stage and SHA-verify immutable RF traces and banks
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_ART" "$PJ_BANK_DOWNLOAD" /tmp/p2_models
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: Reuse models trained on external routes only (P2 smoke run 39773370468)
        run: |
          set -euo pipefail
          gh run download 39773370468 --repo myoungsunk/sionna-resimulation \
            --name 'p2train-${{ matrix.held }}-39773370468' --dir /tmp/p2_models
          MODEL=$(find /tmp/p2_models -name '${{ matrix.held }}_TRAIN.joblib' -print -quit)
          QA=$(find /tmp/p2_models -name '${{ matrix.held }}_TRAIN_QA.json' -print -quit)
          test -s "$MODEL" && test -s "$QA"
          python - "$QA" '${{ matrix.held }}' <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]));h=sys.argv[2]
          assert q['held']==h and h not in q['train_routes'] and len(q['train_routes'])==2, q
          print('TRAIN_HELDOUT_PASS',h,q['train_routes'],q['R_cal'])
          PY
      - name: Download train-only kappa for this held route
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --name 'p2kappa-${{ matrix.held }}-${{ github.run_id }}' --dir /tmp/p2_kappa
      - name: Ladder 2 replay (NOM, Full B0/L2)
        run: |
          set -euo pipefail
          MODEL=$(find /tmp/p2_models -name '${{ matrix.held }}_TRAIN.joblib' -print -quit)
          KAP=$(find /tmp/p2_kappa -name '${{ matrix.held }}_RKAPPA.json' -print -quit)
          python -u research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_ladder2.py \
            --case '${{ matrix.case }}' --models "$MODEL" --kappa "$KAP" --out "$PJ_OUT" \
              2>&1 | tee "$PJ_OUT/${{ matrix.case }}_LADDER2_LOG.txt"
          test -s "$PJ_OUT/${{ matrix.case }}_LADDER2_SCORES.csv"
      - name: Preserve logs, traces and QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2lad2-${{ matrix.case }}-${{ github.run_id }}
          path: /tmp/p2_ladder2/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Aggregate ladder 2
        run: |
          set -euo pipefail
          D=research/PJ_D0_CIR_P2_RECURSIVE_20261022/results_ladder2
          mkdir -p /tmp/p2_l2_in "$D"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'p2lad2-*' --dir /tmp/p2_l2_in
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'p2kappa-*' --dir /tmp/p2_l2_in
          cp /tmp/p2_l2_in/p2kappa-*/*_RKAPPA.json "$D"/
          python research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_ladder2_aggregate.py --input /tmp/p2_l2_in --out "$D" | tee "$D/LADDER2_LOG.txt"
      - name: Commit ladder 2 summaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_D0_CIR_P2_RECURSIVE_20261022/results_ladder2
          git commit -m "P2 ladder 2 (per-packet R_s rule) results from run $GITHUB_RUN_ID" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
