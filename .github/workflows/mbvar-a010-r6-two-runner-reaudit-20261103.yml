name: MBVAR A010 R6 updated-source DEV2 K1 K2 two-runner reaudit proof (NOT SCIENCE)
# IMPLEMENTER TECHNICAL TEST ONLY. Never DEV3, HOLDOUT2, reserve or RT.
on:
  push:
    branches: [implement/mbvar-a010-audit-r1-r6-fix-20261103]
    paths:
      - '.github/workflows/mbvar-a010-r6-two-runner-reaudit-20261103.yml'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/a10_cross_runner_replay.py'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests/test_a10_two_runner_protocol.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MBVAR_A010_DEV2_PREFLIGHT: '1'
  PIP_PKGS: numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 pytest==8.3.3
jobs:
  prefreeze-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/contracts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/RUN_REQUEST.json
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/results/P2_A010P0_GEN_run_41269011836
      - name: Verify historical contract and source receipt immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          root=Path("research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029")
          original={
            "RUN_REQUEST.json":"2e8c23e8212ab8717c7b513045c02247e2a77146",
            "code/contract_lock.py":"a62d43dfce65d7a9ec9cc061916ecc836960d4e9",
            "contracts/EXPERIMENT_CONTRACT_MBVAR-INFO-001.md":"6de541be7665411224895840dd5ed2b9cea7a65c",
            "contracts/AMENDMENT-008.md":"5d4a004c1128bd48012d2ed22b9fc38ec0e418d2",
            "contracts/AMENDMENT-009.md":"b4f2581a3b1b879e6383b6596687bb3ca7437d9c",
            "contracts/AMENDMENT-010-P0.md":"12e0ececfa7491a594b8e29a3bf127794b4d8b65",
            "contracts/AMENDMENT-010.md":"3ee2e9995f46bfbe8e6e563fb18605feb47ba56f",
          }
          for name,want in original.items():
              have=subprocess.check_output(["git","hash-object",str(root/name)],text=True).strip()
              if have!=want:raise SystemExit("ERR_A010_FROZEN_BLOB_CHANGED "+name)
          if '"status": "FROZEN"' in (root/"contracts/AMENDMENT-010.md").read_text():
              raise SystemExit("ERR_A010_UNAUTHORIZED_FREEZE")
          zip_path=root/"results/P2_A010P0_GEN_run_41269011836/A010_CANONICAL_INPUTS.zip"
          if hashlib.sha256(zip_path.read_bytes()).hexdigest()!="316efcc04946197cbb5c10417e3b6bfca3e4e8f5e4d3433535dfbba09b7bb9f3":
              raise SystemExit("ERR_A010_GEN_ZIP_HASH")
          print("A010_PREFREEZE_GUARD_PASS",len(original))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Compile and execute no-input negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.3 pytest==8.3.3
          python -c 'import ast; ast.parse(open("research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code/a10_cross_runner_replay.py").read())'
          python -m pytest -q -p no:cacheprovider "$EXP/tests/test_a10_two_runner_protocol.py"
          test -z "$(git status --porcelain)"
  dev2-replay:
    needs: prefreeze-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/scripts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/contracts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/RUN_REQUEST.json
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/results/P2_A010P0_GEN_run_41269011836
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check $PIP_PKGS
      - name: Fetch old FFD input code only, no RF simulation
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Replay K1 and K2 canonical input and write runner evidence
        shell: bash
        env:
          A010_REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          mkdir -p "$RUNNER_TEMP/a010-$A010_REPLICA"
          python "$EXP/code/a10_cross_runner_replay.py" replay --replica "$A010_REPLICA" --out "$RUNNER_TEMP/a010-$A010_REPLICA" 2>&1 | tee "$RUNNER_TEMP/a010-$A010_REPLICA/REPLAY_LOG.txt"
          test -s "$RUNNER_TEMP/a010-$A010_REPLICA/REPLAY_RECEIPT.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-dev2-${{ matrix.replica }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a010-${{ matrix.replica }}/
          if-no-files-found: warn
          retention-days: 90
  paired-check:
    needs: dev2-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned comparator
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - uses: actions/download-artifact@v4
        with:
          name: a010-dev2-a-${{ github.run_id }}
          path: ${{ runner.temp }}/pair/a
      - uses: actions/download-artifact@v4
        with:
          name: a010-dev2-b-${{ github.run_id }}
          path: ${{ runner.temp }}/pair/b
      - name: Compare VM boot IDs and state, objective, full C10, NEES, modes
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/code/a10_cross_runner_replay.py" compare --a "$RUNNER_TEMP/pair/a/REPLAY_RECEIPT.json" --b "$RUNNER_TEMP/pair/b/REPLAY_RECEIPT.json" --out "$RUNNER_TEMP/comparison"
          cat "$RUNNER_TEMP/comparison/TWO_RUNNER_COMPARISON.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-dev2-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: warn
          retention-days: 90
