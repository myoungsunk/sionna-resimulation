name: CTRL-TRAJ-04 d0 (power-only) vs Stokes correlation head-to-head (exploratory)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-ctrl-traj04.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_04/ctrl_traj_04.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Download FFD banks and EKF traces
        run: |
          set -euo pipefail
          mkdir -p /tmp/banks /tmp/art
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/banks
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/art
          find /tmp/art -name '*_full_*_TRACE.npz' | wc -l
      - name: Run
        run: |
          set -euo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_04/results_run_${GITHUB_RUN_ID}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -I -u research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_04/ctrl_traj_04.py \
            --repo-root . --bank-dir /tmp/banks --trace-dir /tmp/art --out "$OUT" | tee /tmp/log.txt
          cp /tmp/log.txt "$OUT/LOG.txt"
      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${OUT:-}" && test -d "$OUT" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "CTRL-TRAJ-04 outputs from run $GITHUB_RUN_ID (exploratory)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"
