name: PALO exact nonlinear C-D mechanism execution
on:
  push:
    branches: [analysis/palo-mechanism-cd-20261108]
    paths:
      - research/PALO_MECHANISM_CD_20261108/execution_v2/run_cd_exact.py
      - .github/workflows/palo-mechanism-cd-execute-20261108.yml
permissions:
  contents: write
concurrency:
  group: palo-cd-exact-mechanism
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.sha }}
      BRANCH: analysis/palo-mechanism-cd-20261108
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.2.4 pandas==2.2.3 scipy==1.15.2
      - name: Fetch frozen base and repaired driver, compile
        run: |
          python - <<'PY'
          import os,urllib.request,hashlib,py_compile
          from pathlib import Path
          base='https://raw.githubusercontent.com/myoungsunk/sionna-resimulation/'+os.environ['SOURCE_SHA']+'/research/PALO_MECHANISM_CD_20261108/'
          for remote,local in [('execution_v1/run_cd.py','run_cd_base.py'),('execution_v2/run_cd_exact.py','run_cd_exact.py')]:
              with urllib.request.urlopen(base+remote,timeout=90) as r: b=r.read()
              if local=='run_cd_base.py': assert hashlib.sha256(b).hexdigest()=='c1eb36f4bf761141875464989193096c3c92f53681d924f24567365635428755'
              Path(local).write_bytes(b)
              print(local,'SHA256',hashlib.sha256(b).hexdigest())
              py_compile.compile(local,doraise=True)
          PY
      - name: Exact C0-C4 and D interventions, strict parity, publish
        run: |
          set -o pipefail
          python -u run_cd_exact.py --source source --output output --publish 2>&1 | tee run.log
      - name: Retain code, raw results, checks, and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palo-exact-cd-${{ github.run_id }}
          path: |
            output/
            run_cd_base.py
            run_cd_exact.py
            run.log
            PUBLICATION.json
            source/INPUT_MANIFEST.json
          retention-days: 30
          compression-level: 0
