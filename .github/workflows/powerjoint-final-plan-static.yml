name: POWER_JOINT Final Plan Static Preflight Only
on:
  push:
    branches: ['research/powerjoint-final-preexecution-20261016']
    paths:
      - '.github/workflows/powerjoint-final-plan-static.yml'
      - 'research/POWERJOINT_FINAL_20261016/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preexecution_contract_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Sparse checkout EXACT planning docs and published original source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/POWERJOINT_FINAL_20261016/**\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/R5_N4C_20261015/n4c_joint_sr4.py\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/drivesim/hs_lut.py\n/.github/workflows/powerjoint-final-plan-static.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Validate documentation, manifest DAG, local frozen git blobs and missing scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static_audit"
          python3 research/POWERJOINT_FINAL_20261016/08_VALIDATE_PLAN.py --json-report "$RUNNER_TEMP/static_audit/PREFLIGHT_RESULT.json" | tee "$RUNNER_TEMP/static_audit/PREFLIGHT.log"
      - name: Archive complete final scientific plan, code contracts and static preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerjoint-final-plan-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/POWERJOINT_FINAL_20261016/**
            ${{ runner.temp }}/static_audit/**
          retention-days: 30
          if-no-files-found: warn
