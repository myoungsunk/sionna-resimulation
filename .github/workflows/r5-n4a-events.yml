name: N4-A stored extreme-event RF Gate and innovation forensic
on:
  push:
    branches: ['research/r5-n4a-nees-rootcause-20261015']
    paths:
      - '.github/workflows/r5-n4a-events.yml'
      - 'research/R5_N4A_NEES_20261015/n4a_events.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_n4a_events:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pinned sources
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N4A_NEES_20261015/n4a_nees_rootcause.py\n/research/R5_N4A_NEES_20261015/n4a_events.py\n/.github/workflows/r5-n4a-events.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source audit before artifacts
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4A_NEES_20261015/n4a_events.py --phase pre --out "$RUNNER_TEMP/event_pre" | tee "$RUNNER_TEMP/event_pre.log"
      - name: Retrieve validated N4-A posterior/innovation traces
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11956721584/zip > "$RUNNER_TEMP/N4A.zip"
          echo '83735d5551b6a70aec05874c73ac873cc9f4e09b3e45a6900f9af39098ff3ce3  '"$RUNNER_TEMP/N4A.zip" | sha256sum -c
      - name: Event-window comparisons on original N4-A results
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4A_NEES_20261015/n4a_events.py --phase run --out "$RUNNER_TEMP/event_results" --input "$RUNNER_TEMP/N4A.zip" --audit "$RUNNER_TEMP/event_pre/PRE_AUDIT.json" | tee "$RUNNER_TEMP/event_run.log"
      - name: Always upload auditable positive and failed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4a-extreme-events-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/event_pre/**
            ${{ runner.temp }}/event_results/**
            ${{ runner.temp }}/event_pre.log
            ${{ runner.temp }}/event_run.log
          if-no-files-found: warn
          retention-days: 30
