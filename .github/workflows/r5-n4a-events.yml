name: R5 N4-A2 extreme event Range-s Gate eigen forensic
on:
  push:
    branches: ['research/r5-n4a-event-mechanism-20261015']
    paths:
      - '.github/workflows/r5-n4a-events.yml'
      - 'research/R5_N4A_EVENT_20261015/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-n4a-event-${{ github.ref }}
  cancel-in-progress: false
jobs:
  n4a_extreme_event_alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Exact frozen research checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N4A_EVENT_20261015/**\n/research/R5_N4A_NEES_20261015/n4a_nees_rootcause.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/R5_N0_N3_20261015/n1_bias_policies.py\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-n4a-events.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory pre-execution source and workflow audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4A_EVENT_20261015/n4a_event_analysis.py --phase pre --out "$RUNNER_TEMP/n4ae_pre" | tee "$RUNNER_TEMP/n4ae_pre.log"
      - name: Fetch archived original sensor and N1 N4A B0 posterior and quality
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/raw_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/raw_RF.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11954136512/zip > "$RUNNER_TEMP/n1.zip"
          echo 'b633d0af900f26ab7d5a42c905adcb4abc01e5b262a154c774d10d5740fbaa40  '"$RUNNER_TEMP/n1.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11956721584/zip > "$RUNNER_TEMP/n4a.zip"
          echo '83735d5551b6a70aec05874c73ac873cc9f4e09b3e45a6900f9af39098ff3ce3  '"$RUNNER_TEMP/n4a.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11951360261/zip > "$RUNNER_TEMP/b0.zip"
          echo 'f31a04cf2ba39011a5d685b13985b947b1659e5b63c3a5910ec68175fa7e806a  '"$RUNNER_TEMP/b0.zip" | sha256sum -c
      - name: Pin minimal numerical dependencies after audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - name: Pre-execution Schur eigen and local gate numerical checks
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4A_EVENT_20261015/n4a_event_analysis.py --phase test | tee "$RUNNER_TEMP/n4ae_test.log"
      - name: Execute timestamp aligned short event and one-step policy tests
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4A_EVENT_20261015/n4a_event_analysis.py --phase run --out "$RUNNER_TEMP/n4ae_output" --audit "$RUNNER_TEMP/n4ae_pre/PRE_AUDIT.json" --raw "$RUNNER_TEMP/raw_RF.zip" --n1 "$RUNNER_TEMP/n1.zip" --n4a "$RUNNER_TEMP/n4a.zip" --b0 "$RUNNER_TEMP/b0.zip" | tee "$RUNNER_TEMP/n4ae_run.log"
      - name: Preserve all proof and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4a-event-forensic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n4ae_pre/**
            ${{ runner.temp }}/n4ae_output/**
            ${{ runner.temp }}/n4ae_pre.log
            ${{ runner.temp }}/n4ae_test.log
            ${{ runner.temp }}/n4ae_run.log
            research/R5_N4A_EVENT_20261015/**
          if-no-files-found: warn
          retention-days: 30
