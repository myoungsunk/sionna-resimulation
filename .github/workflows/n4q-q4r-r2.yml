name: N4 Q4-R2 Joint4 SR4 recursive prior PSD calibration pilot
on:
  push:
    branches: ['research/n4q-q4r-prior-calibration-20261015']
    paths:
      - '.github/workflows/n4q-q4r-r2.yml'
      - 'research/N4_Q4R_20261015/q4r_recursive.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  q4r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Exact original code LUT and all experiment sources checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/N4_Q4R_20261015/q4r_recursive.py\n/research/N4_Q4R_20261015/q4r_posthoc.py\n/research/R5_N4C_20261015/n4c_joint_sr4.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/n4q-q4r-r2.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory Q4-R1 and original source/Gate audit before numeric work
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q4R_20261015/q4r_recursive.py --phase pre --out "$RUNNER_TEMP/r2_pre" | tee "$RUNNER_TEMP/r2_pre.log"
      - name: Fetch and SHA256 verify original R2 RF N4-B N4-C and Q4-R1
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11976975584/zip > "$RUNNER_TEMP/r1.zip"
          echo '86dc05d64ddb2ddf5a688665f387b6d12346162491fa9435ecaecf6c8f1aefe9  '"$RUNNER_TEMP/r1.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/rf.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/rf.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/r2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/r2.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/n4b.zip"
          echo '170a646f8167f1e440316abf42b614afa4efc3d77037c0e19bf470a817fc334b  '"$RUNNER_TEMP/n4b.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11962810669/zip > "$RUNNER_TEMP/n4c.zip"
          echo 'f807346e806adcc88ce5772d901cb82f83e423d56c1b5f7b846b6871fcaefad9  '"$RUNNER_TEMP/n4c.zip" | sha256sum -c
      - name: Install original Sensor-v2 numeric dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3
      - name: Fixed PSD process addition mathematical tests before recursive execution
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q4R_20261015/q4r_recursive.py --phase test | tee "$RUNNER_TEMP/r2_test.log"
      - name: True recursive covariance update and R0 POWER_JOINT baseline parity
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q4R_20261015/q4r_recursive.py --phase run --out "$RUNNER_TEMP/r2_results" --audit "$RUNNER_TEMP/r2_pre/Q4R2_PRE_AUDIT.json" --r1 "$RUNNER_TEMP/r1.zip" --rf "$RUNNER_TEMP/rf.zip" --r2 "$RUNNER_TEMP/r2.zip" --n4b "$RUNNER_TEMP/n4b.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/r2_run.log"
      - name: Always upload failed run and entire prior/posterior x P
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4q-q4r-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2_pre/**
            ${{ runner.temp }}/r2_results/**
            ${{ runner.temp }}/r2_pre.log
            ${{ runner.temp }}/r2_test.log
            ${{ runner.temp }}/r2_run.log
          if-no-files-found: warn
          retention-days: 30
