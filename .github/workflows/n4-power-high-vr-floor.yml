name: N4 POWER High-Power Range-Vr Only Falsification
on:
  push:
    branches: ['research/power-high-range-vr-only-20261016']
    paths:
      - '.github/workflows/n4-power-high-vr-floor.yml'
      - 'research/HIGH_VR_RANGE_ONLY_20261016/high_vr_range_only.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: high-vr-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  range_variance_ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout original Q N4C FFD and standalone variance-falsification code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/HIGH_VR_RANGE_ONLY_20261016/high_vr_range_only.py\n/research/R5_N4C_20261015/n4c_joint_sr4.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/n4-power-high-vr-floor.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory SHA-pinned original physical observer and Q-source audit
        shell: bash
        run: |
          set -euo pipefail
          python research/HIGH_VR_RANGE_ONLY_20261016/high_vr_range_only.py --phase pre --out "$RUNNER_TEMP/highvr_pre" | tee "$RUNNER_TEMP/highvr_pre.log"
      - name: Fetch frozen raw RF R2 original N4-B and N4-C artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/rf.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/rf.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/r2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/r2.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/n4b.zip"
          echo '170a646f8167f1e440316abf42b614afa4efc3d77037c0e19bf470a817fc334b  '"$RUNNER_TEMP/n4b.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11962810669/zip > "$RUNNER_TEMP/n4c.zip"
          echo 'f807346e806adcc88ce5772d901cb82f83e423d56c1b5f7b846b6871fcaefad9  '"$RUNNER_TEMP/n4c.zip" | sha256sum -c
      - name: Install exact frozen NumPy SciPy and Pandas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3
      - name: Correlated covariance SPD fixed Vs Crs and SR4 whitening unit tests
        shell: bash
        run: |
          set -euo pipefail
          python research/HIGH_VR_RANGE_ONLY_20261016/high_vr_range_only.py --phase test | tee "$RUNNER_TEMP/highvr_test.log"
      - name: Real recursive Full RF R0 and POWER high-only Vr controls with natural and common-gate
        shell: bash
        run: |
          set -euo pipefail
          python research/HIGH_VR_RANGE_ONLY_20261016/high_vr_range_only.py --phase run --out "$RUNNER_TEMP/highvr_result" --audit "$RUNNER_TEMP/highvr_pre/SOURCE_AUDIT.json" --rf "$RUNNER_TEMP/rf.zip" --r2 "$RUNNER_TEMP/r2.zip" --n4b "$RUNNER_TEMP/n4b.zip" --n4c "$RUNNER_TEMP/n4c.zip" | tee "$RUNNER_TEMP/highvr_run.log"
      - name: Preserve original SHA audits all posterior and one-step counterfactuals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: high-power-range-vr-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/highvr_pre/**
            ${{ runner.temp }}/highvr_result/**
            ${{ runner.temp }}/highvr_pre.log
            ${{ runner.temp }}/highvr_test.log
            ${{ runner.temp }}/highvr_run.log
          if-no-files-found: warn
          retention-days: 30
