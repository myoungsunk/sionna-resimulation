name: EKF4 D3 pre-audited four failure numerical diagnosis
on:
  push:
    branches: ['research/ekf4-d3-four-failure-rootcause-20261014']
    paths:
      - '.github/workflows/ekf4-d3-four-failures.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/d3_pre_audit.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/d3_fixed_four.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ekf4-d3-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audited-fixed-four-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact D3 source and archived EKF4 math
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-d3-four-failures.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source/code/diagnostic audit BEFORE numerical execution
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3_pre_audit.py --phase source --out "$RUNNER_TEMP/d3_source_audit" | tee "$RUNNER_TEMP/d3_source_audit.log"
      - name: Read archived P2 evidence bytes; no model calculations
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" /repos/myoungsunk/sionna-resimulation/actions/artifacts/11875912063/zip > "$RUNNER_TEMP/d3_frozen_original.zip"
          test -s "$RUNNER_TEMP/d3_frozen_original.zip"
      - name: Mandatory archived-input audit BEFORE numerical execution
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3_pre_audit.py --phase input --source-audit "$RUNNER_TEMP/d3_source_audit/SOURCE_AUDIT.json" --archive "$RUNNER_TEMP/d3_frozen_original.zip" --out "$RUNNER_TEMP/d3_input_audit" | tee "$RUNNER_TEMP/d3_input_audit.log"
      - name: Install PINNED numerical tools AFTER both audits
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt mpmath==1.3.0
      - name: Analyze only four frozen numerical failures and DR-RF discrepancy
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3_fixed_four.py --source-audit "$RUNNER_TEMP/d3_source_audit/SOURCE_AUDIT.json" --input-audit "$RUNNER_TEMP/d3_input_audit/INPUT_AUDIT.json" --artifact "$RUNNER_TEMP/d3_frozen_original.zip" --out "$RUNNER_TEMP/d3_results" | tee "$RUNNER_TEMP/d3_numeric.log"
      - name: Preserve original immutable evidence and diagnostics on all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-d3-four-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d3_source_audit/**
            ${{ runner.temp }}/d3_input_audit/**
            ${{ runner.temp }}/d3_results/**
            ${{ runner.temp }}/d3_frozen_original.zip
            ${{ runner.temp }}/d3_source_audit.log
            ${{ runner.temp }}/d3_input_audit.log
            ${{ runner.temp }}/d3_numeric.log
            research/EKF4_RANGE_S_STAGED_20261014/d3_pre_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/d3_fixed_four.py
            research/EKF4_RANGE_S_STAGED_20261014/D3_FOUR_FAILURE_AUDITED_PLAN_KO.md
            research/EKF4_RANGE_S_STAGED_20261014/D3_SCOPE_CLARIFICATION_KO.md
            .github/workflows/ekf4-d3-four-failures.yml
          if-no-files-found: warn
          retention-days: 30
