name: Real RF E5 identical-prior packet heading benefit validation
on:
  push:
    branches: ['research/real-rf-packet-selector-20261023']
    paths: ['.github/workflows/real-rf-selector-e5.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/real_rf_e5
  PJ_ART: /tmp/pj_art
  PJ_BANK_DOWNLOAD: /tmp/pj_bank
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {case: R2_aA_m0, held: R2}
          - {case: R2_aA_m45, held: R2}
          - {case: R2_aB_m0, held: R2}
          - {case: R4_aA_m0, held: R4}
          - {case: R4_aB_m0, held: R4}
          - {case: R5_aA_m0, held: R5}
          - {case: R5_aB_m0, held: R5}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Libraries
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Frozen SourceFFD + original RF + trained corrector
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_ART" "$PJ_BANK_DOWNLOAD" /tmp/real_rf_models
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
          gh run download 39885708483 --repo myoungsunk/sionna-resimulation \
            --name 'p2ptrain-${{ matrix.held }}-39885708483' --dir /tmp/real_rf_models
          test -s /tmp/real_rf_models/${{ matrix.held }}_PTRAIN.joblib
      - name: Identical BASE-prior/R/gate paired heading-update benefit
        run: |
          set -euo pipefail
          python -u research/REAL_RF_SELECTOR_20261023/e5_fixed_prior.py \
            --case '${{ matrix.case }}' --models '/tmp/real_rf_models/${{ matrix.held }}_PTRAIN.joblib' \
            --out "$PJ_OUT" 2>&1 | tee "$PJ_OUT/${{ matrix.case }}_E5_LOG.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-rf-e5-${{ matrix.case }}-${{ github.run_id }}
          path: /tmp/real_rf_e5/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: paired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Count all cases, pair and aggregate
        run: |
          set -euo pipefail
          D=research/REAL_RF_SELECTOR_20261023/results_e5
          mkdir -p /tmp/e5_all "$D"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation \
            --pattern 'real-rf-e5-*' --dir /tmp/e5_all
          python research/REAL_RF_SELECTOR_20261023/e5_aggregate.py \
            --input /tmp/e5_all --out "$D" | tee "$D/E5_LOG.txt"
      - name: Commit validated results
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/REAL_RF_SELECTOR_20261023/results_e5/
          git commit -m "Real RF E5 fixed-prior independent correction effect ($GITHUB_RUN_ID)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Preserve QA and aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-rf-e5-aggregate-${{ github.run_id }}
          path: research/REAL_RF_SELECTOR_20261023/results_e5/
          if-no-files-found: warn
