name: POWERJOINT separate model failure diagnosis
on:
  push:
    branches: ['research/powerjoint-separate-marginals-correlation-20261020']
    paths: ['.github/workflows/powerjoint-separate-rs-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PJ_OUT: /tmp/pj_diagnostics
  OPENBLAS_NUM_THREADS: '1'
jobs:
  explain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Diagnose immutable final traces; do not change coefficients or gate settings
        run: |
          set -euo pipefail
          mkdir -p "$PJ_OUT"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_OUT"
          python research/PJ_SEPARATE_RS_20261020/explain_completed_results.py
          cat "$PJ_OUT/DIAGNOSTICS/DIAGNOSTIC_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          cp research/PJ_SEPARATE_RS_20261020/explain_completed_results.py "$PJ_OUT/DIAGNOSTICS/"
      - name: Save small reviewer-facing evidence supplement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWERJOINT_SEPARATE_RS_FAILURE_DIAGNOSIS_${{ github.run_id }}
          path: /tmp/pj_diagnostics/DIAGNOSTICS/**
          retention-days: 30
          if-no-files-found: error
