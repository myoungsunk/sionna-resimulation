name: P4 FULL frozen-source AB/ABC R inflation sensitivity and fixed gate mask
on:
  push:
    branches: ['research/p4full-covariance-mechanism-diagnostics-20261102']
    paths:
      - '.github/workflows/dlp-p4full-r-sensitivity.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/audits/P4_FULL_COV_FORENSICS_20261102/p4_R_scale_sensitivity.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  P4_R_SENS_OUT: /tmp/p4_r_scale_sensitivity
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_LFS_SKIP_PUSH: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  original-source-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read original P4 FULL 12 traces and upstream unchanged exact EKF4 code
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --no-tags --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat >.git/info/sparse-checkout <<'LIST'
          /research/DUAL_LP_PAPER_GAP_20261030/audits/P4_FULL_COV_FORENSICS_20261102/**
          /research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json
          /research/EKF4_RANGE_S_STAGED_20261014/core.py
          /research/DUAL_LP_PAPER_GAP_20261030/runs/P4_FULL_C0PLUS_NATIVE_41435839892/P4_FULL_12_COMPLETE_4STATE_EKF_TRACES.zip
          /research/DUAL_LP_PAPER_GAP_20261030/runs/P4_FULL_C0PLUS_NATIVE_41435839892/P4_FULL_28_POOLED_METRICS.csv
          LIST
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json')
          lock=json.loads(p.read_text())
          rows=pathlib.Path('.git/info/sparse-checkout').read_text().splitlines()
          rows.extend('/'+a['path'] for a in lock['base_assets'] if a['kind']=='TIMELINE_TNONE')
          pathlib.Path('/tmp/p4r_sparse').write_text('\n'.join(sorted(set(rows)))+'\n')
          PY
          git sparse-checkout set --no-cone --stdin </tmp/p4r_sparse
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fixed numpy, syntax test, pinned raw bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.3
          python -m py_compile research/DUAL_LP_PAPER_GAP_20261030/audits/P4_FULL_COV_FORENSICS_20261102/p4_R_scale_sensitivity.py
          printf '%s  %s\n' '5ecf2a326ec17c8ce4ccc7a42fe76227ecf6ad7ec027df9cdfcd2304dcb0acfe' research/DUAL_LP_PAPER_GAP_20261030/runs/P4_FULL_C0PLUS_NATIVE_41435839892/P4_FULL_12_COMPLETE_4STATE_EKF_TRACES.zip | sha256sum --check
          test "$(git hash-object research/EKF4_RANGE_S_STAGED_20261014/core.py)" = "0a0851e6867c14fec5eefe02df471100cb9e9e1d"
      - name: Replay source gamma1 exact then gamma4,16,64 + fixed gamma16 original gate mask
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$P4_R_SENS_OUT"
          python -u research/DUAL_LP_PAPER_GAP_20261030/audits/P4_FULL_COV_FORENSICS_20261102/p4_R_scale_sensitivity.py \
            2>&1 | tee "$P4_R_SENS_OUT/R_SCALE_SENSITIVITY_LOG.txt"
          exit "${PIPESTATUS[0]}"
      - name: Preserve all failed/pass numerical sensitivity artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4full-r-scale-sensitivity-${{ github.run_id }}
          path: /tmp/p4_r_scale_sensitivity/
          retention-days: 30
          if-no-files-found: warn
      - name: Record all successful/failed retrospective sensitivity outputs append-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$P4_R_SENS_OUT/R_SCALE_SENSITIVITY_LOG.txt" || exit 0
          DEST="research/DUAL_LP_PAPER_GAP_20261030/audits/P4_FULL_COV_FORENSICS_20261102/R_SENSITIVITY_RUN_${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a "$P4_R_SENS_OUT/." "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$DEST"
          git commit -m "analysis(p4full): preserve fixed gamma source-replay and 120 retrospective sensitivity records ${GITHUB_RUN_ID}" || exit 0
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
