name: POWERJOINT audit T0 immutable input preservation
on:
  push:
    branches: ['research/powerjoint-audit-rerun-20261020']
    paths: ['.github/workflows/powerjoint-audit-rerun-t0.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_RERUN_20261020/T0_INPUTS/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install requests==2.32.5
      - name: Preserve original five archives and verify release readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/POWERJOINT_AUDIT_RERUN_20261020/T0_INPUTS/preserve.py --cache "${{ runner.temp }}/inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-audit-t0-${{ github.run_id }}
          path: research/POWERJOINT_AUDIT_RERUN_20261020/T0_INPUTS/
          retention-days: 30
