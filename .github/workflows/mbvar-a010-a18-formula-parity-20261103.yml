name: MBVAR A010 A18 independent original-62-formula parity (NO science run)
on:
  push:
    branches: [implement/mbvar-a010-a18-failclosed-20261103]
    paths:
      - '.github/workflows/mbvar-a010-a18-formula-parity-20261103.yml'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests/test_a10_r5_math_equivalence.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MBVAR_A010_REQUIRE_INPUTS: '1'
jobs:
  registered-62-independent-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/scripts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/contracts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/RUN_REQUEST.json
      - name: Guard original frozen contract/RUN_REQUEST Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$EXP/code/contract_lock.py")" = "a62d43dfce65d7a9ec9cc061916ecc836960d4e9"
          test "$(git hash-object "$EXP/contracts/AMENDMENT-010.md")" = "3ee2e9995f46bfbe8e6e563fb18605feb47ba56f"
          echo '9e6b8bd72f9e935315eecdfd0c38c42f18db58f535c1596dbbfe391db383b77b  '"$EXP/RUN_REQUEST.json" | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 pytest==8.3.3
      - name: Fetch original locked FFD and observation model only
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
      - name: Independent baseline decide_v2 vs R5 all 62 effects and verdicts
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          python -m pytest -vv -p no:cacheprovider "$EXP/tests/test_a10_r5_math_equivalence.py" "$EXP/tests/test_a10_r5_a18.py" \
             2>&1 | tee "$RUNNER_TEMP/a18_formula_test.log"
          echo "A18_REGISTERED_62_MATH_PARITY_PASS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-a18-62-math-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/a18_formula_test.log
          if-no-files-found: warn
          retention-days: 90
