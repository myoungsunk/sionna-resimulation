name: EKF4 R2 bias decoupling paired reproducibility trial
on:
  push:
    branches: ['research/ekf4-bias-decouple-r2-audit-20261015']
    paths:
      - '.github/workflows/ekf4-r2-decouple-trial.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/bias_decouple_r2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audited-decoupling:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sparse checkout exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/ekf4-r2-decouple-trial.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pre-execution audit of source, no truth ingress and frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decouple"
          python - <<'PY'
          import ast,hashlib,json,pathlib,os
          p=pathlib.Path('research/EKF4_RANGE_S_STAGED_20261014')
          script=(p/'bias_decouple_r2.py').read_text()
          t=ast.parse(script)
          f=next(x for x in t.body if isinstance(x,ast.FunctionDef) and x.name=='filter_sequence')
          assert not any(isinstance(n,ast.Name) and n.id in ('truth','truebias','oracle') for n in ast.walk(f))
          audit=(p/'r2_bias_audit.py').read_text()
          tr=ast.parse(audit)
          base=next(n.value for n in tr.body if isinstance(n,ast.Assign) for target in n.targets if isinstance(target,ast.Name) and target.id=='BASE')
          hashes=ast.literal_eval(base)
          def blob(file):
           b=file.read_bytes()
           return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for path,expected in hashes.items():
           assert blob(pathlib.Path(path))==expected,(path,expected)
          assert 'if alg in ("S3","S4"):' in (p/'r2_bias_replay.py').read_text()
          receipt=dict(status='GO',commit=os.environ['GITHUB_SHA'],verified_frozen_blobs=len(hashes),
           no_truth_in_filter=True,source_sha256=hashlib.sha256(script.encode()).hexdigest())
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'decouple'/'AUDIT.json'
          dest.write_text(json.dumps(receipt,indent=2))
          print(receipt)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Retrieve and independently verify original RF and R2 baseline
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/original.zip"
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/baseline.zip"
          echo "88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  $RUNNER_TEMP/original.zip" | sha256sum -c
          echo "ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  $RUNNER_TEMP/baseline.zip" | sha256sum -c
      - name: Paired recursive replay and offline scoring
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pytest==8.3.5
          export PYTHONPATH="$PWD/research/EKF4_RANGE_S_STAGED_20261014:$PWD/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src"
          python research/EKF4_RANGE_S_STAGED_20261014/bias_decouple_r2.py --archive "$RUNNER_TEMP/original.zip" --baseline "$RUNNER_TEMP/baseline.zip" --out "$RUNNER_TEMP/decouple/results" | tee "$RUNNER_TEMP/decouple/run.log"
      - name: Preserve results and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-bias-decouple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decouple/
          if-no-files-found: warn
          retention-days: 30
