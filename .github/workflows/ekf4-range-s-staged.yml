name: EKF4 audit-first P2 staged validation
on:
  push:
    branches: ['research/ekf4-r3-to-p6-20261014']
    paths:
      - '.github/workflows/ekf4-range-s-staged.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/*.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/*.ini'
      - 'research/EKF4_RANGE_S_STAGED_20261014/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ekf4-audited-p2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-then-numerics-then-p2-representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source SHA; no model tests
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory static audit BEFORE any validation, diagnosis or experiment
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase preflight --out "$RUNNER_TEMP/pre_run" | tee "$RUNNER_TEMP/pre_run_audit.log"
          echo "EKF4_AUDIT_RECEIPT=$RUNNER_TEMP/pre_run/PRE_RUN_AUDIT.json" >> "$GITHUB_ENV"
      - name: Install pinned numerical dependencies AFTER audit
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: Verify unchanged P0 and P1 numerical contracts
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/validate.py --audit "$EKF4_AUDIT_RECEIPT" --until P1 --out "$RUNNER_TEMP/p0p1" | tee "$RUNNER_TEMP/p0p1.log"
      - name: Verify original R1 snapshot with outcome-based assertions
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/solver_regression.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r1" | tee "$RUNNER_TEMP/r1.log"
      - name: Verify R2 numerical invariants without requiring one logging branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r2"
          python -m pytest -q -s -c research/EKF4_RANGE_S_STAGED_20261014/pytest.ini research/EKF4_RANGE_S_STAGED_20261014/test_solver_r2.py --junitxml="$RUNNER_TEMP/r2/TESTS.xml" | tee "$RUNNER_TEMP/r2/TESTS.log"
          python research/EKF4_RANGE_S_STAGED_20261014/record_r2.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r2"
      - name: Download immutable R3 sixteen-failure archive after pre-run audit
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" /repos/myoungsunk/sionna-resimulation/actions/artifacts/11881761247/zip > "$RUNNER_TEMP/r3_failed_16.zip"
          test -s "$RUNNER_TEMP/r3_failed_16.zip"
      - name: Re-test all 16 archived R3 numerical failures before P2
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/r4_archive_check.py --audit "$EKF4_AUDIT_RECEIPT" --artifact "$RUNNER_TEMP/r3_failed_16.zip" --out "$RUNNER_TEMP/r4_fixed" | tee "$RUNNER_TEMP/r4_fixed.log"
      - name: Audited representative P2 only; do not run whole 600-trial matrix
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase preflight --out "$RUNNER_TEMP/p2_preflight" --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_preflight.log"
      - name: Mandatory renewed static audit for FULL P2
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase full --out "$RUNNER_TEMP/pre_run_full" | tee "$RUNNER_TEMP/pre_run_full_audit.log"
      - name: Full original P2 all 600 paired trials after representative passes
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase full --out "$RUNNER_TEMP/p2_full" --audit "$RUNNER_TEMP/pre_run_full/PRE_RUN_AUDIT.json" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_full.log"
      - name: Preserve all evidence even if an earlier stage fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-audited-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pre_run/**
            ${{ runner.temp }}/p0p1/**
            ${{ runner.temp }}/r1/**
            ${{ runner.temp }}/r2/**
            ${{ runner.temp }}/p2_preflight/**
            ${{ runner.temp }}/r4_fixed/**
            ${{ runner.temp }}/r4_fixed.log
            ${{ runner.temp }}/pre_run_full/**
            ${{ runner.temp }}/p2_full/**
            ${{ runner.temp }}/pre_run_audit.log
            ${{ runner.temp }}/p0p1.log
            ${{ runner.temp }}/r1.log
            ${{ runner.temp }}/p2_preflight.log
            ${{ runner.temp }}/pre_run_full_audit.log
            ${{ runner.temp }}/p2_full.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*_KO.md
            .github/workflows/ekf4-range-s-staged.yml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
