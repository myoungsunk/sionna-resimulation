name: EKF4 R4 audited five failures and full P2 with complete archives
on:
  push:
    branches: ['research/ekf4-r4-full-p2-audited-20261014']
    paths:
      - '.github/workflows/ekf4-range-s-staged.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/*.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/*.ini'
      - 'research/EKF4_RANGE_S_STAGED_20261014/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ekf4-audited-p2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-then-numerics-then-p2-representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source SHA; no model tests
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory static audit BEFORE any validation, diagnosis or experiment
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase preflight --out "$RUNNER_TEMP/pre_run" | tee "$RUNNER_TEMP/pre_run_audit.log"
          echo "EKF4_AUDIT_RECEIPT=$RUNNER_TEMP/pre_run/PRE_RUN_AUDIT.json" >> "$GITHUB_ENV"
      - name: Install pinned numerical dependencies AFTER audit
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: Verify unchanged P0 and P1 numerical contracts
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/validate.py --audit "$EKF4_AUDIT_RECEIPT" --until P1 --out "$RUNNER_TEMP/p0p1" | tee "$RUNNER_TEMP/p0p1.log"
      - name: Verify original R1 snapshot with outcome-based assertions
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/solver_regression.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r1" | tee "$RUNNER_TEMP/r1.log"
      - name: Verify R2 numerical invariants without requiring one logging branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r2"
          python -m pytest -q -s -c research/EKF4_RANGE_S_STAGED_20261014/pytest.ini research/EKF4_RANGE_S_STAGED_20261014/test_solver_r2.py --junitxml="$RUNNER_TEMP/r2/TESTS.xml" | tee "$RUNNER_TEMP/r2/TESTS.log"
          python research/EKF4_RANGE_S_STAGED_20261014/record_r2.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r2"
      - name: Download original P2 failure input artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" /repos/myoungsunk/sionna-resimulation/actions/artifacts/11875912063/zip > "$RUNNER_TEMP/P2_ORIGINAL.zip"
      - name: R3 regression against four archived failures
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/r3_four_regression.py --audit "$EKF4_AUDIT_RECEIPT" --artifact "$RUNNER_TEMP/P2_ORIGINAL.zip" --out "$RUNNER_TEMP/r3"
      - name: Download and SHA256-verify five original R3 numerical failures
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11892566974/zip > "$RUNNER_TEMP/R3_FIVE_FAILURES.zip"
          echo '931ee7cd8552820f3b6311877bb6ccc4ecc910669231290efb82e5868756c9b4  '"$RUNNER_TEMP/R3_FIVE_FAILURES.zip" | sha256sum -c
      - name: Audit-bound five failures in both original initialization modes
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/r4_five_regression.py --artifact "$RUNNER_TEMP/R3_FIVE_FAILURES.zip" --audit "$EKF4_AUDIT_RECEIPT" --out "$RUNNER_TEMP/r4_five" | tee "$RUNNER_TEMP/r4_five.log"
      - name: Re-run original representative six P2 cells with same four estimators
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase preflight --out "$RUNNER_TEMP/p2_preflight" --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_preflight.log"
      - name: Fresh full-phase static audit after representative PASS
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase full --out "$RUNNER_TEMP/pre_run_full" | tee "$RUNNER_TEMP/pre_run_full.log"
          echo "EKF4_FULL_AUDIT_RECEIPT=$RUNNER_TEMP/pre_run_full/PRE_RUN_AUDIT.json" >> "$GITHUB_ENV"
      - name: Audited FULL P2 frozen 600 paired trials and all four estimators
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase full --out "$RUNNER_TEMP/p2_full" --audit "$EKF4_FULL_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_full.log"
      - name: Independently verify all 600 inputs, 2400 traces, and manifest SHA
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/r4_full_receipt.py --full "$RUNNER_TEMP/p2_full" --audit "$EKF4_FULL_AUDIT_RECEIPT" --out "$RUNNER_TEMP/r4_full_receipt" | tee "$RUNNER_TEMP/r4_full_receipt.log"
      - name: Preserve all evidence even if an earlier stage fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-audited-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pre_run/**
            ${{ runner.temp }}/p0p1/**
            ${{ runner.temp }}/r1/**
            ${{ runner.temp }}/r2/**
            ${{ runner.temp }}/r3/**
            ${{ runner.temp }}/r4_five/**
            ${{ runner.temp }}/p2_preflight/**
            ${{ runner.temp }}/pre_run_full/**
            ${{ runner.temp }}/p2_full/**
            ${{ runner.temp }}/r4_full_receipt/**
            ${{ runner.temp }}/pre_run_audit.log
            ${{ runner.temp }}/p0p1.log
            ${{ runner.temp }}/r1.log
            ${{ runner.temp }}/p2_preflight.log
            ${{ runner.temp }}/r4_five.log
            ${{ runner.temp }}/pre_run_full.log
            ${{ runner.temp }}/p2_full.log
            ${{ runner.temp }}/r4_full_receipt.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*_KO.md
            .github/workflows/ekf4-range-s-staged.yml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
