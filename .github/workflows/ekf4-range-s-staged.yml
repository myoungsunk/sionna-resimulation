name: EKF4 Range-s staged validation
on:
  push:
    branches: ['research/ekf4-range-s-staged-20261014']
    paths:
      - '.github/workflows/ekf4-range-s-staged.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/**.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/pytest.ini'
      - 'research/EKF4_RANGE_S_STAGED_20261014/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekf4-staged-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gated-p0-p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout only additive EKF4 code at the event commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: P0 then P1; stop on failed gate
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/validate.py --until P1 --out "$RUNNER_TEMP/ekf4_p0p1" | tee "$RUNNER_TEMP/ekf4_execution.log"
      - name: P2 paired recursive synthetic experiment
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/synthetic.py --gates "$RUNNER_TEMP/ekf4_p0p1" --out "$RUNNER_TEMP/ekf4_p2" | tee "$RUNNER_TEMP/ekf4_p2_execution.log"
      - name: Preserve complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-stages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ekf4_p0p1/**
            ${{ runner.temp }}/ekf4_p2/**
            ${{ runner.temp }}/ekf4_execution.log
            ${{ runner.temp }}/ekf4_p2_execution.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*.md
            research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
            research/EKF4_RANGE_S_STAGED_20261014/pytest.ini
          if-no-files-found: error
          retention-days: 30
