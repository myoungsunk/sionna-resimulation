name: EKF4 D2 fixed-input diagnosis
on:
  push:
    branches: ['research/ekf4-range-s-staged-20261014']
    paths: ['.github/workflows/ekf4-range-s-staged.yml', 'research/EKF4_RANGE_S_STAGED_20261014/diagnose_resume.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-before-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Sparse checkout fixed event commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned diagnostic dependencies
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt mpmath==1.3.0
      - name: Diagnose both immutable snapshots; no P2
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/diagnose_resume.py --out "$RUNNER_TEMP/d2" | tee "$RUNNER_TEMP/d2.log"
      - name: Preserve read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-d2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d2/**
            ${{ runner.temp }}/d2.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*.md
            research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
          if-no-files-found: error
          retention-days: 30
