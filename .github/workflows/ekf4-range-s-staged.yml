name: EKF4 R3 audit-first P2 full and staged follow-up
on:
  # Full P2 is expensive and immutable evidence is already verified.
  # Do not rerun it on unrelated P3/P4/P6 source commits.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ekf4-r3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r3-audited-p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout audited source at immutable event SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory audit of execution and diagnostic code before validation
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase preflight --out "$RUNNER_TEMP/p2_audit_preflight" | tee "$RUNNER_TEMP/p2_audit_preflight.log"
          echo "EKF4_AUDIT_RECEIPT=$RUNNER_TEMP/p2_audit_preflight/PRE_RUN_AUDIT.json" >> "$GITHUB_ENV"
      - name: Acquire original immutable D3 failure archive
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11875912063/zip > "$RUNNER_TEMP/four_frozen_cases.zip"
          printf 'd25e96077a6b487fd0d90591362e141ee3908457808edf8688a7d3a480bad26b  %s\n' "$RUNNER_TEMP/four_frozen_cases.zip" | sha256sum --check
          echo "EKF4_R3_FROZEN_ARCHIVE=$RUNNER_TEMP/four_frozen_cases.zip" >> "$GITHUB_ENV"
      - name: Install pinned numerical tools after pre-audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: P0 P1 source and mathematics regression
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/validate.py --audit "$EKF4_AUDIT_RECEIPT" --until P1 --out "$RUNNER_TEMP/p0p1" | tee "$RUNNER_TEMP/p0p1.log"
      - name: Old fixed R1 regression independent of telemetry branch
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/solver_regression.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r1" | tee "$RUNNER_TEMP/r1.log"
      - name: Old R2 regression and guards independent of telemetry branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r2"
          python -m pytest -q -s -c research/EKF4_RANGE_S_STAGED_20261014/pytest.ini research/EKF4_RANGE_S_STAGED_20261014/test_solver_r2.py --junitxml="$RUNNER_TEMP/r2/TESTS.xml" | tee "$RUNNER_TEMP/r2/TESTS.log"
          python research/EKF4_RANGE_S_STAGED_20261014/record_r2.py --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/r2"
      - name: R3 four-failure regression from archived original inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r3"
          python -m pytest -q -s -c research/EKF4_RANGE_S_STAGED_20261014/pytest.ini research/EKF4_RANGE_S_STAGED_20261014/test_r3_four.py --junitxml="$RUNNER_TEMP/r3/TESTS.xml" | tee "$RUNNER_TEMP/r3/TESTS.log"
      - name: Six-cell P2 representative test using exact frozen P2 source
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase preflight --out "$RUNNER_TEMP/p2_preflight" --audit "$EKF4_AUDIT_RECEIPT" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_preflight.log"
      - name: Mandatory SECOND pre-run audit of full P2 workload
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/pre_run_audit.py --phase full --out "$RUNNER_TEMP/p2_audit_full" | tee "$RUNNER_TEMP/p2_audit_full.log"
      - name: Full frozen P2 600 paired trials if preflight passed
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p2_v2.py --phase full --out "$RUNNER_TEMP/p2_full" --audit "$RUNNER_TEMP/p2_audit_full/PRE_RUN_AUDIT.json" --gates "$RUNNER_TEMP/p0p1" --r2 "$RUNNER_TEMP/r2" | tee "$RUNNER_TEMP/p2_full.log"
      - name: Always preserve input/source/audit and raw per-trial trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-r3-p2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p2_audit_preflight/**
            ${{ runner.temp }}/p2_audit_full/**
            ${{ runner.temp }}/p0p1/**
            ${{ runner.temp }}/r1/**
            ${{ runner.temp }}/r2/**
            ${{ runner.temp }}/r3/**
            ${{ runner.temp }}/p2_preflight/**
            ${{ runner.temp }}/p2_full/**
            ${{ runner.temp }}/*.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*_KO.md
            .github/workflows/ekf4-range-s-staged.yml
          if-no-files-found: warn
          retention-days: 30
