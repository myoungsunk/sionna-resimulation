name: EKF4 P2 resume after R1 gates
on:
  push:
    branches: ['research/ekf4-range-s-staged-20261014']
    paths:
      - '.github/workflows/ekf4-range-s-staged.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/core.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/synthetic.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/test_core.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/test_solver_regression.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/solver_regression.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/pytest.ini'
      - 'research/EKF4_RANGE_S_STAGED_20261014/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekf4-staged-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p0-r1-then-p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout additive code at event SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-range-s-staged.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd research/EKF4_RANGE_S_STAGED_20261014
          printf '548258a444c02a3a1d0c2d210b470489560b1bd56ad911cc9ee93d7631b36ce7  P2_SPEC.json\nc3fc54d9726beab176971aa8652c0b6f61353f55f596613e4c8150351c4d9643  synthetic.py\nb8cd844003a865fc02b41286233980278b4ea7a2140b1fabe440166d8894afa9  core.py\n' | sha256sum --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: Same-commit P0 and P1 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/validate.py --until P1 --out "$RUNNER_TEMP/p0p1" | tee "$RUNNER_TEMP/p0p1.log"
      - name: R1 frozen failure regression gate
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/solver_regression.py --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/solver_r1" | tee "$RUNNER_TEMP/solver_r1.log"
      - name: Resume full frozen P2 from first trial
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/synthetic.py --gates "$RUNNER_TEMP/p0p1" --out "$RUNNER_TEMP/p2_resume" | tee "$RUNNER_TEMP/p2_resume.log"
      - name: Preserve all evidence on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p2-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p0p1/**
            ${{ runner.temp }}/solver_r1/**
            ${{ runner.temp }}/p2_resume/**
            ${{ runner.temp }}/p0p1.log
            ${{ runner.temp }}/solver_r1.log
            ${{ runner.temp }}/p2_resume.log
            research/EKF4_RANGE_S_STAGED_20261014/*.py
            research/EKF4_RANGE_S_STAGED_20261014/*.json
            research/EKF4_RANGE_S_STAGED_20261014/*.md
            research/EKF4_RANGE_S_STAGED_20261014/pytest.ini
            research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
            .github/workflows/ekf4-range-s-staged.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
