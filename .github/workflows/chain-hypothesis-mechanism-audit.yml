name: Chain hypotheses mechanism audit and final report
on:
  push:
    branches: ['research/powerjoint-chain-hypotheses-20261019']
    paths: ['.github/workflows/chain-hypothesis-mechanism-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Read completed outputs and immutable prepared inputs
        run: |
          gh run download 39246189321 --repo myoungsunk/sionna-resimulation --name chain-complete-39246189321 --dir "$RUNNER_TEMP/final"
          gh run download 39244326803 --repo myoungsunk/sionna-resimulation --name chain-model-39244326803 --dir "$RUNNER_TEMP/model"
          cp -R research/CHAIN_HYPOTHESES_20261019/. "$RUNNER_TEMP/final/code/"
          mkdir -p "$RUNNER_TEMP/final/mechanism"
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Trace physical onset and exact innovation contributions
        shell: bash
        run: |
          set -euo pipefail
          python research/CHAIN_HYPOTHESES_20261019/mechanism_post.py --delivery "$RUNNER_TEMP/final" --model "$RUNNER_TEMP/model" --out "$RUNNER_TEMP/final/mechanism" | tee "$RUNNER_TEMP/final/mechanism/MECHANISM.log"
      - name: Test local heading and RF-bias ambiguity on recorded linearizations
        shell: bash
        run: |
          set -euo pipefail
          python research/CHAIN_HYPOTHESES_20261019/observability_post.py --delivery "$RUNNER_TEMP/final" --model "$RUNNER_TEMP/model" --out "$RUNNER_TEMP/final/mechanism" | tee "$RUNNER_TEMP/final/mechanism/OBSERVABILITY.log"
      - name: Audit minor archive bookkeeping separately from numerical evidence
        shell: bash
        run: |
          python - "$RUNNER_TEMP/final" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          import pandas as pd
          root=Path(sys.argv[1]);mismatches=[];checked=0
          for mf in (root/'results').rglob('MANIFEST.csv'):
              for r in pd.read_csv(mf).itertuples(index=False):
                  p=mf.parent/r.path
                  if not p.exists():mismatches.append({'path':str(p),'kind':'missing'});continue
                  with p.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
                  checked+=1
                  if h!=r.sha256:mismatches.append({'path':str(p.relative_to(root)),'kind':'log_append_after_manifest' if p.suffix=='.log' else 'numerical_or_metadata_change'})
          d={'checked':checked,'mismatches':mismatches,'new_manifest_built_after_all_writers_close':True}
          (root/'mechanism/PACKAGING_AUDIT.json').write_text(json.dumps(d,indent=2));print('PACKAGING_QA',json.dumps(d))
          if any(m['kind']!='log_append_after_manifest' for m in mismatches):raise RuntimeError('Non-log content changed')
          PY
      - name: Generate report and final closed-file SHA256 manifest
        run: |
          python research/CHAIN_HYPOTHESES_20261019/make_report.py --delivery "$RUNNER_TEMP/final"
          mkdir -p "$RUNNER_TEMP/brief"
          cp "$RUNNER_TEMP/final/REPORT_KO.md" "$RUNNER_TEMP/brief/"
          cp "$RUNNER_TEMP/final/FINAL_MANIFEST.csv" "$RUNNER_TEMP/brief/"
          cp -R "$RUNNER_TEMP/final/analysis" "$RUNNER_TEMP/brief/"
          cp -R "$RUNNER_TEMP/final/mechanism" "$RUNNER_TEMP/brief/"
          cp -R "$RUNNER_TEMP/final/code" "$RUNNER_TEMP/brief/"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWER1_JOINT4_CHAIN_VALIDATION_BRIEF_20261019
          path: ${{ runner.temp }}/brief/
          compression-level: 6
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWER1_JOINT4_CHAIN_VALIDATION_FULL_20261019
          path: ${{ runner.temp }}/final/
          compression-level: 1
          retention-days: 30
