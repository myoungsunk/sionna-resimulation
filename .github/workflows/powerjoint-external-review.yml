name: POWERJOINT independent new-route result review
on:
  push:
    branches: ['research/powerjoint-chain-hypothesis-20261019']
    paths: ['.github/workflows/powerjoint-external-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: research/powerjoint-chain-hypothesis-20261019
          sparse-checkout: |
            research/CHAIN_REVIEW_20261019
            research/CHAIN_VALIDATED_RESULTS_20261019
          lfs: false
          persist-credentials: true
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Read fixed-candidate run and independently recompute physical-state scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/CHAIN_REVIEW_20261019/external_verify_publish.py
      - name: Publish exact output evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CHAIN_VALIDATED_RESULTS_20261019/external_evidence research/CHAIN_VALIDATED_RESULTS_20261019/RESULTS_F_NEW_ROUTES_KO.md
          git commit -m 'Publish independently verified fixed-candidate Mount45 new-route experiment'
          git pull --rebase origin research/powerjoint-chain-hypothesis-20261019
          git push origin HEAD:research/powerjoint-chain-hypothesis-20261019
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-final-new-route-review-${{ github.run_id }}
          path: research/CHAIN_VALIDATED_RESULTS_20261019/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
