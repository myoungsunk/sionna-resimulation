name: Powerjoint audit T6 source detector diagnostic
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-rerun-20261020]
    paths: [.github/workflows/powerjoint-audit-rerun-t6.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/source
          sparse-checkout: |
            research/POWERJOINT_AUDIT_RERUN_20261020
            research/CHAIN_HYPOTHESIS_20261019
            research/CHAIN_VALIDATED_RESULTS_20261019
            research/FFD_P0P3_20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Restore immutable release inputs
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
      - name: Source detector and tap FD audit
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/T6_RANGE/validate_native.py --source-root source --execution-root . --out t6_native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerjoint-audit-t6-${{ github.run_id }}
          path: |
            work/t6_native
            work/RESTORE_RECEIPT.json
          retention-days: 30
