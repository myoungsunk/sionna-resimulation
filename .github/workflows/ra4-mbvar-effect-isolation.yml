name: RA4 MBVAR factorial mean variance gate (retrospective QA)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra4
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 5
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Fetch historical source code, packet controls, FFD banks with SHA gate
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ra4input"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
          sha256sum "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Full 336-arm intervention with parity and factor identities
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ra4input"
          mkdir -p "$RUNNER_TEMP/ra4out"
          python -u "$EXP/ra4_effect_isolation.py" "$RUNNER_TEMP/ra4out" 2>&1 | tee "$RUNNER_TEMP/ra4out/RA4_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra4-336-arm-results-${{ github.run_id }}
          path: ${{ runner.temp }}/ra4out/
          retention-days: 30
          if-no-files-found: warn
