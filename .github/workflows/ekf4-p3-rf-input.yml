name: EKF4 P3 audit-first frozen RF data eligibility
on:
  push:
    branches: ['research/ekf4-r3-p6-staged-20261014']
    paths:
      - '.github/workflows/ekf4-p3-rf-input.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/p3_pre_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p3-input-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Sparse checkout frozen P0 data from exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/**\n/.github/workflows/ekf4-p3-rf-input.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json')
          j=json.loads(p.read_text())
          lines=['/research/EKF4_RANGE_S_STAGED_20261014/**',
                 '/research/EKF3_INDEPENDENT_20261013/**',
                 '/.github/workflows/ekf4-p3-rf-input.yml']
          lines.extend('/'+a['path'] for a in j['assets'])
          Path('/tmp/ekf4-p3-sparse').write_text('\n'.join(lines)+'\n')
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/ekf4-p3-sparse
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory p3_pre_audit.py source contract audit BEFORE input tests
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/p3_pre_audit.py
      - name: Install numerical dependencies AFTER audit
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: Verify ALL frozen input SHA shape timeline pose parity
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF3_INDEPENDENT_20261013/p0_verify_inputs.py | tee "$RUNNER_TEMP/P3_INPUT_RESULT.json"
      - name: Preserve input audit and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p3-rf-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/P3_PREAUDIT.json
            ${{ runner.temp }}/P3_INPUT_RESULT.json
            research/EKF4_RANGE_S_STAGED_20261014/p3_pre_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/P3_PRE_RUN_CODE_AUDIT_KO.md
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          if-no-files-found: warn
          retention-days: 30
