name: R5-3 Leave one route out Full RF physical quality
on:
  push:
    branches: ['research/r5-fullrf-heading-staged-20261015']
    paths:
      - '.github/workflows/r5-quality-heldroute.yml'
      - 'research/R5_FULLRF_HEADING_20261015/r5_quality_held_route.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R5_3_quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Sparse exact version checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_FULLRF_HEADING_20261015/r5_quality_held_route.py\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/01_FEATURES.csv\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv\n/.github/workflows/r5-quality-heldroute.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_HEADING_20261015/r5_quality_held_route.py --phase pre --out "$RUNNER_TEMP/r5_3_pre" | tee "$RUNNER_TEMP/r5_3_pre.log"
      - name: Pinned model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 scikit-learn==1.5.2
      - name: Route heldout multipath-risk calibration
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_HEADING_20261015/r5_quality_held_route.py --phase run --audit "$RUNNER_TEMP/r5_3_pre/PRE_AUDIT.json" --out "$RUNNER_TEMP/r5_3_result" | tee "$RUNNER_TEMP/r5_3_result.log"
      - name: Save raw result, audit and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-heldroute-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r5_3_pre/**
            ${{ runner.temp }}/r5_3_result/**
            ${{ runner.temp }}/r5_3_pre.log
            ${{ runner.temp }}/r5_3_result.log
          if-no-files-found: warn
          retention-days: 30
