name: N4 Q4-R independent complete three-stage calibration gate audit
on:
  push:
    branches: ['research/n4q-q4r-prior-calibration-20261015']
    paths:
      - '.github/workflows/n4q-q4r-review.yml'
      - 'research/N4_Q4R_20261015/q4r_review.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  q4r_independent_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact three original source versions plus independent verifier
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/N4_Q4R_20261015/q4r_posthoc.py\n/research/N4_Q4R_20261015/q4r_recursive.py\n/research/N4_Q4R_20261015/q4r_geometry.py\n/research/N4_Q4R_20261015/q4r_review.py\n/.github/workflows/n4q-q4r-review.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory original code blob and stage-check audit
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q4R_20261015/q4r_review.py --phase pre --out "$RUNNER_TEMP/q4review_pre" | tee "$RUNNER_TEMP/q4review_pre.log"
      - name: Retrieve original evidence with complete SHA verification
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11976975584/zip > "$RUNNER_TEMP/r1.zip"
          echo '86dc05d64ddb2ddf5a688665f387b6d12346162491fa9435ecaecf6c8f1aefe9  '"$RUNNER_TEMP/r1.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11976841890/zip > "$RUNNER_TEMP/r2.zip"
          echo '4f979b13f32c0a269d10dd0d7d1dc39d6f8b82dca425fb2e9aacf3cfda22e510  '"$RUNNER_TEMP/r2.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11977017861/zip > "$RUNNER_TEMP/r3.zip"
          echo '6cf473eb82b867e6b45c01500cdadaf088e8bdbf0f2f9ab616477c3080a5ff8d  '"$RUNNER_TEMP/r3.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11967961466/zip > "$RUNNER_TEMP/original_q4.zip"
          echo '599267063f87546ca76cf6f7c755977c74c8b298c18fbb89e73066dd34be3164  '"$RUNNER_TEMP/original_q4.zip" | sha256sum -c
      - name: Independently reconcile unchanged point estimates, original R0 parity, cubature and stage gates
        shell: bash
        run: |
          set -euo pipefail
          python research/N4_Q4R_20261015/q4r_review.py --phase run --out "$RUNNER_TEMP/q4review_out" --audit "$RUNNER_TEMP/q4review_pre/PRE_AUDIT.json" --r1 "$RUNNER_TEMP/r1.zip" --r2 "$RUNNER_TEMP/r2.zip" --r3 "$RUNNER_TEMP/r3.zip" --q4 "$RUNNER_TEMP/original_q4.zip" | tee "$RUNNER_TEMP/q4review_run.log"
      - name: Preserve independent output and failure audit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4q-q4r-independent-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/q4review_pre/**
            ${{ runner.temp }}/q4review_out/**
            ${{ runner.temp }}/q4review_pre.log
            ${{ runner.temp }}/q4review_run.log
          if-no-files-found: warn
          retention-days: 30
