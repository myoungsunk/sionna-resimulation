name: MB_VAR E2-E5 corrective validation
on:
  push:
    branches: ['research/mbvar-e2-e5-revalidation-20261029']
    paths:
      - '.github/workflows/mbvar-e2-e5-revalidation.yml'
      - 'research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029/RUN_REQUEST.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  DEST: research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - name: Reuse the original locked input acquisition (no RF channel downloads)
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/inputs"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reval-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  validate:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        case: [R2_aA_m0, R2_aB_m0, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
        part: [lo, hi]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_control_correction_20261029
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Retrieve inputs
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "reval-inputs-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/inputs"
      - name: Full-Jacobian and frozen-prior mean controls; corrected dynamic information
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/inputs"
          mkdir -p "$RUNNER_TEMP/out"
          python -m py_compile "$DEST/revalidate.py"
          python -u "$DEST/revalidate.py" --case '${{ matrix.case }}' --part '${{ matrix.part }}' --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/LOG_${{ matrix.case }}_${{ matrix.part }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reval-${{ matrix.case }}-${{ matrix.part }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error
  aggregate:
    needs: validate
    if: always() && needs.validate.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_control_correction_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2 tabulate==0.9.0
      - name: Collect and check all paired seeds
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards" "$RUNNER_TEMP/out"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'reval-R*' --dir "$RUNNER_TEMP/shards"
          find "$RUNNER_TEMP/shards" -type f -exec cp {} "$RUNNER_TEMP/out/" \;
          mkdir -p "$RUNNER_TEMP/out/code_snapshot"
          cp "$DEST/revalidate.py" "$RUNNER_TEMP/out/code_snapshot/"
          cp "$BASE/mbvar_control_correction_20261029/"{ctl_core.py,run_stage.py,aggregate_ctl.py,PROTOCOL_CONTROLS_KO.md} "$RUNNER_TEMP/out/code_snapshot/"
          python -u "$DEST/revalidate.py" --aggregate --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/AGGREGATE_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reval-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: Publish additive evidence to the research branch
        if: always()
        run: |
          set -euo pipefail
          TARGET="$DEST/results/run_$GITHUB_RUN_ID"
          mkdir -p "$TARGET"
          cp -R "$RUNNER_TEMP/out/". "$TARGET/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "MB_VAR E2/E5 corrective evidence run $GITHUB_RUN_ID" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git -c http.extraheader="$AUTH" pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
