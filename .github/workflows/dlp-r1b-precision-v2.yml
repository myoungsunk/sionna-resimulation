name: R1B PREC-V2 exact Sionna 2.0.1 DrJit delay recheck
on:
  push:
    branches:
      - research/dlp-r1b-precision-bridge-v1-20261103
    paths:
      - .github/workflows/dlp-r1b-precision-v2.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  old8_exact_source_delay:
    name: Rebuild source-only delay using v2.0.1 native DrJit arithmetic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/DLP_R1B_CH4_20261103/precision_v2/**
            /research/DLP_R1B_CH4_20261103/runs/P0_CANARY_V2/**
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the exact 8 frozen raw objects and pinned RT numerical stack
        shell: bash
        run: |
          set -euo pipefail
          D=research/DLP_R1B_CH4_20261103/runs/P0_CANARY_V2
          for p in 0000 0150 0221 0440 0458 0476 0696 0916; do
            F="$D/pose_$p.npz"
            TMP=$(mktemp)
            env -u GIT_LFS_SKIP_SMUDGE git lfs smudge "$F" <"$F" >"$TMP"
            mv "$TMP" "$F"
          done
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 scipy==1.14.1 mitsuba==3.8.0 drjit==1.3.1
          if ! ldconfig -p | grep -q libLLVM.so; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm-18 libllvm18
          fi
      - name: Independently derive RT-precision tau from source geometry, not Native tau
        shell: bash
        run: |
          set -euo pipefail
          python -u research/DLP_R1B_CH4_20261103/precision_v2/solver_matched_delay.py \
            --raw-dir research/DLP_R1B_CH4_20261103/runs/P0_CANARY_V2 \
            --out /tmp/PREC_V2_DRJIT_8_RECHECK.json
      - name: Archive numerical receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1b-precision-v2-old8-${{ github.run_id }}
          path: /tmp/PREC_V2_DRJIT_8_RECHECK.json
          if-no-files-found: warn
          retention-days: 30
