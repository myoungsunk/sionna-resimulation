name: Range only EKF bias variance temporal trust ablations
on:
  push:
    branches: [codex/range-only-bias-consistency-20261011]
    paths:
      - '.github/workflows/range-only-bias-consistency-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heldout-range-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/01_FEATURES.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/CASES.json
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_T10.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R4_T10.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R4_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R5_T10.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R5_Tnone.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.2.4' 'pandas==2.2.3' 'scipy==1.15.2' 'tabulate==0.9.0'
      - name: Source syntax and one case smoke test
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py
          python -X utf8 research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py --out research_results/SMOKE_RANGE --smoke
      - name: Re-evaluate range-only cases with heldout calibration
        run: python -X utf8 research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py --out research_results/RANGE_MAIN --seeds 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensor-v2-range-only-trust-ablation-20261011
          path: research_results
          if-no-files-found: warn
          retention-days: 30
