name: RA5 seven RF cases LORO deterministic distance error and sub-tap calibration
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-range-loro-seven-source-h.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/range_correction_loro.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  SRC: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  loro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3
      - name: SHA-lock original seven case H and pose coordinates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source";mkdir -p "$ROOT"
          git init --bare "$RUNNER_TEMP/original.git"
          git -C "$RUNNER_TEMP/original.git" remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -C "$RUNNER_TEMP/original.git" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$SRC"
          BLK=results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
          for CASE in R2_aA_m0 R2_aB_m0 R2_aA_m45 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            git -C "$RUNNER_TEMP/original.git" cat-file -p "$SRC:$BLK/FULL_RF/H_$CASE.npy" > "$ROOT/H_$CASE.npy"
            git -C "$RUNNER_TEMP/original.git" cat-file -p "$SRC:$BLK/$CASE/SAMPLES.json" > "$ROOT/SAMPLES_$CASE.json"
          done
          git -C "$RUNNER_TEMP/original.git" cat-file -p "$SRC:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
      - name: Leave-one-route-out fixed-original-data distance residual diagnostic
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python -u "$EXP/range_correction_loro.py" \
            --source "$RUNNER_TEMP/source" \
            --input-manifest research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json \
            --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-range-seven-case-loro-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
