name: RA4 archived 28-condition 2x2 and gate independent check
on:
  push:
    branches: ['audit/ra4-factorial-g3-precision-20261029']
    paths: ['.github/workflows/ra4-fast-historical-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/RA0_RA1_RA2_AUDIT_20261029/ra4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source SHA, exact interaction and mask outcome checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ra4a"
          python -u research/RA0_RA1_RA2_AUDIT_20261029/ra4/ra4_historical_auditor.py "$RUNNER_TEMP/ra4a" | tee "$RUNNER_TEMP/ra4a/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra4-historical-effects-${{ github.run_id }}
          path: ${{ runner.temp }}/ra4a/
          retention-days: 30
          if-no-files-found: warn
