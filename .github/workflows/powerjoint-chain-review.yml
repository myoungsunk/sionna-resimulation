name: POWERJOINT independent chain result review
on:
  push:
    branches: ['research/powerjoint-chain-hypothesis-20261019']
    paths: ['.github/workflows/powerjoint-chain-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          sparse-checkout: research/CHAIN_REVIEW_20261019
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Read saved run and independently evaluate numerical claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u research/CHAIN_REVIEW_20261019/review_bootstrap.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-chain-independent-review-${{ github.run_id }}
          path: result/review/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
