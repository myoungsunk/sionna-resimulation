name: POWERJOINT fixed-candidate new-route evaluation
on:
  push:
    branches: ['research/powerjoint-chain-hypothesis-20261019']
    paths: ['.github/workflows/powerjoint-heldout-evaluation.yml']
permissions:
  contents: read
  actions: read
jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Sparse source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          cd source
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/CHAIN_HYPOTHESIS_20261019/**\n/research/CHAIN_REVIEW_20261019/**\n/research/FFD_P0P3_20261016/**\n/research/R5_N4B_20261015/*.py\n/research/R5_N4C_20261015/*.py\n/research/R5_FULLRF_B0_GATES_20261015/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/*.json\n/research/EKF3_INDEPENDENT_20261013/*.py\n/research/EKF3_INDEPENDENT_20261013/*.json\n/research/PHYSICS_RS_STAGED_20261015/code/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Restore same original FFD and inference dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u source/research/CHAIN_HYPOTHESIS_20261019/restore.py
      - name: Fixed candidate external evaluation, never retune on these results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u source/research/CHAIN_REVIEW_20261019/heldout_bootstrap.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-locked-external-evaluation-${{ github.run_id }}
          path: external_out/
          retention-days: 30
          compression-level: 4
          if-no-files-found: warn
