name: Archived H cross-time P6 and RF noise Monte Carlo 128seeds
on:
  push:
    branches: [codex/range-only-bias-consistency-20261011]
    paths:
      - '.github/workflows/pose-rf-cross-time-existing-h-mc-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_pose_rf_cross_time_mc_existing_H.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  covariance-theory-vs-repeated-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_pose_rf_cross_time_mc_existing_H.py
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/CASES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m0.npy
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/freqs_hz.npy
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_T10.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.2.4' 'pandas==2.2.3' 'scipy==1.15.2' 'tabulate==0.9.0'
      - name: Smoke source and 16 independent receiver and gyro seeds
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_pose_rf_cross_time_mc_existing_H.py
          python -X utf8 research/HEADING_RELIABILITY_20261010/run_pose_rf_cross_time_mc_existing_H.py --out research_results/CROSSTIME_SMOKE --seeds 16
      - name: Verify theoretical cross-time pose error covariance versus 128 trials
        run: python -X utf8 research/HEADING_RELIABILITY_20261010/run_pose_rf_cross_time_mc_existing_H.py --out research_results/CROSSTIME_128 --seeds 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stored-h-128seed-cross-time-p6-and-rf-covariance-20261011
          path: research_results
          if-no-files-found: warn
          retention-days: 30
