name: RA5 Gate 0 - A4 all 28 conditions exact identities and gate
on:
  push:
    branches: ['audit/ra5-staged-execution-20261029']
    paths:
      - '.github/workflows/ra5-gate-a4-full28.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra4
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  all28:
    strategy:
      fail-fast: false
      matrix:
        case:
          - R2_aA_m0
          - R2_aB_m0
          - R2_aA_m45
          - R4_aA_m0
          - R4_aB_m0
          - R5_aA_m0
          - R5_aB_m0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 5
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Freeze and fetch original historical inputs
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/a4input"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Run exact full-length cases
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/a4input"
          mkdir -p "$RUNNER_TEMP/a4out"
          python -u "$EXP/a4_full28_gate.py" --case "${{ matrix.case }}" --out "$RUNNER_TEMP/a4out" 2>&1 | tee "$RUNNER_TEMP/a4out/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a4-full28-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a4out/
          retention-days: 30
          if-no-files-found: warn
