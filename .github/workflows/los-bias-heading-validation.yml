name: D0 Full CIR LoS and heading information validation
on:
  push:
    branches: ['research/los-bias-heading-validation-20261022']
    paths: ['.github/workflows/los-bias-heading-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2
      - name: Validation
        run: python -u research/PJ_DS_GATED_20261021/los_bias_validation.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: los-bias-heading-validation-${{ github.run_id }}
          path: research/PJ_DS_GATED_20261021/results_los_bias/
      - name: Save on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_DS_GATED_20261021/results_los_bias
          git commit -m "Validated LoS reconstruction on heldout routes from run ${{ github.run_id }}" || echo 'no changes'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
