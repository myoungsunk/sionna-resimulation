name: RF signed range and DR-RF directional audit
on:
  push:
    branches:
      - research/rf-range-sign-audit-g2g3-20261014
    paths:
      - .github/workflows/h3-range-sign-audit.yml
      - research/EKF3_INDEPENDENT_20261013/diagnostics/h3_range_sign_audit.py
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: h3-range-sign-audit
  cancel-in-progress: false

jobs:
  frozen-sign-and-direction:
    name: Frozen signed RF Range and DR-RF sign win-rate audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Sparse checkout frozen observer RF and original research files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/EKF3_INDEPENDENT_20261013/*.py
            /research/EKF3_INDEPENDENT_20261013/*.json
            /research/EKF3_INDEPENDENT_20261013/diagnostics/*.py
            /research/EKF3_INDEPENDENT_20261013/diagnostics/*.json
            /research/EKF3_INDEPENDENT_20261013/diagnostics/h3_offline/results/H3_OFFLINE_20261014_01a1380d/*.py
            /research/EKF3_INDEPENDENT_20261013/diagnostics/h3_offline/results/H3_OFFLINE_20261014_01a1380d/CONTRACT.json
            /research/EKF3_INDEPENDENT_20261013/diagnostics/h3_offline/results/H3_OFFLINE_20261014_01a1380d/STAGE4_SMOKE_01/D0_PARITY.csv
            /research/EKF3_INDEPENDENT_20261013/diagnostics/results/AUDITED_RUN_20261013_701b8d2/OUTPUT_D0_D4_SEED0/D4_RANGE_RESIDUAL_BY_DISTANCE.csv
            /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/**
            /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/INPUTS/*.csv
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/*/SAMPLES.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/H_LoS_*.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_*.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/freqs_hz.npy
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3
      - name: Syntax validation
        run: python -m py_compile research/EKF3_INDEPENDENT_20261013/diagnostics/h3_range_sign_audit.py
      - name: Execute signed residual and directional truth-scoring audit
        run: |
          python research/EKF3_INDEPENDENT_20261013/diagnostics/h3_range_sign_audit.py --out outputs/rf_range_sign_audit
      - name: Archive files including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf-range-sign-audit-evidence
          path: outputs/rf_range_sign_audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Print verdict into run summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("outputs/rf_range_sign_audit/AUDIT_RECEIPT.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Frozen RF Range sign audit\n\n")
              if not p.exists():
                  f.write("BLOCKED - no receipt produced\n")
              else:
                  r=json.loads(p.read_text())
                  for key in ("status","input_parity","sample_count","confirmed_failure_case",
                              "one_sided_logical_check","error","next_action"):
                      f.write("**"+key+"**: "+str(r.get(key))+"\n\n")
          PY
