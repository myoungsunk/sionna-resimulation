name: BASE RF retry S6 2s and 5s with full checkpoint parity
on:
  push:
    branches: [research/base-rf-identifiability-v2-code-20261023]
    paths: [.github/workflows/base-rf-pilot-retry.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: base-rf-retry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resume-stage:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {label: S6-w2, stage: S6, window: 2}
          - {label: S6-w5, stage: S6, window: 5}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PJ_SOURCE_ROOT: /tmp/brf_source
      PJ_OUT: /tmp/brf_output/native_scratch
      PJ_ART: /tmp/brf_art
      PJ_BANK_DOWNLOAD: /tmp/brf_banks
    steps:
      - name: Sparse checkout without changing scientific source
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --cone
          paths='research/PJ_BASE_PRESERVE_IDENTIFIABILITY_20261023 research/PJ_SEPARATE_RS_20261020 research/PJ_DS_GATED_20261021 research/PJ_D0_CIR_P2_RECURSIVE_20261022 research/PJ_D0_CIR_PRIOR_P1R_20261022 research/PJ_D1_TEMPORAL_20261021 research/PJ_CONSISTENCY_M123_20261021 research/EKF4_RANGE_S_STAGED_20261014 research/PHYSICS_RS_STAGED_20261015 research/R5_N4B_20261015 research/R5_FULLRF_B0_GATES_20261015 research/FFD_P0P3_20261016 scripts'
          git sparse-checkout set $paths
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=1 origin 0686b23ceeefb696bc158b32b39f8077c564ef5d
          git worktree add --no-checkout --detach /tmp/brf_reference 0686b23ceeefb696bc158b32b39f8077c564ef5d
          git -C /tmp/brf_reference sparse-checkout init --cone
          git -C /tmp/brf_reference sparse-checkout set $paths
          git -C /tmp/brf_reference reset --hard 0686b23ceeefb696bc158b32b39f8077c564ef5d
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original scientific dependencies
        run: python -m pip install --disable-pip-version-check -r research/PJ_BASE_PRESERVE_IDENTIFIABILITY_20261023/requirements.txt
      - name: Restore completed S0-S5 and quarantine interrupted S6
        run: |
          set -euo pipefail
          mkdir -p /tmp/brf_saved /tmp/brf_resume_meta
          gh run download 40063600117 --repo myoungsunk/sionna-resimulation --name base-rf-pilot-stage-results-40063600117 --dir /tmp/brf_saved
          cp -a /tmp/brf_saved/brf_output /tmp/brf_output
          cp /tmp/brf_saved/brf_config.json /tmp/brf_config.json
          test ! -f /tmp/brf_output/S6_STATUS.json
          if [ -d /tmp/brf_output/S6 ]; then mv /tmp/brf_output/S6 /tmp/brf_resume_meta/previous_incomplete_S6; fi
          python - <<'PY'
          from scripts.base_rf_resume_pilot import verify_saved
          print('SAVED_RECEIPTS', verify_saved('/tmp/brf_output'))
          PY
      - name: Restage identical original assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/brf_source /tmp/brf_art /tmp/brf_banks /tmp/brf_models /tmp/brf_grid
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir /tmp/brf_source
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/brf_banks
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/brf_art
          gh run download 39893308814 --repo myoungsunk/sionna-resimulation --pattern 'p2l4train-*' --dir /tmp/brf_models
          gh run download 39752301964 --repo myoungsunk/sionna-resimulation --pattern 'p1r-grid-*' --dir /tmp/brf_grid
          python research/PJ_SEPARATE_RS_20261020/initialize.py
          python scripts/base_rf_identifiability_v2.py inventory --config /tmp/brf_config.json --lock-out /tmp/brf_input_lock.json
          python scripts/base_rf_resume_pilot.py verify --config /tmp/brf_config.json
          python scripts/base_rf_identifiability_v2.py audit-code --config /tmp/brf_config.json
      - name: Execute exact S6 window subset without sampling
        if: matrix.stage == 'S6'
        run: |
          set -euo pipefail
          python -u scripts/base_rf_resume_pilot.py shard --window '${{ matrix.window }}' --config /tmp/brf_config.json 2>&1 | tee /tmp/brf_resume_meta/S6_SHARD_LOG.txt
      - name: Preserve stage outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-rf-retry-${{ matrix.label }}-${{ github.run_id }}
          path: |
            /tmp/brf_output/S7/
            /tmp/brf_output/S7_STATUS.json
            /tmp/brf_output/S6_SHARDS/
            /tmp/brf_resume_meta/
            /tmp/brf_config.json
            /tmp/brf_input_lock.json
          retention-days: 30
          if-no-files-found: warn
