name: POL-XCORR-001 P0V3 delta preflight (v0.3 DRAFT, label-free)
on:
  push:
    branches:
      - research/pol-xcorr-implementer-p0v3-20261029
    paths:
      - .github/workflows/pol-xcorr-p0v3-delta.yml
      - research/POL_XCORR_UNRESOLVED_20261029/scripts/p0v3_delta_preflight.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  p0v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout pinned v0.3 implementation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/POL_XCORR_UNRESOLVED_20261029
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
            research/PHYSICS_RS_STAGED_20261015/code/features.py
            research/PHYSICS_RS_STAGED_20261015/RESULTS_KO.md
            research/PJ_DS_GATED_20261021/results_hpath/HP_PACKETS.csv.gz
            research/PJ_DS_GATED_20261021/v_replay.py
            research/PJ_DS_USAGE_MAP_20261021/results/UM_POSE_TABLE.csv.gz
            research/FFD_P0P3_20261016/source_model.py
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reproducible dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Label-free mutation and physics fixtures
        run: |
          set -euo pipefail
          python -u research/POL_XCORR_UNRESOLVED_20261029/scripts/p0v3_delta_preflight.py \
            --repo-root . --out /tmp/p0v3_fixture_${{ github.run_id }} --fixtures-only
          python - <<'PY'
          import json
          p="/tmp/p0v3_fixture_${{ github.run_id }}/P0V3_NEGATIVE_FIXTURES.json"
          j=json.load(open(p))
          print("P0V3 fixture checks:",j["count"],j["status"])
          assert j["status"]=="PASS" and j["count"]>=15
          PY
      - name: P0V3 direct parity and LoS weak-port only
        id: p0v3
        run: |
          set -uo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/results_p0_v03/run_$GITHUB_RUN_ID"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -u research/POL_XCORR_UNRESOLVED_20261029/scripts/p0v3_delta_preflight.py \
            --repo-root . --out "$OUT"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "P0V3 exit: $rc; 0=IMPLEMENTER TECH QA only, never independent auditor PASS"
          if [ -f "$OUT/P0V3_STATUS.json" ]; then
            python - "$OUT/P0V3_STATUS.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          print("STATUS",j["status"])
          for k,v in j["checks"].items():print(k,v.get("status"))
          PY
          fi
          exit 0
      - name: Upload append-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: POL_XCORR_P0V3_${{ github.run_id }}
          path: research/POL_XCORR_UNRESOLVED_20261029/results_p0_v03/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit only newly created label-free P0V3 outputs
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$OUT" ] || [ ! -d "$OUT" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "POL-XCORR-001 P0V3 label-free run $GITHUB_RUN_ID (append-only, no science)" || echo "No changes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Fail workflow if technical preflight failed
        if: always()
        run: |
          rc="${{ steps.p0v3.outputs.exit_code }}"
          if [ -z "$rc" ]; then
            echo "P0V3 did not execute; CI is incomplete"
            exit 2
          fi
          exit "$rc"
