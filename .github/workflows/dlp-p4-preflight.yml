name: DLP P4 Pilot native three-anchor independent pre-run audit
on:
  push:
    branches: ['research/dual-lp-p4-3anchor-pilot-20261102']
    paths:
      - '.github/workflows/dlp-p4-preflight.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/audits/P4_20261102/p4_preflight.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  P4_PRE_OUT: /tmp/dlp_p4_preaudit
  P4_BANKS: /tmp/dlp_p4_banks
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact P4 contract, real Native C and original AB RF without changing source
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          export GIT_LFS_SKIP_SMUDGE=1
          git -c protocol.version=2 fetch --depth=1 --no-tags --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat >.git/info/sparse-checkout <<'LIST'
          /research/DUAL_LP_PAPER_GAP_20261030/contracts/**
          /research/DUAL_LP_PAPER_GAP_20261030/audits/P4_20261102/p4_preflight.py
          /research/EKF4_RANGE_S_STAGED_20261014/core.py
          /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          /research/DUAL_LP_PAPER_GAP_20261030/runs/P3_NATIVE_SIONNA_RT_41395666117/P3_NATIVE_39_AGGREGATE_QA.json
          /research/DUAL_LP_PAPER_GAP_20261030/runs/P3_NATIVE_SIONNA_RT_41395666117/P3_NATIVE_C_39_CASE_RESULTS.csv
          /research/DUAL_LP_PAPER_GAP_20261030/runs/P3_NATIVE_SIONNA_RT_41395666117/P3_NATIVE_C_39_RAW_H_TAU_PATHS.zip
          LIST
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json')
          a=json.loads(p.read_text())
          patterns=pathlib.Path('.git/info/sparse-checkout').read_text().splitlines()
          for case in a['primary_cases']:
            if case['case_id'] in [r+'_a'+v+'_m0' for r in ('R2','R4','R5') for v in ('A','B')]:
              patterns.extend('/'+case[z] for z in ('full_path','los_path','samples_path'))
          patterns.extend('/'+x['path'] for x in a['base_assets'] if x['kind'] in ('TIMELINE_TNONE',))
          pathlib.Path('/tmp/p4_requested_sparse').write_text('\n'.join(sorted(set(patterns)))+'\n')
          PY
          git sparse-checkout set --no-cone --stdin </tmp/p4_requested_sparse
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install numpy for independent actual RF and EKF math QA
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.3
          python -m py_compile research/DUAL_LP_PAPER_GAP_20261030/audits/P4_20261102/p4_preflight.py
      - name: Verify original physical FFD bank bytes (not Git LFS pointers)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P4_BANKS" "$P4_PRE_OUT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation \
            --name ffd-verified-original-38875080492 --dir "$P4_BANKS"
      - name: Perform P4 pre-run native packet, 4-state and negative controls
        shell: bash
        run: |
          set -uo pipefail
          python -u research/DUAL_LP_PAPER_GAP_20261030/audits/P4_20261102/p4_preflight.py \
            2>&1 | tee "$P4_PRE_OUT/P4_PRE_RUN_LOG.txt"
          exit "${PIPESTATUS[0]}"
      - name: Preserve all pre-run failures or successes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlp-p4-native-preflight-${{ github.run_id }}
          path: /tmp/dlp_p4_preaudit/
          retention-days: 30
          if-no-files-found: warn
      - name: Append-only publish independent code-run audit receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$P4_PRE_OUT/P4_PRE_RUN_AUDIT.json" || { echo 'No receipt to publish'; exit 0; }
          D="research/DUAL_LP_PAPER_GAP_20261030/audits/P4_20261102/pre_run_${GITHUB_RUN_ID}"
          mkdir -p "$D"
          cp -a "$P4_PRE_OUT/." "$D/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$D"
          git commit -m "audit(p4): preserve source-input preflight ${GITHUB_RUN_ID}, no full RF fabrication" || exit 0
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
