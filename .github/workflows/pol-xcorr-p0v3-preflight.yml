name: POL-XCORR-001 P0V3_DELTA_PREFLIGHT (DRAFT v0.3, label-free, implementer)
# TASK_HANDOFF_v0.3: R-04 exact tap/branch/valid parity, R-14 LoS weak-port math, R-12/R-13 lineage, negative fixtures.
# No S0/P1/P2/P3 trigger exists in this workflow. Output is append-only: results_p0_v03/run_<id>.
on:
  push:
    branches: ['research/pol-xcorr-p0v3-implementer-20261029']
    paths:
      - '.github/workflows/pol-xcorr-p0v3-preflight.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/scripts/p0v3_preflight.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  p0v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies (pinned, same as P0 run 40867521966)
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Fetch R-13b reference artifact (supplementary; failure recorded, not fatal)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/r13b
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation \
            --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/r13b
          f=$(find /tmp/r13b -name 'OBSERVATION_FEATURES_LABELS.csv.gz' | head -1)
          test -n "$f"
          echo "R13B_PATH=$f" >> "$GITHUB_ENV"
          sha256sum "$f"
      - name: P0V3 delta preflight on locked inputs
        run: |
          set +e; set -uo pipefail   # capture a non-zero P0V3 exit code; the final step propagates it
          OUT="research/POL_XCORR_UNRESOLVED_20261029/results_p0_v03/run_${GITHUB_RUN_ID}"; export OUT
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS=(--repo-root . --out "$OUT" --execution-git-sha "$GITHUB_SHA")
          if [ -n "${R13B_PATH:-}" ]; then ARGS+=(--g5-artifact "$R13B_PATH" --archive-r13b); fi
          python -u research/POL_XCORR_UNRESOLVED_20261029/scripts/p0v3_preflight.py "${ARGS[@]}"
          rc=$?
          echo "RC=$rc" >> "$GITHUB_ENV"
          printf '{"github_run_id": "%s", "head_sha": "%s", "exit_code": %s, "r13b_path": "%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$rc" "${R13B_PATH:-}" > "$OUT/RUN_RECEIPT.json"
          python - <<'EOF'
          import json, os
          s = json.load(open(os.environ['OUT'] + '/P0V3_STATUS.json'))
          print('RESULT', s['result_status'])
          for k, v in s['checks'].items():
              print(f"{k:42s} {v['class']:14s} {v['status']}")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pol-xcorr-p0v3-${{ github.run_id }}
          path: research/POL_XCORR_UNRESOLVED_20261029/results_p0_v03/
          retention-days: 90
          if-no-files-found: error
      - name: Commit P0V3 outputs (append-only new run folder)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "POL-XCORR-001 P0V3 delta preflight outputs from run $GITHUB_RUN_ID (label-free, DRAFT v0.3) [skip ci]" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Propagate P0V3 status (green only for TECHNICAL_QA_ONLY)
        if: always()
        run: |
          echo "p0v3 exit code ${RC:-unset}"
          [ "${RC:-1}" = "0" ]
