name: RA5 conditional adjacent-tap Fisher from same original FFD and complex noise (NO RT)
on:
  push:
    branches: ['audit/ra5-physical-tap-field-reuse-20261030']
    paths:
      - '.github/workflows/ra5-conditional-tap-information.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  same_scene_J_R:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          ref: c4d84e02b878af9835bef09d515d45f4010caa74
          path: upstream_mbvar
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Lock original source and FFD branches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code/world.py")" = "2129aefa65e8dba7abd39dd4a66a89c066eac593"
          export REFLECT_ROOT="$RUNNER_TEMP/ra5input"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
      - name: Same-scene LoS FFD J_s0,J_s1 and complex-CFR noise covariance
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ra5input"
          mkdir -p "$RUNNER_TEMP/result"
          python -u "$EXP/conditional_tap_information.py" \
            --mbvar-code "upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code" \
            --draw 768 --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-conditional-info-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
