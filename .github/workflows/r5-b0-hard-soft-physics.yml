name: R5 B0 Full RF physics Hard Soft Gating audited
on:
  push:
    branches: ['research/r5-b0-hard-soft-physics-20261015']
    paths:
      - '.github/workflows/r5-b0-hard-soft-physics.yml'
      - 'research/R5_FULLRF_B0_GATES_20261015/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-b0-physics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r5_b0_physics_hard_soft:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Sparse exact source+raw H checkout at immutable commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_FULLRF_B0_GATES_20261015/**\n/research/PHYSICS_RS_STAGED_20261015/code/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-b0-hard-soft-physics.yml\n' > .git/info/sparse-checkout
          BASE='results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C'
          printf '/%s/FULL_RF/*.npy\n/%s/H_LoS_*.npy\n/%s/freqs_hz.npy\n' "$BASE" "$BASE" "$BASE" >> .git/info/sparse-checkout
          for CASE in R2_aA_m0 R2_aA_m45 R2_aB_m0 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            printf '/%s/%s/SAMPLES.json\n' "$BASE" "$CASE" >> .git/info/sparse-checkout
          done
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory original PHY source and all raw H SHA source audit BEFORE numeric work
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py --phase pre --out "$RUNNER_TEMP/r5_b0_pre" | tee "$RUNNER_TEMP/r5_b0_pre.log"
      - name: Retrieve validated historical original RF and R2 recursive snapshots
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/r5_original_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/r5_original_RF.zip" | sha256sum -c
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/r5_original_R2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/r5_original_R2.zip" | sha256sum -c
      - name: Install pinned original-stage numerical dependencies after source audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Original scalar optimized Joseph and physical-feature semantic tests
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py --phase test | tee "$RUNNER_TEMP/r5_b0_tests.log"
      - name: B0 hard versus soft recursive original RF and G5 replication
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py --phase run --raw "$RUNNER_TEMP/r5_original_RF.zip" --r2 "$RUNNER_TEMP/r5_original_R2.zip" --audit "$RUNNER_TEMP/r5_b0_pre/PRE_AUDIT.json" --out "$RUNNER_TEMP/r5_b0_result" | tee "$RUNNER_TEMP/r5_b0_run.log"
      - name: Always preserve audit failures and complete raw x P
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-b0-hard-soft-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r5_b0_pre/**
            ${{ runner.temp }}/r5_b0_result/**
            ${{ runner.temp }}/r5_b0_pre.log
            ${{ runner.temp }}/r5_b0_tests.log
            ${{ runner.temp }}/r5_b0_run.log
            research/R5_FULLRF_B0_GATES_20261015/**
            .github/workflows/r5-b0-hard-soft-physics.yml
          if-no-files-found: warn
          retention-days: 30
