name: FP B-only route-heldout calibration pilot 20261108
on:
  push:
    branches:
      - analysis/fp-b-calibration-pilot-20261108
    paths:
      - .github/workflows/fp-b-calibration-pilot-20261108.yml
      - research/FP_B_CALIBRATION_PILOT_20261108/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fp-b-calibration-pilot-${{ github.sha }}
  cancel-in-progress: false
jobs:
  b-calib:
    name: Frozen B-only versus route-heldout B-specific mu and covariance
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}
      RUN_DIR: /tmp/fp-b-calibration
      BASE_CODE: research/FP_NATIVE_B_CAUSAL_ABLATION_20261108
      PILOT_CODE: research/FP_B_CALIBRATION_PILOT_20261108
      PYTHONPATH: ${{ github.workspace }}/research/FP_NATIVE_B_CAUSAL_ABLATION_20261108
    steps:
      - name: Checkout pinned original source and calibration pilot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fp-b-calibration-pilot-20261108.yml
            /research/FP_B_CALIBRATION_PILOT_20261108/**
            /research/FP_NATIVE_B_CAUSAL_ABLATION_20261108/**
            /research/FP_SC_RECOVERY_R0_R5_20261107/**
            /research/FP_SC_S1_RUN_20261106/RESULTS/*/ROWS.json.gz
      - name: Verify source SHA and execute preflight (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$BASE_CODE/RELEASE_INPUT_LOCK.json"
          test -s "$PILOT_CODE/b_calibration_pilot.py"
          test -s "$PILOT_CODE/aggregate.py"
          test -s research/FP_SC_RECOVERY_R0_R5_20261107/r45.py
          sha256sum "$PILOT_CODE"/*.py "$BASE_CODE"/*.py > "$RUN_DIR/EXECUTED_SOURCE_SHA256.txt"
          git rev-parse HEAD > "$RUN_DIR/COMMIT_SHA.txt"
      - name: Download and SHA-check 6 online/evaluator NPZ and 2 original FFD banks
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 -u "$BASE_CODE/acquire_inputs.py" --out /tmp/fp-release-assets 2>&1 | tee "$RUN_DIR/INPUT_DOWNLOAD.log"
      - name: Pinned Python array math
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies and static, synthetic, heldout tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          python -m compileall -q "$PILOT_CODE" "$BASE_CODE"
          python "$PILOT_CODE/b_calibration_pilot.py" --selftest | tee "$RUN_DIR/SELFTEST.log"
          python "$BASE_CODE/test_repairs.py" | tee "$RUN_DIR/BASE_TESTS.log"
      - name: Stage 11 original SHA-verified inputs and banks
        shell: bash
        run: |
          set -euo pipefail
          python -u "$BASE_CODE/stage_inputs.py" --repo "$GITHUB_WORKSPACE" --assets /tmp/fp-release-assets --out "$RUN_DIR/STAGE"
      - name: Reproduce original native and B-only W0 baselines before fit
        shell: bash
        run: |
          set -euo pipefail
          python -u "$BASE_CODE/baseline_gate.py" --repo "$GITHUB_WORKSPACE" --out "$RUN_DIR/BASELINE" --routes R2 R4 R5 2>&1 | tee "$RUN_DIR/BASELINE.log"
      - name: Leave-R2-out B-only calibration and evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -u "$PILOT_CODE/b_calibration_pilot.py" --repo "$GITHUB_WORKSPACE" --heldout R2 --out "$RUN_DIR/R2" 2>&1 | tee "$RUN_DIR/R2.log"
      - name: Leave-R4-out B-only calibration and evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -u "$PILOT_CODE/b_calibration_pilot.py" --repo "$GITHUB_WORKSPACE" --heldout R4 --out "$RUN_DIR/R4" 2>&1 | tee "$RUN_DIR/R4.log"
      - name: Leave-R5-out B-only calibration and evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -u "$PILOT_CODE/b_calibration_pilot.py" --repo "$GITHUB_WORKSPACE" --heldout R5 --out "$RUN_DIR/R5" 2>&1 | tee "$RUN_DIR/R5.log"
      - name: Aggregate paired results, NEES and route-specific calibration stats
        shell: bash
        run: |
          set -euo pipefail
          python "$PILOT_CODE/aggregate.py" --input "$RUN_DIR" --out "$RUN_DIR/AGGREGATE" 2>&1 | tee "$RUN_DIR/AGGREGATE.log"
          cat "$RUN_DIR/AGGREGATE/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          echo "$(sha256sum "$RUN_DIR/AGGREGATE/RESULTS.json")" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve fitted parameters, traces, results and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp-b-route-heldout-calibration-${{ github.run_id }}
          path: |
            /tmp/fp-b-calibration/**
            research/FP_B_CALIBRATION_PILOT_20261108/**
            /tmp/fp-release-assets/*RECEIPT.json
          retention-days: 30
          if-no-files-found: warn