name: POWERJOINT exact mechanism source only
on:
  push:
    branches: ['research/powerjoint-p0p2p3-execution-20261016']
    paths: ['.github/workflows/powerjoint-source-only.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      SOURCE_SHA: 4c0682a55298ae33f3495a4c7249f3a8c34633ad
    steps:
      - name: Exact pinned source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$SOURCE_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N4C_20261015/*.py\n/research/R5_N4B_20261015/*.py\n/research/POLE_RECURSIVE_20261016/*.py\n/research/EXP234_CAUSAL_20261016/*.py\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import hashlib,json,pathlib
          rows=[]
          for p in pathlib.Path('research').rglob('*.py'):
              b=p.read_bytes();rows.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          pathlib.Path('SOURCE_ONLY_RECEIPT.json').write_text(json.dumps({'source_commit':'4c0682a55298ae33f3495a4c7249f3a8c34633ad','files':rows,'scientific_pass':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerjoint-code-only-${{ github.run_id }}
          path: |
            research/**/*.py
            SOURCE_ONLY_RECEIPT.json
          retention-days: 30
