name: POWERJOINT sensitivity strata
on:
  push:
    branches: ['research/powerjoint-sensitivity-strata-20261021']
    paths: ['.github/workflows/powerjoint-sens-strata.yml', 'research/PJ_SENS_STRATA_20261021/*.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/pj_s1_stage
  PJ_ART: /tmp/pj_art
  PJ_BANK_DOWNLOAD: /tmp/pj_bankdownload
jobs:
  step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
            /research/PJ_SENS_STRATA_20261021/**
            /research/PJ_D1_TEMPORAL_20261021/*.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 tabulate==0.9.0
      - name: Stage original RF (SHA verified) and prepared labels
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_BANK_DOWNLOAD" "$PJ_ART"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: Sensitivity analysis
        env:
          PJ_RESULTS: ${{ github.workspace }}/research/PJ_SENS_STRATA_20261021/results
        run: |
          set -o pipefail
          mkdir -p "$PJ_RESULTS"
          python -u research/PJ_SENS_STRATA_20261021/sens.py 2>&1 | tee "$PJ_RESULTS/SENS_LOG.txt"
          cat "$PJ_RESULTS/SENS_RESULTS.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit results back to research branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_SENS_STRATA_20261021/results || true
          git commit -m "Sensitivity strata results from run ${{ github.run_id }} (automated)" || echo 'nothing to commit'
          git push origin HEAD:${{ github.ref_name }}
