name: RA5 range first-edge fractional vs calibrated discrete vs raw-complex likelihood (no RT)
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-range-three-likelihoods-no-rt.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/range_likelihood_three_way.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  SRC: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: R5_aA_m0
            poses: '100,900'
          - case: R2_aA_m45
            poses: '200,500'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 3
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3
      - name: Retrieve immutable source H and frequency from original Git commit with verified digests
        shell: bash
        run: |
          set -euo pipefail
          CASE="${{ matrix.case }}"
          ROOT="$RUNNER_TEMP/source";mkdir -p "$ROOT"
          git init --bare "$RUNNER_TEMP/source-repo.git"
          git -C "$RUNNER_TEMP/source-repo.git" remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -C "$RUNNER_TEMP/source-repo.git" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$SRC"
          BLK="results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C"
          git -C "$RUNNER_TEMP/source-repo.git" cat-file -p "$SRC:$BLK/FULL_RF/H_$CASE\_m0.npy" > "$ROOT/temporary" || true
          if [ "$CASE" = "R2_aA_m45" ]; then
            git -C "$RUNNER_TEMP/source-repo.git" cat-file -p "$SRC:$BLK/FULL_RF/H_R2_aA_m45.npy" > "$ROOT/H_$CASE.npy"
          else
            git -C "$RUNNER_TEMP/source-repo.git" cat-file -p "$SRC:$BLK/FULL_RF/H_R5_aA_m0.npy" > "$ROOT/H_$CASE.npy"
          fi
          git -C "$RUNNER_TEMP/source-repo.git" cat-file -p "$SRC:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
          python - "$ROOT" "$CASE" <<'PY'
          import hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1]);case=sys.argv[2]
          data=json.loads(pathlib.Path("research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json").read_text())
          a={x["path"]:x for x in data["assets"] if x.get("sha256")}
          for rel,name in (("FULL_RF/H_"+case+".npy","H_"+case+".npy"),("freqs_hz.npy","freqs_hz.npy")):
              path=next(p for p in a if p.endswith(rel))
              digest=hashlib.sha256((base/name).read_bytes()).hexdigest()
              assert digest==a[path]["sha256"],(path,digest,a[path]["sha256"])
          lock=dict(H_sha256=hashlib.sha256((base/("H_"+case+".npy")).read_bytes()).hexdigest(),
               freq_sha256=hashlib.sha256((base/"freqs_hz.npy").read_bytes()).hexdigest(),
               source_commit="9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13")
          (base/"SOURCE_LOCK.json").write_text(json.dumps(lock,indent=2))
          print("RA5_SOURCE_VERIFIED",case,lock)
          PY
      - name: Three-way matched-trial range measurement experiment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python -u "$EXP/range_likelihood_three_way.py" \
            --case "${{ matrix.case }}" --poses "${{ matrix.poses }}" \
            --rf-root "$RUNNER_TEMP/source" --sha-lock "$RUNNER_TEMP/source/SOURCE_LOCK.json" \
            --train 128 --test 192 --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-range-three-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
