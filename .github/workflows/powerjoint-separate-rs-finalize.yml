name: POWERJOINT separate Range-s final scoring and evidence
on:
  push:
    branches: ['research/powerjoint-separate-marginals-correlation-20261020']
    paths: ['.github/workflows/powerjoint-separate-rs-finalize.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  PJ_OUT: /tmp/pj_final
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Wait for the seven actual recursive case jobs, not failed original aggregator
        run: |
          set -euo pipefail
          for k in $(seq 1 36); do
            gh api 'repos/myoungsunk/sionna-resimulation/actions/runs/39375640360/jobs?per_page=100' > /tmp/jobs.json
            state=$(python -c 'import json; j=[x for x in json.load(open("/tmp/jobs.json"))["jobs"] if x["name"].startswith("replay (")]; print("FAILED" if any(x["status"]=="completed" and x["conclusion"]!="success" for x in j) else "READY" if len(j)==7 and all(x["conclusion"]=="success" for x in j) else "WAIT")')
            echo "Recursive state: $state"
            if [ "$state" = 'FAILED' ]; then exit 2; fi
            if [ "$state" = 'READY' ]; then break; fi
            sleep 20
          done
          test "$state" = 'READY'
      - name: Recompute scores from all 28 saved traces
        run: |
          set -euo pipefail
          mkdir -p "$PJ_OUT"
          gh run download 39375640360 --repo myoungsunk/sionna-resimulation --pattern 'separate-rs-*' --dir "$PJ_OUT"
          cp -r research/PJ_SEPARATE_RS_20261020 "$PJ_OUT/FINAL_SOURCE"
          python -u research/PJ_SEPARATE_RS_20261020/summarize_filtered.py
          cat "$PJ_OUT/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve final original results, source, QA and SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWERJOINT_SEPARATE_RANGE_POLARIZATION_VALIDATION_20261020
          path: /tmp/pj_final/**
          retention-days: 30
          if-no-files-found: error
