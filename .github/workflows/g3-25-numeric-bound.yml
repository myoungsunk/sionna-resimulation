name: G3 twenty-five missing raw rays numeric bounds (source-locked)
on:
  push:
    branches: ['audit/ra4-factorial-g3-precision-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/**'
      - '.github/workflows/g3-25-numeric-bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            src/qclean_uwb
            research/RA0_RA1_RA2_AUDIT_20261029/g3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Original source SHA, 23 receipt identities and numeric hypotheses
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g3q"
          python -u research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_numeric_bounds.py "$RUNNER_TEMP/g3q" | tee "$RUNNER_TEMP/g3q/QA_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-25-numeric-bounds-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g3q/G3_NUMERIC_BOUNDS.json
            ${{ runner.temp }}/g3q/G3_23_STATION_HYPOTHESIS_BOUNDS.csv
            ${{ runner.temp }}/g3q/QA_LOG.txt
          retention-days: 30
          if-no-files-found: warn
