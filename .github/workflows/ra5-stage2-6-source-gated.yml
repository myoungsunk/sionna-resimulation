name: RA5 Stage 2-6 forensic diagnostics with sequential stop gates
on:
  push:
    branches: ['audit/ra5-staged-execution-20261029']
    paths:
      - '.github/workflows/ra5-stage2-6-source-gated.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check A4 all28, initial/sensor factor and RA5 P0/P1 sources
        shell: bash
        run: |
          set -euo pipefail
          REPO="myoungsunk/sionna-resimulation"
          for ID in 40880297969 40881073964 40882051848; do
            accepted=0
            for ATTEMPT in $(seq 1 48); do
              RESULT=$(gh api "repos/$REPO/actions/runs/$ID" --jq '.conclusion // "PENDING"')
              if [ "$RESULT" = "success" ]; then accepted=1; break; fi
              if [ "$RESULT" != "PENDING" ]; then echo "BLOCKED_UPSTREAM_RUN $ID $RESULT"; exit 3; fi
              sleep 10
            done
            if [ "$accepted" != 1 ]; then echo "BLOCKED_TIMEOUT_UPSTREAM_RUN $ID"; exit 4; fi
            echo "ACCEPTED_SOURCE_RUN $ID"
          done
          mkdir -p "$RUNNER_TEMP/gates"
          gh run download 40880297969 --repo "$REPO" --pattern 'a4-full28-*' --dir "$RUNNER_TEMP/gates/a4"
          gh run download 40882051848 --repo "$REPO" --pattern 'a4-factor-*' --dir "$RUNNER_TEMP/gates/factor"
          gh run download 40881073964 --repo "$REPO" --pattern 'ra5-p1-math-*' --dir "$RUNNER_TEMP/gates/math"
          python - "$RUNNER_TEMP/gates" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          a=list((root/'a4').rglob('A4_CASE_QA.json'))
          f=list((root/'factor').rglob('A4_FACTORIAL_QA.json'))
          m=list((root/'math').rglob('RA5_P1_MATH_QA.json'))
          assert len(a)==7 and len(f)==3 and len(m)==1,(len(a),len(f),len(m))
          assert all(json.loads(x.read_text())['status']=='PASS_CASE_TECHNICAL_A4' for x in a)
          assert all(json.loads(x.read_text())['status']=='PASS_A4_FACTORIAL_TECHNICAL' for x in f)
          assert json.loads(m[0].read_text())['status']=='PASS_RA5_1_METHOD_ONLY'
          assert sum(json.loads(x.read_text())['n_identity'] for x in a)==392
          print('RA5_GATES_ACCEPTED',len(a),len(f),len(m))
          PY
  stage2_residuals:
    needs: source_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2
      - name: Fetch verified RAW-TAP source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 40881073964 --repo myoungsunk/sionna-resimulation --pattern 'ra5-p0-*' --dir "$RUNNER_TEMP/source"
          echo "count=$(find "$RUNNER_TEMP/source" -name 'RA5_P0_RAW_TAPS.csv.gz' | wc -l)"
      - name: Retrospective raw full-LoS cross covariance and field-time identifiability
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/p2"
          python -u "$EXP/ra5_p2_actual_residuals.py" --input-dir "$RUNNER_TEMP/source" --out "$RUNNER_TEMP/p2" 2>&1 | tee "$RUNNER_TEMP/p2/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-p2-${{ github.run_id }}
          path: ${{ runner.temp }}/p2/
          retention-days: 30
          if-no-files-found: warn
  stage3_5_method_diagnostics:
    needs: stage2_residuals
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/RA0_RA1_RA2_AUDIT_20261029/ra5
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Retrieve original source locked geometry and packet prior
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/p35input"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Actual FFD Jacobian x synthetic Sigma, conditional nuisance observability
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/p35input"
          mkdir -p "$RUNNER_TEMP/p35"
          python -u "$EXP/ra5_p35_geometry_observability.py" "$RUNNER_TEMP/p35" 2>&1 | tee "$RUNNER_TEMP/p35/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-p35-${{ github.run_id }}
          path: ${{ runner.temp }}/p35/
          retention-days: 30
          if-no-files-found: warn
  stage4_6_stop_verdict:
    needs: stage3_5_method_diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Load stage results, enforce no fabricated measurements or new scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gatep2" "$RUNNER_TEMP/gatep35" "$RUNNER_TEMP/gateout"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern "ra5-p2-*" --dir "$RUNNER_TEMP/gatep2"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern "ra5-p35-*" --dir "$RUNNER_TEMP/gatep35"
          P2=$(find "$RUNNER_TEMP/gatep2" -name RA5_P2_QA.json -print -quit)
          P35=$(find "$RUNNER_TEMP/gatep35" -name RA5_P35_QA.json -print -quit)
          test -n "$P2" && test -n "$P35"
          python -u "$EXP/ra5_release_gate.py" --p2 "$(dirname "$P2")" --p35 "$(dirname "$P35")" --out "$RUNNER_TEMP/gateout" | tee "$RUNNER_TEMP/gateout/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-stage2-6-final-${{ github.run_id }}
          path: ${{ runner.temp }}/gateout/
          retention-days: 30
          if-no-files-found: warn
