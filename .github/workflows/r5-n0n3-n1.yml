name: N1 L0-L2 Physical Hard Soft Signed Bias RF Recursive
on:
  push:
    branches: ['research/r5-n0n3-audited-20261015']
    paths:
      - '.github/workflows/r5-n0n3-n1.yml'
      - 'research/R5_N0_N3_20261015/n1_bias_policies.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  N1_full_RF_nonzero_gyro_bias:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Exact sparse checkout original FFD and G0-G5 physical source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N0_N3_20261015/n1_bias_policies.py\n/research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py\n/research/PHYSICS_RS_STAGED_20261015/code/*.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-n0n3-n1.yml\n' > .git/info/sparse-checkout
          BASE='results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C'
          printf '/%s/FULL_RF/*.npy\n/%s/H_LoS_*.npy\n/%s/freqs_hz.npy\n' "$BASE" "$BASE" "$BASE" >> .git/info/sparse-checkout
          for CASE in R2_aA_m0 R2_aA_m45 R2_aB_m0 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            printf '/%s/%s/SAMPLES.json\n' "$BASE" "$CASE" >> .git/info/sparse-checkout
          done
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Before any numerical tasks audit all source and raw RF input SHA
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n1_bias_policies.py --phase pre --out "$RUNNER_TEMP/n1_pre" | tee "$RUNNER_TEMP/n1_pre.log"
      - name: Verify N0 and retrieve immutable RF/R2 archives
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11953640791/zip > "$RUNNER_TEMP/n0_frozen.zip"
          echo 'aade786b83357086c9e645fa9b87467a869289aa93040e3b48410f44af2d08fb  '"$RUNNER_TEMP/n0_frozen.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/original_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/original_RF.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/original_R2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/original_R2.zip" | sha256sum -c
      - name: Install pinned original Sensor-v2 and physics numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Run arithmetic canaries / original R0 Joseph predictor and gate tests
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n1_bias_policies.py --phase test | tee "$RUNNER_TEMP/n1_test.log"
      - name: L0 L1 L2 same controls paired physical-policy recursive runs
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n1_bias_policies.py --phase run --out "$RUNNER_TEMP/n1_result" --audit "$RUNNER_TEMP/n1_pre/N1_PRE_AUDIT.json" --n0 "$RUNNER_TEMP/n0_frozen.zip" --raw "$RUNNER_TEMP/original_RF.zip" --r2 "$RUNNER_TEMP/original_R2.zip" | tee "$RUNNER_TEMP/n1_run.log"
      - name: Upload every numerical result and failed-stage audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-gyro-bias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n1_pre/**
            ${{ runner.temp }}/n1_result/**
            ${{ runner.temp }}/n1_pre.log
            ${{ runner.temp }}/n1_test.log
            ${{ runner.temp }}/n1_run.log
          if-no-files-found: warn
          retention-days: 30
