name: Powerjoint audit T1 exact old replay
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-rerun-20261020]
    paths: [.github/workflows/powerjoint-audit-rerun-t1.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/source
          sparse-checkout: |
            research/POWERJOINT_AUDIT_RERUN_20261020
            research/CHAIN_HYPOTHESIS_20261019
            research/CHAIN_VALIDATED_RESULTS_20261019
            research/FFD_P0P3_20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0
      - name: Restore immutable release inputs
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
      - name: Exact engine unit tests
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/unit_tests.py --out unit
      - name: Frozen controls and train-only model parameters
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/prepare_old.py
      - name: RF replay with independent scorer and historical gate parity
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/replay.py --bundle old_bundle/BUNDLE.json --source-root source --out t1_old
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerjoint-audit-t1-${{ github.run_id }}
          path: |
            work/unit
            work/t1_old
            work/RESTORE_RECEIPT.json
            work/old_bundle/BUNDLE.json
          retention-days: 30
