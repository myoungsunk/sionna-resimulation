name: DLP P2 independent 4state pre-run source/math audit
on:
  push:
    branches: ['audit/dlp-p2-independent-preflight-20261101']
    paths:
      - '.github/workflows/dlp-p2-preflight.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/audits/P2_20261101/p2_independent_preflight.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  DLP_P2_AUDIT_OUT: /tmp/dlp_p2_audit
  DLP_RF_ZIP: /tmp/dlp_p2_rf_original.zip
  DLP_BANK_DIR: /tmp/dlp_p2_banks
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Sparse clone exact original C0, FFD and EKF4 code
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          export GIT_LFS_SKIP_SMUDGE=1
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat >.git/info/sparse-checkout <<'LIST'
          /research/DUAL_LP_PAPER_GAP_20261030/contracts/**
          /research/DUAL_LP_PAPER_GAP_20261030/audits/P2_20261101/p2_independent_preflight.py
          /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          LIST
          git checkout --detach FETCH_HEAD
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json').read_text())
          pat=['/research/DUAL_LP_PAPER_GAP_20261030/contracts/**',
               '/research/DUAL_LP_PAPER_GAP_20261030/audits/P2_20261101/p2_independent_preflight.py',
               '/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json',
               '/research/EKF4_RANGE_S_STAGED_20261014/**',
               '/research/FFD_P0P3_20261016/**',
               '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**',
               '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**',
               '/research/DUAL_LP_PAPER_GAP_20261030/runs/P1_SOURCE_HARMONIZATION_41300302082/P1_SCIENCE_QA.json']
          pat+=['/'+x['path'] for x in a['base_assets']]
          pat+=['/'+x['path'] for x in a['locked_source_code']]
          pathlib.Path('/tmp/p2_sparse').write_text('\n'.join(sorted(set(pat)))+'\n')
          print('P2 original and source paths',len(set(pat)))
          PY
          git sparse-checkout set --no-cone --stdin </tmp/p2_sparse
          test -s research/EKF4_RANGE_S_STAGED_20261014/r2_bias_replay.py
          test -s results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m0.npy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned preflight math
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Stage original bank binaries and literal archived source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DLP_BANK_DIR" "$DLP_P2_AUDIT_OUT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation \
            --name ffd-verified-original-38875080492 --dir "$DLP_BANK_DIR"
          curl -fLsS --retry 3 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip" \
            -o "$DLP_RF_ZIP"
          test -s "$DLP_RF_ZIP"
          printf '%s  %s\n' '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63' "$DLP_RF_ZIP" | sha256sum --check
          echo "Original archive actual binary bytes checked; no artifact metadata substitution"
      - name: Execute separated mathematical preflight, no P2 recursive science
        shell: bash
        run: |
          set -uo pipefail
          python -u research/DUAL_LP_PAPER_GAP_20261030/audits/P2_20261101/p2_independent_preflight.py \
             2>&1 | tee "$DLP_P2_AUDIT_OUT/P2_PRE_RUN_LOG.txt"
          exit "${PIPESTATUS[0]}"
      - name: Preserve blocked or successful full preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlp-p2-independent-preflight-${{ github.run_id }}
          path: /tmp/dlp_p2_audit/
          retention-days: 30
          if-no-files-found: warn
      - name: Append-only pre-run result on audit branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DLP_P2_AUDIT_OUT/P2_PRE_RUN_AUDIT.json" || { echo "No complete receipt"; exit 0; }
          D="research/DUAL_LP_PAPER_GAP_20261030/audits/P2_20261101/preflight_runs/${GITHUB_RUN_ID}"
          mkdir -p "$D"
          cp -a "$DLP_P2_AUDIT_OUT/." "$D/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$D"
          git commit -m "audit(p2): preserve pre-run audit ${GITHUB_RUN_ID} SHA evidence"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
