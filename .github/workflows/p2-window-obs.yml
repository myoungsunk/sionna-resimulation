name: Window observability (offline on error budget v3 arrays)
on:
  push:
    branches: ['research/window-observability-20261026']
    paths: ['.github/workflows/p2-window-obs.yml', 'research/PJ_WINDOW_OBS_20261026/RUN_WOBS.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '2'
jobs:
  wobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Download v3 arrays (run 39950207483 for six cases, retry run 39954439738 for R2_aA_m0)
        run: |
          set -euo pipefail
          for c in R2_aA_m45 R2_aB_m0 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            gh run download 39950207483 --repo myoungsunk/sionna-resimulation --name "p2eb3-$c-39950207483" --dir "/tmp/eb3/$c"
          done
          gh run download 39954439738 --repo myoungsunk/sionna-resimulation --name "p2eb3-R2_aA_m0-39954439738" --dir /tmp/eb3/R2_aA_m0
          find /tmp/eb3 -name '*_EB3_ARRAYS.npz' | sort
      - name: Window observability
        run: |
          set -uo pipefail
          D=research/PJ_WINDOW_OBS_20261026/results;mkdir -p "$D"
          H=research/PJ_DS_GATED_20261021/results_hpath
          python -u research/PJ_WINDOW_OBS_20261026/p_wobs.py --input /tmp/eb3 --packets "$H/HP_PACKETS.csv.gz" --series "$H/HP_SERIES.csv.gz" --out "$D" > "$D/WOBS_LOG.txt" 2>&1; rc=$?
          grep -v WOBS_LEN "$D/WOBS_LOG.txt" | tail -n 40
          if [ $rc -ne 0 ]; then tail -n 12 "$D/WOBS_LOG.txt" | while IFS= read -r l; do echo "::error::$l"; done; exit $rc; fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_WINDOW_OBS_20261026/results
          git commit -m "Window observability results from run $GITHUB_RUN_ID (automated, no model change)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
