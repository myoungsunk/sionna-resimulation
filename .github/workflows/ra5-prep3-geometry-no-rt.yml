name: RA5 governed PRE-P3 76-config image-method geometry preflight (zero RT)
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-prep3-geometry-no-rt.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/pre_p3_geometry_no_rt.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  OPENBLAS_NUM_THREADS: '1'
jobs:
  analytic_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          ref: c4d84e02b878af9835bef09d515d45f4010caa74
          path: upstream_mbvar
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
      - name: Download immutable original Python runtime (not RF solver)
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ffd"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test "$(git hash-object upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code/world.py)" = 2129aefa65e8dba7abd39dd4a66a89c066eac593
      - name: Check shared plate, revisit geometry, first 8 direct and full 76 geometry ledger
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ffd"
          mkdir -p "$RUNNER_TEMP/out"
          python -u "$EXP/pre_p3_geometry_no_rt.py" \
            --mbvar-code "upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code" \
            --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-prep3-geometry-zero-rt-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: warn
