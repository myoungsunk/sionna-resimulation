name: EKF4 D3B audit-first pure DR-only comparison
on:
  push:
    branches: ['research/ekf4-d3-four-failure-rootcause-20261014']
    paths:
      - '.github/workflows/ekf4-d3b-dr-only.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/d3b_pre_audit.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/d3b_dr_only.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ekf4-d3b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audited-dr-only-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read-only sparse checkout at exact event commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/.github/workflows/ekf4-d3b-dr-only.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source audit before any numerical diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3b_pre_audit.py --phase source --out "$RUNNER_TEMP/d3b_source" | tee "$RUNNER_TEMP/d3b_source.log"
      - name: Obtain immutable P2 run artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" /repos/myoungsunk/sionna-resimulation/actions/artifacts/11875912063/zip > "$RUNNER_TEMP/d3b_original.zip"
          test -s "$RUNNER_TEMP/d3b_original.zip"
      - name: Mandatory input audit before any numerical diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3b_pre_audit.py --phase input --source-audit "$RUNNER_TEMP/d3b_source/SOURCE_AUDIT.json" --archive "$RUNNER_TEMP/d3b_original.zip" --out "$RUNNER_TEMP/d3b_input" | tee "$RUNNER_TEMP/d3b_input.log"
      - name: Install pinned dependencies after both audits
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: Compare independent DR-only MAP prior and RF in four frozen cases ONLY
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/d3b_dr_only.py --source-audit "$RUNNER_TEMP/d3b_source/SOURCE_AUDIT.json" --input-audit "$RUNNER_TEMP/d3b_input/INPUT_AUDIT.json" --artifact "$RUNNER_TEMP/d3b_original.zip" --out "$RUNNER_TEMP/d3b_results" | tee "$RUNNER_TEMP/d3b_numeric.log"
      - name: Preserve audit, inputs and results on all outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-d3b-pure-dr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d3b_source/**
            ${{ runner.temp }}/d3b_input/**
            ${{ runner.temp }}/d3b_results/**
            ${{ runner.temp }}/d3b_original.zip
            ${{ runner.temp }}/d3b_source.log
            ${{ runner.temp }}/d3b_input.log
            ${{ runner.temp }}/d3b_numeric.log
            research/EKF4_RANGE_S_STAGED_20261014/d3b_dr_only.py
            research/EKF4_RANGE_S_STAGED_20261014/d3b_pre_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/D3B_DR_ONLY_CONTRAST_PLAN_KO.md
            .github/workflows/ekf4-d3b-dr-only.yml
          if-no-files-found: warn
          retention-days: 30
