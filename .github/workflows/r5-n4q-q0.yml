name: N4Q Q0 frozen source input and numerical audit only
on:
  push:
    branches: ['research/r5-n4q-geometry-integrity-20261015']
    paths:
      - '.github/workflows/r5-n4q-q0.yml'
      - 'research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/q0.py'
      - 'research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/test_q0.py'
      - 'research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/q0_lock.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n4q-q0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  q0_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout frozen sources and original RF inputs
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=50 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/**
          /research/R5_N4B_20261015/n4b_rf_errors.py
          /research/R5_N4C_20261015/n4c_joint_sr4.py
          /research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py
          /research/PHYSICS_RS_STAGED_20261015/code/**
          /research/EKF4_RANGE_S_STAGED_20261014/**
          /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**
          /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy
          /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
          /.github/workflows/r5-n4q-q0.yml
          EOF
          BASE='results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C'
          printf '/%s/FULL_RF/*.npy\n/%s/H_LoS_*.npy\n/%s/freqs_hz.npy\n' "$BASE" "$BASE" "$BASE" >> .git/info/sparse-checkout
          for CASE in R2_aA_m0 R2_aA_m45 R2_aB_m0 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            printf '/%s/%s/SAMPLES.json\n' "$BASE" "$CASE" >> .git/info/sparse-checkout
          done
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 --filter=blob:none origin 63ab1835dbec33bfe8e0726d7bf271960ca4317f
          git show 63ab1835dbec33bfe8e0726d7bf271960ca4317f:research/R5_N4B_POL_V1_20261015/n4b_pol_geometry.py > "$RUNNER_TEMP/q0_pol_reference.py"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Q0 source and original input audit before numerical work
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/q0.py --phase pre --out "$RUNNER_TEMP/q0_pre" 2>&1 | tee "$RUNNER_TEMP/q0_pre.log"
      - name: Download seven SHA locked historical archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/q0_inputs"
          python - <<'PY'
          import json, os, pathlib, subprocess
          lock=json.loads(pathlib.Path('research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/q0_lock.json').read_text())
          for item in lock['archives'].values():
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'q0_inputs'/(str(item['id'])+'.zip')
              with path.open('wb') as f:
                  subprocess.run(['gh','api',f"/repos/myoungsunk/sionna-resimulation/actions/artifacts/{item['id']}/zip"],stdout=f,check=True)
          PY
      - name: Install pinned original numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
      - name: Test Q0 rejection and scoring checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s research/R5_N4Q_GEOMETRY_INTEGRITY_20261015 -p test_q0.py -v 2>&1 | tee "$RUNNER_TEMP/q0_tests.log"
      - name: Q0 archived input observer Jacobian and metric reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4Q_GEOMETRY_INTEGRITY_20261015/q0.py --phase verify --out "$RUNNER_TEMP/q0_results" --audit "$RUNNER_TEMP/q0_pre/Q0_PRE_AUDIT.json" --inputs "$RUNNER_TEMP/q0_inputs" --pol-source "$RUNNER_TEMP/q0_pol_reference.py" 2>&1 | tee "$RUNNER_TEMP/q0_verify.log"
      - name: Preserve Q0 evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4q-q0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/q0_pre/**
            ${{ runner.temp }}/q0_results/**
            ${{ runner.temp }}/q0_*.log
            ${{ runner.temp }}/q0_pol_reference.py
          if-no-files-found: error
          retention-days: 90
