name: EKF4 P3 frozen RF audit and input validation
on:
  push:
    branches: ['research/ekf4-r3-to-p6-20261014']
    paths:
      - '.github/workflows/ekf4-p3-frozen-rf.yml'
      - 'research/EKF4_P3_FROZEN_RF_20261014/p3_frozen_inputs.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekf4-p3-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-rf-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Sparse checkout audit program and frozen manifest only
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_P3_FROZEN_RF_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/.github/workflows/ekf4-p3-frozen-rf.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source+manifest audit before any verification
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_P3_FROZEN_RF_20261014/p3_frozen_inputs.py --stage audit --out "$RUNNER_TEMP/p3_audit" | tee "$RUNNER_TEMP/p3_audit.log"
      - name: Load exactly the frozen manifest-listed RF assets
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,pathlib; p=pathlib.Path("research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json"); items=json.loads(p.read_text())["assets"]; f=pathlib.Path(".git/info/sparse-checkout"); f.open("a").writelines("/"+a["path"]+"\n" for a in items)'
          git checkout --detach HEAD
      - name: Install numerical reader only after audit
        run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - name: P3 bit/shape validation of all 39 frozen assets
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_P3_FROZEN_RF_20261014/p3_frozen_inputs.py --stage verify --audit "$RUNNER_TEMP/p3_audit" --out "$RUNNER_TEMP/p3_verify" | tee "$RUNNER_TEMP/p3_verify.log"
      - name: Preserve audit/verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p3-frozen-asset-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p3_audit/**
            ${{ runner.temp }}/p3_verify/**
            ${{ runner.temp }}/p3_audit.log
            ${{ runner.temp }}/p3_verify.log
            research/EKF4_P3_FROZEN_RF_20261014/*.py
            research/EKF4_P3_FROZEN_RF_20261014/*.md
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
