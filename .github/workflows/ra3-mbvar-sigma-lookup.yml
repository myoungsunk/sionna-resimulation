name: RA3 MBVAR sigma lookup reproducibility canary
on:
  push:
    branches: ['audit/g3-26ray-ra3-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra3/**'
      - '.github/workflows/ra3-mbvar-sigma-lookup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/RA0_RA1_RA2_AUDIT_20261029/ra3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: echo "REFLECT_ROOT=$RUNNER_TEMP/ra3-inputs" >> "$GITHUB_ENV"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
      - name: Fetch pinned source, both FFD banks and original B0/L2 control traces without RF
        run: |
          set -euo pipefail
          FETCH_RF=0 bash research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model/fetch_inputs.sh
      - name: Compare pre-motion posterior sigma versus predicted-prior sigma
        run: |
          set -euo pipefail
          python -u research/RA0_RA1_RA2_AUDIT_20261029/ra3/ra3_sigma_semantics.py "$RUNNER_TEMP/ra3-out" | tee "$RUNNER_TEMP/ra3.log"
          test -s "$RUNNER_TEMP/ra3-out/RA3_SIGMA_LOOKUP_CANARY.csv"
          test -s "$RUNNER_TEMP/ra3-out/RA3_SIGMA_LOOKUP_QA.json"
      - name: Preserve outputs and failures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra3-sigma-canary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ra3-out/*.csv
            ${{ runner.temp }}/ra3-out/*.json
            ${{ runner.temp }}/ra3.log
          if-no-files-found: warn
          retention-days: 60
