name: CTRL-TRAJ-06 variants diag (LUT vs exact h_s, tap vs additive noise)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-ctrl-traj06-variants.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mount: ['0', '45']
        variant: ['lut_taps', 'exact_taps', 'lut_additive', 'exact_additive']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - run: |
          set -euo pipefail; mkdir -p /tmp/banks
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/banks
      - name: Run
        run: |
          set -euo pipefail
          V='${{ matrix.variant }}'; EX=''; [[ $V == exact_* ]] && EX='--hs-exact'; NM=${V#*_}
          OUT="research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/variants/results_run_${GITHUB_RUN_ID}/m${{ matrix.mount }}_${V}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"; mkdir -p "$(dirname "$OUT")"
          python -u research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/ctrl_traj_06.py --bank-dir /tmp/banks --out "$OUT" \
            --mounts ${{ matrix.mount }} --sigmas 0.03,0.09 --biases B0 --n-eval 12 --n-cal 4 $EX --noise-mode $NM \
            --scens NULL,LOS+C --policies BASE,ORACLE_DROP,R_ONLY | tee /tmp/log.txt
          cp /tmp/log.txt "$OUT/LOG.txt"
      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${OUT:-}" && test -d "$OUT" || exit 0
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"; git commit -m "CTRL-TRAJ-06 variant ${{ matrix.variant }} m${{ matrix.mount }} run $GITHUB_RUN_ID" || echo no-changes
          for i in 1 2 3 4 5 6; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep $((RANDOM % 20 + 5)); done
