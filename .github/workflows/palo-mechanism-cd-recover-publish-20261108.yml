name: PALO verified C-D artifact publication recovery
on:
  push:
    branches: ['analysis/palo-mechanism-cd-execution-20261108']
    paths:
      - '.github/workflows/palo-mechanism-cd-recover-publish-20261108.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish-verified-results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Restore previously computed and verified 500 MB artifact
        uses: actions/download-artifact@v4
        with:
          name: palo-mechanism-cd-42453921978
          run-id: 42453921978
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: restored
      - name: Verify source commit and load pinned recovery script
        run: |
          python - <<'PY'
          import os,urllib.request,hashlib
          from pathlib import Path
          url='https://raw.githubusercontent.com/myoungsunk/sionna-resimulation/'+os.environ['GITHUB_SHA']+'/research/PALO_MECHANISM_CD_EXEC_20261108/publish_recovery_42453921978.py'
          with urllib.request.urlopen(url,timeout=120) as r:
              body=r.read()
          git_blob=hashlib.sha1(f'blob {len(body)}\0'.encode()+body).hexdigest()
          assert git_blob=='dbb5a62e16fba1f66ef49ab390a5b87630309b7b', git_blob
          Path('publish_recovery.py').write_bytes(body)
          print('RECOVERY_CODE_BLOB_VERIFIED',git_blob,flush=True)
          PY
      - name: Verify all retained file hashes and publish in small Git trees
        run: |
          python publish_recovery.py
      - name: Preserve recovery publishing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palo-cd-recovery-42453921978
          if-no-files-found: warn
          retention-days: 90
          path: |
            PUBLISH_RECOVERY_RECEIPT.json
            publish_recovery.py
