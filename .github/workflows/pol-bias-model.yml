name: Polarization-bias modelling (variance / state / sliding window), 7 routes x B0-L0-L1-L2
# Runs ONLY when pol_bias_model/RUN_REQUEST.json is committed/changed (or by manual dispatch).
on:
  push:
    branches: ['research/ds-x1-x2-results-20261026']
    paths: ['research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model/RUN_REQUEST.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  PIP_PKGS: numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
      - name: Fetch and hash-lock inputs (code subset, FFD banks, E1 control traces; no channels)
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/pb"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
          du -sh "$REFLECT_ROOT"/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pb-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/pb/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  run:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [R2_aA_m0, R2_aB_m0, R2_aA_m45, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check $PIP_PKGS
      - name: Stage inputs
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name pb-inputs-${{ github.run_id }} --dir "$RUNNER_TEMP/pb"
      - name: Run B0, L0, L1, L2 for this route
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/pb"; mkdir -p "$REFLECT_ROOT/out"
          for b in B0 L0 L1 L2; do
            python -u "$BASE_DIR/pol_bias_model/exp_pb.py" --case ${{ matrix.case }} --bias $b 2>&1 | tee "$REFLECT_ROOT/out/PB_LOG_${{ matrix.case }}_$b.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pb-shard-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/pb/out/PB_*
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check $PIP_PKGS
      - name: Collect shards and decide
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/pb"; mkdir -p "$REFLECT_ROOT/out" "$RUNNER_TEMP/shards"
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --pattern 'pb-shard-*' --dir "$RUNNER_TEMP/shards"
          find "$RUNNER_TEMP/shards" -type f -name 'PB_*' -exec cp {} "$REFLECT_ROOT/out/" \;
          ls "$REFLECT_ROOT/out" | wc -l
          python -u "$BASE_DIR/pol_bias_model/aggregate_pb.py" 2>&1 | tee "$REFLECT_ROOT/out/PB_AGG_LOG.txt"
      - name: Publish results to the branch
        if: always()
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pb/out"; [ -d "$SRC" ] || exit 0
          DEST="$BASE_DIR/pol_bias_model/results/run_${{ github.run_id }}"
          W="$RUNNER_TEMP/pub"; rm -rf "$W"
          git clone -q --depth 1 --filter=blob:none --sparse -b "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$W"
          cd "$W"; git sparse-checkout set --no-cone "/$BASE_DIR/pol_bias_model/results/"
          mkdir -p "$DEST"; cp "$SRC"/PB_* "$DEST"/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"; git commit -q -m "pol-bias-model results: run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5 6; do git push -q && exit 0; git pull -q --rebase || true; sleep $((i*4)); done
          exit 1
