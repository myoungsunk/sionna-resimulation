name: POWERJOINT CIR extract for selected packets
on:
  push:
    branches: ['research/powerjoint-ds-gated-plan-20261021']
    paths: ['.github/workflows/powerjoint-ds-gated-cir.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_ART: /tmp/pj_art
jobs:
  cir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_DS_GATED_20261021/cir_extract.py
            /research/PJ_DS_GATED_20261021/results_cir/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Stage original RF and observation table
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_ART"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
      - name: Extract CIR
        env:
          PJ_RESULTS: ${{ github.workspace }}/research/PJ_DS_GATED_20261021/results_cir
        run: python -u research/PJ_DS_GATED_20261021/cir_extract.py
      - name: Commit results back
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f --sparse research/PJ_DS_GATED_20261021/results_cir
          git commit -m "CIR extract for selected packets from run ${{ github.run_id }} (automated)" || echo 'nothing to commit'
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
