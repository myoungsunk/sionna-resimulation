name: RA5 smallest physical RT engine smoke - exactly 2 LoS paths, NOT PRE-P3
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-lowest-cost-rt-engine-smoke.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/rt_engine_micro_canary.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin exact Sionna RT package in disposable GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-input 'sionna-rt==2.0.1'
          python -m pip show sionna-rt drjit mitsuba
      - name: Enable installed LLVM library for DrJit
        shell: bash
        run: |
          set -euo pipefail
          LLVM=$(find /usr/lib /usr/local/lib -name 'libLLVM*.so*' -type f 2>/dev/null | grep -E '18|19' | head -n 1 || true)
          if [ -n "$LLVM" ]; then echo "DRJIT_LIBLLVM_PATH=$LLVM" >> "$GITHUB_ENV"; fi
      - name: Run a budget-capped real Sionna PathSolver two-pose LOS direct check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rtmicro"
          python -u "$EXP/rt_engine_micro_canary.py" "$RUNNER_TEMP/rtmicro" 2>&1 | tee "$RUNNER_TEMP/rtmicro/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-two-pose-rt-engine-only-${{ github.run_id }}
          path: ${{ runner.temp }}/rtmicro/
          retention-days: 30
          if-no-files-found: warn
