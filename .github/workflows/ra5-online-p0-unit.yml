name: RA5 ONLINE P0 gate 0 observer and covariance negative fixtures
on:
  push:
    branches: [audit/ra5-prior-joint-recursive-p0-20261030]
    paths:
      - '.github/workflows/ra5-online-p0-unit.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/online_observer.py'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/p0_mechanical_fixtures.py'
  workflow_dispatch:
concurrency:
  group: ra5-online-p0-unit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            docs/research-governance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
      - name: Verify role contract and downstream exact source model
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EXP/RA5_ONLINE_P0_DRAFT_CONTRACT.md"
          for role in COMMON_CONTRACT ROLE_PROPOSER ROLE_IMPLEMENTER ROLE_AUDITOR; do
            test -s "docs/research-governance/$role.md"
          done
          sha256sum "$EXP/RA5_ONLINE_P0_DRAFT_CONTRACT.md"
          export REFLECT_ROOT="$RUNNER_TEMP/ffd"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Verify source fractional Jacobian and required negative fixtures
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/ffd"
          mkdir -p "$RUNNER_TEMP/p0"
          python -u "$EXP/p0_mechanical_fixtures.py" --out "$RUNNER_TEMP/p0" 2>&1 | tee "$RUNNER_TEMP/p0/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-online-p0-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/p0/
          retention-days: 30
          if-no-files-found: warn
