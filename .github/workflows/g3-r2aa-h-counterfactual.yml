name: G3 original R2-A single-ray H and observation sensitivity
on:
  push:
    branches: ['audit/g3-ray-forensics-ra3-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/r2aa_h_counterfactual.py'
      - '.github/workflows/g3-r2aa-h-counterfactual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      ROOT: results/DRIVE_SIM_20261007
      BLK: results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
      EXP: research/RA0_RA1_RA2_AUDIT_20261029/g3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/qclean_uwb/**
            /research/RA0_RA1_RA2_AUDIT_20261029/g3/r2aa_h_counterfactual.py
            /results/DRIVE_SIM_20261007/S1/routes/rf_poses_R2.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/STORED_PATH_TRACES_R2_aA/x3.7036_y-0.5204_trace.npz
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m45.npy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Load pinned original FFD banks without LFS checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/banks"
          for f in LP_plus45_bank.npz LP_minus45_bank.npz; do
            curl -fLsS --retry 3 -o "$RUNNER_TEMP/banks/$f" "https://media.githubusercontent.com/media/myoungsunk/sionna-resimulation/9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13/$f"
          done
          (cd "$RUNNER_TEMP/banks" && sha256sum *)
      - name: Verify original H parity and compute hypothetical single-ray perturbation
        run: |
          set -o pipefail
          python -u "$EXP/r2aa_h_counterfactual.py" \
            --bank_dir "$RUNNER_TEMP/banks" \
            --trace "$BLK/STORED_PATH_TRACES_R2_aA/x3.7036_y-0.5204_trace.npz" \
            --poses "$ROOT/S1/routes/rf_poses_R2.json" \
            --h_dir "$BLK/FULL_RF" \
            --out "$RUNNER_TEMP/g3" 2>&1 | tee "$RUNNER_TEMP/H_SENS_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-r2aa-h-counterfactual-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g3/
            ${{ runner.temp }}/H_SENS_LOG.txt
          retention-days: 30
          if-no-files-found: warn
