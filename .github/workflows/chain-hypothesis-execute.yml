name: Chain hypotheses full causal validation
on:
  push:
    branches: ['research/powerjoint-chain-hypotheses-20261019']
    paths: ['.github/workflows/chain-hypothesis-execute.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p "$RUNNER_TEMP/synthetic"
          python research/CHAIN_HYPOTHESES_20261019/colored_math.py > "$RUNNER_TEMP/synthetic/LINEAR_EQUIVALENCE.json"
          python research/CHAIN_HYPOTHESES_20261019/synthetic_checks.py > "$RUNNER_TEMP/synthetic/GENERATIVE_CALIBRATION.json"
          cat "$RUNNER_TEMP/synthetic/GENERATIVE_CALIBRATION.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-synthetic-${{ github.run_id }}
          path: ${{ runner.temp }}/synthetic/
          retention-days: 30
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        case: [R2_aA_m0, R2_aA_m45, R2_aB_m0, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_LFS_SKIP_SMUDGE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Restore exact prepared source model, read-only FFD and route packets
        run: |
          gh run download 39244326803 --repo myoungsunk/sionna-resimulation --name chain-model-39244326803 --dir "$RUNNER_TEMP/model"
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 scikit-learn==1.5.2
          mkdir -p "$RUNNER_TEMP/case_results"
          cp "$RUNNER_TEMP/model/DATA_QA.csv" "$RUNNER_TEMP/case_results/DATA_QA.csv"
          cp "$RUNNER_TEMP/model/DENSITY_DIAGNOSTICS.csv" "$RUNNER_TEMP/case_results/DENSITY_DIAGNOSTICS.csv"
          cp "$RUNNER_TEMP/model/RISK_DIAGNOSTICS.csv" "$RUNNER_TEMP/case_results/RISK_DIAGNOSTICS.csv"
      - name: Execute all registered full-route and local-intervention comparisons
        shell: bash
        run: |
          set -euo pipefail
          python research/CHAIN_HYPOTHESES_20261019/run_case.py --work "$RUNNER_TEMP/model" --case '${{ matrix.case }}' --out "$RUNNER_TEMP/case_results" | tee "$RUNNER_TEMP/case_results/EXECUTION.log"
      - name: Preserve completed conditions and explicit failed conditions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-result-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/case_results/
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
  independent_summary:
    if: always()
    needs: [replay, synthetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Combine results from this execution, never substitute older successes
        run: |
          mkdir -p "$RUNNER_TEMP/delivery/results" "$RUNNER_TEMP/delivery/analysis"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'chain-result-*' --dir "$RUNNER_TEMP/delivery/results"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'chain-synthetic-*' --dir "$RUNNER_TEMP/delivery/synthetic"
          cp -R research/CHAIN_HYPOTHESES_20261019 "$RUNNER_TEMP/delivery/code"
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
      - name: Independent trace re-scoring and paired scientific contrasts
        shell: bash
        run: |
          set -euo pipefail
          python research/CHAIN_HYPOTHESES_20261019/summarize.py --input "$RUNNER_TEMP/delivery/results" --out "$RUNNER_TEMP/delivery/analysis" | tee "$RUNNER_TEMP/delivery/analysis/SUMMARY.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/delivery/analysis/
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/delivery/
          compression-level: 1
          retention-days: 30
