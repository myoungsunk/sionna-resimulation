name: DLP P1 independent GitHub pre-run audit (no science)
on:
  push:
    branches:
      - audit/dlp-p1-independent-actions-20261101
    paths:
      - '.github/workflows/dlp-p1-independent-audit.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/audits/P1_20261101/actions_auditor.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  DLP_PINNED_HEAD: 340877f3537b4cc65cdaa9d687423cba92e0b28b
  DLP_AUDIT_OUT: /tmp/dlp_p1_audit
  DLP_BANK_DIR: /tmp/dlp_p1_banks
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  audit:
    name: Verify real locked C0 H, FFD banks, signed observer and derivatives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify audited proposer ref and partial-checkout exact input/target code
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          PIN=$(git ls-remote origin refs/heads/research/dual-lp-p1-proposer-lock-20261101 | cut -f1)
          test "$PIN" = "$DLP_PINNED_HEAD" || { echo "STOP: proposer branch moved from pinned SHA"; exit 1; }
          export GIT_LFS_SKIP_SMUDGE=1
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'LIST'
          /research/DUAL_LP_PAPER_GAP_20261030/contracts/**
          /research/DUAL_LP_PAPER_GAP_20261030/audits/P1_20261101/actions_auditor.py
          /research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
          LIST
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json')
          a=json.loads(p.read_text())
          paths=[
            '/research/DUAL_LP_PAPER_GAP_20261030/contracts/**',
            '/research/DUAL_LP_PAPER_GAP_20261030/audits/P1_20261101/actions_auditor.py',
            '/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json',
            '/research/FFD_P0P3_20261016/**',
            '/research/EKF4_RANGE_S_STAGED_20261014/p3_rf_adapter4.py',
            '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**',
            '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/**'
          ]
          paths += ['/'+x['path'] for x in a['base_assets']]
          paths += ['/'+x['path'] for x in a['locked_source_code']]
          Path('/tmp/dlp_p1_sparse').write_text('\n'.join(sorted(set(paths)))+'\n')
          print('Sparse patterns:',len(set(paths)))
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/dlp_p1_sparse
          test -s research/FFD_P0P3_20261016/source_model.py
          test -s results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/FULL_RF/H_R2_aA_m0.npy
          echo "Exact proposer SHA pinned, sparse checkout complete."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install independent numerical audit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Retrieve previous original NPZ artifact into isolated runner scratch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DLP_BANK_DIR" "$DLP_AUDIT_OUT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation \
            --name ffd-verified-original-38875080492 --dir "$DLP_BANK_DIR"
          find "$DLP_BANK_DIR" -maxdepth 3 -type f -printf '%P %s bytes\n'
      - name: EXECUTE independent pre-run audit only
        shell: bash
        run: |
          set -euo pipefail
          python -u research/DUAL_LP_PAPER_GAP_20261030/audits/P1_20261101/actions_auditor.py \
            2>&1 | tee "$DLP_AUDIT_OUT/AUDIT_LOG.txt"
      - name: Preserve original independent runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlp-p1-independent-preaudit-${{ github.run_id }}
          path: /tmp/dlp_p1_audit/
          retention-days: 30
          if-no-files-found: warn
      - name: Append-only commit of result receipts back to audit branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DLP_AUDIT_OUT/AUDIT_RESULT.json" || { echo "No full audit receipt to commit"; exit 0; }
          D="research/DUAL_LP_PAPER_GAP_20261030/audits/P1_20261101/runs/${GITHUB_RUN_ID}"
          mkdir -p "$D"
          cp "$DLP_AUDIT_OUT/AUDIT_RESULT.json" "$D/"
          cp "$DLP_AUDIT_OUT/INPUT_SHA_LEDGER.json" "$D/" || true
          cp "$DLP_AUDIT_OUT/CANARY_QA.json" "$D/" || true
          cp "$DLP_AUDIT_OUT/AUDIT_LOG.txt" "$D/" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$D"
          git commit -m "audit(p1): preserve independent run ${GITHUB_RUN_ID}, no science or freeze"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
