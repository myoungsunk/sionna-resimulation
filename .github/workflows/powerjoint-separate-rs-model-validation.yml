name: POWERJOINT separate Range-s models correlation validation
on:
  push:
    branches: ['research/powerjoint-separate-marginals-correlation-20261020']
    paths: ['.github/workflows/powerjoint-separate-rs-model-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: ${{ runner.temp }}/source
  PJ_OUT: ${{ runner.temp }}/output
  PJ_BANK_DOWNLOAD: ${{ runner.temp }}/bankdownload
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 tabulate==0.9.0
      - name: Restore immutable original RF and FFD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_BANK_DOWNLOAD"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
          python -m compileall -q research/PJ_SEPARATE_RS_20261020
      - name: Learn all models on training routes only and evaluate held-route measurement errors
        shell: bash
        run: |
          set -euo pipefail
          python -u research/PJ_SEPARATE_RS_20261020/experiment.py --phase prepare
          cp research/PJ_SEPARATE_RS_20261020/*.py research/PJ_SEPARATE_RS_20261020/*.md "$PJ_OUT/"
          python -m pip freeze > "$PJ_OUT/DEPENDENCIES.txt"
      - name: Preserve train splits parameters measurement scores and input SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: separate-rs-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/output/**
          retention-days: 30
          if-no-files-found: error
  replay:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [R2_aA_m0, R2_aA_m45, R2_aB_m0, R4_aA_m0, R4_aB_m0, R5_aA_m0, R5_aB_m0]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 tabulate==0.9.0
      - name: Stage paired source and frozen held-route parameters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_BANK_DOWNLOAD"
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download "${{ github.run_id }}" --repo myoungsunk/sionna-resimulation --name separate-rs-prepared-${{ github.run_id }} --dir "$PJ_OUT"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: B0 L2 Full LoS natural recursion and same-prior ablations
        shell: bash
        run: |
          set -euo pipefail
          python -u research/PJ_SEPARATE_RS_20261020/experiment.py --phase replay --case '${{ matrix.case }}'
      - name: Save every trace including failed-condition logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: separate-rs-replay-${{ matrix.case }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/output/*_TRACE.npz
            ${{ runner.temp }}/output/*_SCORES.csv
            ${{ runner.temp }}/output/*_QA.csv
            ${{ runner.temp }}/output/*_UPDATE_ORIGINS.csv.gz
            ${{ runner.temp }}/output/MATH_QA.json
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: [prepare, replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/PJ_SEPARATE_RS_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 tabulate==0.9.0
      - name: Re-score every saved trace and aggregate without dropping failed candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PJ_OUT"
          gh run download "${{ github.run_id }}" --repo myoungsunk/sionna-resimulation --pattern 'separate-rs-*' --dir "$PJ_OUT"
          python -u research/PJ_SEPARATE_RS_20261020/summarize.py
          cat "$PJ_OUT/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish full scientific results bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: POWERJOINT_SEPARATE_RS_VALIDATION_${{ github.run_id }}
          path: ${{ runner.temp }}/output/**
          retention-days: 30
          if-no-files-found: error
