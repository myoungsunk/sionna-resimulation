name: RA5 ONLINE P0 train-only prior mean, tap class and 3x3 covariance recursive canaries
on:
  push:
    branches: [audit/ra5-prior-joint-recursive-p0-20261030]
    paths:
      - '.github/workflows/ra5-online-p0-recursive-canaries.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/online_observer.py'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/run_prior_joint_canary.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
  SOURCE_COMMIT: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        case: [R4_aB_m0, R5_aA_m0]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 5
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
            docs/research-governance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Role-governed source and draft lock (not a science freeze)
        shell: bash
        run: |
          set -euo pipefail
          for role in COMMON_CONTRACT ROLE_PROPOSER ROLE_IMPLEMENTER ROLE_AUDITOR; do
            test -s "docs/research-governance/$role.md"
          done
          test -s "$EXP/RA5_ONLINE_P0_DRAFT_CONTRACT.md"
          mkdir -p "$RUNNER_TEMP/result"
          sha256sum "$EXP/RA5_ONLINE_P0_DRAFT_CONTRACT.md" > "$RUNNER_TEMP/result/DRAFT_CONTRACT_SHA.txt"
          export REFLECT_ROOT="$RUNNER_TEMP/source"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Download SHA-locked seven original Full-H and SAMPLES (NO RT)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source"
          BLK=results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
          for CASE in R2_aA_m0 R2_aB_m0 R2_aA_m45 R4_aA_m0 R4_aB_m0 R5_aA_m0 R5_aB_m0; do
            git -C "$ROOT/.src.git" cat-file -p "$SOURCE_COMMIT:$BLK/FULL_RF/H_$CASE.npy" > "$ROOT/H_$CASE.npy"
            git -C "$ROOT/.src.git" cat-file -p "$SOURCE_COMMIT:$BLK/$CASE/SAMPLES.json" > "$ROOT/SAMPLES_$CASE.json"
          done
          git -C "$ROOT/.src.git" cat-file -p "$SOURCE_COMMIT:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
          test "$(find "$ROOT" -maxdepth 1 -name 'H_*.npy' | wc -l)" = 7
      - name: Full baseline BB_ORIG state/P/mask parity and new prior-joint recursive arms
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/source"
          python -u "$EXP/run_prior_joint_canary.py" \
            --rf-root "$RUNNER_TEMP/source" \
            --input-manifest research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json \
            --case "${{ matrix.case }}" --level B0 --out "$RUNNER_TEMP/result" \
            2>&1 | tee "$RUNNER_TEMP/result/RUN_LOG.txt"
      - name: Hash input/output evidence with provenance and explicit scopes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export SRC_ROOT="$RUNNER_TEMP/source"
          export OUT_ROOT="$RUNNER_TEMP/result"
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,platform,subprocess
          o=pathlib.Path(os.environ["OUT_ROOT"]);o.mkdir(parents=True,exist_ok=True)
          p=pathlib.Path("research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0")
          c=p/"RA5_ONLINE_P0_DRAFT_CONTRACT.md"
          content=dict(role="IMPLEMENTER",contract_id="RA5-ONLINE-P0-20261030",
            contract_status="DRAFT_TECHNICAL_ONLY",contract_sha256=hashlib.sha256(c.read_bytes()).hexdigest(),
            base_git_sha="bfff111357ffd54baa2627dfda01df99548a6cd9",
            governance_git_sha="250d617ad89a4105fa1af546cc83ceed9de98f42",
            execution_sha=os.environ.get("GITHUB_SHA"),run_id=os.environ.get("GITHUB_RUN_ID"),
            original_source_git_sha="9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13",
            timestamp_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
            python=platform.python_version(),
            source_lock_path=str(pathlib.Path(os.environ["SRC_ROOT"])/"out/INPUT_LOCK.sha256"),
            source_lock_sha256=hashlib.sha256((pathlib.Path(os.environ["SRC_ROOT"])/"out/INPUT_LOCK.sha256").read_bytes()).hexdigest(),
            controls=[{"path":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted((pathlib.Path(os.environ["SRC_ROOT"])/"traces").glob("*_B0_CONTROL.npz"))],
            banks=[{"path":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted((pathlib.Path(os.environ["SRC_ROOT"])/"banks").glob("LP_*.npz"))],
            source_pose_tables=[{"path":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(pathlib.Path(os.environ["SRC_ROOT"]).glob("SAMPLES_*.json"))],
            sources=[{"path":x.name,"sha256":hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(pathlib.Path(os.environ["SRC_ROOT"]).glob("H_*.npy"))],
            scripts={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.glob("*.py")},
            command="python run_prior_joint_canary.py --case matrix.case --level B0 --input-manifest P0_INPUT_MANIFEST.json",
            independent_rf_scenes=1,source_full_h_only=True,science_release=False,
            independent_auditor=False,originals_untouched=True)
          (o/"RA5_P0_RUN_MANIFEST.json").write_text(json.dumps(content,indent=2))
          PY
          (cd "$OUT_ROOT"; find . -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "$OUT_ROOT/OUTPUT_SHA256SUMS.txt"
          (cd "$OUT_ROOT"; sha256sum -c OUTPUT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-online-p0-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
