name: RA5 Gate A4 - aggregate controlled sensor and first-flip effects v2
on:
  push:
    branches: ['audit/ra5-staged-execution-20261029']
    paths:
      - '.github/workflows/ra5-gate-a4-factorial-aggregate-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra4
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2
      - name: Fetch three successful archived canary factorials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 40882051848 --repo myoungsunk/sionna-resimulation --pattern 'a4-factor-*' --dir "$RUNNER_TEMP/source"
          test "$(find "$RUNNER_TEMP/source" -name 'A4_SENSOR_INIT_32X2.csv' | wc -l)" = 3
      - name: Paired-factor average and single first-flip counterfactual
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/a4agg"
          python -u "$EXP/a4_factorial_aggregate.py" --source "$RUNNER_TEMP/source" --out "$RUNNER_TEMP/a4agg" 2>&1 | tee "$RUNNER_TEMP/a4agg/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a4-factor-aggregate-${{ github.run_id }}
          path: ${{ runner.temp }}/a4agg/
          retention-days: 30
          if-no-files-found: warn
