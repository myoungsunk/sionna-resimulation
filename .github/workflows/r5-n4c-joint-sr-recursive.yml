name: N4-C Joint4 SR4 Frozen FullRF Range-s Recursive
on:
  push:
    branches: ['research/r5-n4c-joint-sr-recursive-20261015']
    paths:
      - '.github/workflows/r5-n4c-joint-sr-recursive.yml'
      - 'research/R5_N4C_20261015/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: n4c-rf-full-bias-${{ github.ref }}
  cancel-in-progress: false
jobs:
  n4c_4state_solvers:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Exact sparse original R2 EKF and N4B source checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N4C_20261015/**\n/research/R5_N4B_20261015/n4b_rf_errors.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-n4c-joint-sr-recursive.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory prior-to-experiment exact source and solver audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4C_20261015/n4c_joint_sr4.py --phase pre --out "$RUNNER_TEMP/n4c_pre" | tee "$RUNNER_TEMP/n4c_pre.log"
      - name: Fetch previously audited RF R2 and heldout N4B output with checksums
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/N4C_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/N4C_RF.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/N4C_R2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/N4C_R2.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/N4C_N4B.zip"
          echo '170a646f8167f1e440316abf42b614afa4efc3d77037c0e19bf470a817fc334b  '"$RUNNER_TEMP/N4C_N4B.zip" | sha256sum -c
      - name: Install original pinned numeric dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 pandas==2.2.3
      - name: Test analytical correlated SR4 whitening vs joint Gaussian and original baseline
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4C_20261015/n4c_joint_sr4.py --phase test | tee "$RUNNER_TEMP/n4c_test.log"
      - name: Execute 4 gyro bias levels paired Full and LoS Joint4 SR4 mean covariance robust
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N4C_20261015/n4c_joint_sr4.py --phase run --out "$RUNNER_TEMP/n4c_results" --audit "$RUNNER_TEMP/n4c_pre/PRE_AUDIT.json" --raw "$RUNNER_TEMP/N4C_RF.zip" --r2 "$RUNNER_TEMP/N4C_R2.zip" --n4b "$RUNNER_TEMP/N4C_N4B.zip" | tee "$RUNNER_TEMP/n4c_run.log"
      - name: Preserve full x P trajectory and audit failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n4c-joint-sr-recursive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n4c_pre/**
            ${{ runner.temp }}/n4c_results/**
            ${{ runner.temp }}/n4c_pre.log
            ${{ runner.temp }}/n4c_test.log
            ${{ runner.temp }}/n4c_run.log
          if-no-files-found: warn
          retention-days: 30
