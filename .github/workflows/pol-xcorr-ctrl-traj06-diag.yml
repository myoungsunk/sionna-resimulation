name: CTRL-TRAJ-06 diag s_fp ripple (exploratory)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-ctrl-traj06-diag.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/diag/sfp_ripple_diag.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - run: |
          set -euo pipefail; mkdir -p /tmp/banks
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/banks
      - name: Run
        run: |
          set -euo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/diag/results_run_${GITHUB_RUN_ID}"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -u research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/diag/sfp_ripple_diag.py --bank-dir /tmp/banks --out "$OUT"
      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${OUT:-}" && test -d "$OUT" || exit 0
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"; git commit -m "CTRL-TRAJ-06 s_fp ripple diag run $GITHUB_RUN_ID" || echo no-changes
          for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep 7; done
