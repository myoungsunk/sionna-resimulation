name: G3 25-ray original-source fail-closed negative control
on:
  push:
    branches: ['audit/g3-ray-forensics-ra3-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_25_original_raw_acquisition.py'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/G3_23_ORIGINAL_SOURCE_LOCK.json'
      - '.github/workflows/g3-original-source-failclosed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/qclean_uwb/**
            /research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_25_original_raw_acquisition.py
            /research/RA0_RA1_RA2_AUDIT_20261029/g3/G3_23_ORIGINAL_SOURCE_LOCK.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Missing 23 original traces must be blocked and produce machine-readable receipt
        run: |
          set +e
          python research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_25_original_raw_acquisition.py \
            --s2-parent "$RUNNER_TEMP/empty-original-S2" \
            --lock research/RA0_RA1_RA2_AUDIT_20261029/g3/G3_23_ORIGINAL_SOURCE_LOCK.json \
            --out "$RUNNER_TEMP/negative" | tee "$RUNNER_TEMP/negative.log"
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 2 || { echo "ERR_FAIL_CLOSED_CODE $rc"; exit 1; }
          python -c 'import json,sys; j=json.load(open(sys.argv[1])); assert j["status"]=="BLOCKED_ORIGINAL_SOURCE_NOT_MATERIALIZED" and j["n_raw_found"]==0 and len(j["unavailable_or_unverified"])==23' "$RUNNER_TEMP/negative/SOURCE_ACQUISITION_QA.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-source-failclosed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/negative/SOURCE_ACQUISITION_QA.json
            ${{ runner.temp }}/negative.log
          retention-days: 30
          if-no-files-found: warn
