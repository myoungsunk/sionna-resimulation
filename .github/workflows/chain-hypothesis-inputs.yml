name: Chain hypotheses immutable input recovery
on:
  push:
    branches: ['research/powerjoint-chain-hypotheses-20261019']
    paths: ['.github/workflows/chain-hypothesis-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/FFD_P0P3_20261016
            research/R5_N4B_20261015
            research/R5_N4C_20261015
            research/R5_FULLRF_B0_GATES_20261015
            research/CHAIN_HYPOTHESES_20261019
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Retrieve only this repository's five named frozen artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chain_inputs"
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/12034154094/zip > "$RUNNER_TEMP/chain_inputs/bank.zip"
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11948391783/zip > "$RUNNER_TEMP/chain_inputs/physics.zip"
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/chain_inputs/rf.zip"
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11960766768/zip > "$RUNNER_TEMP/chain_inputs/n4b.zip"
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/chain_inputs/r2.zip"
      - name: Inspect checksums, archive schema and numerical arrays
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3
          python - "$RUNNER_TEMP/chain_inputs" <<'PY'
          import sys,hashlib,zipfile,io,gzip,json
          from pathlib import Path
          import numpy as np
          d=Path(sys.argv[1]);receipt={}
          for p in sorted(d.glob('*.zip')):
              with p.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad:raise RuntimeError('Corrupt archive: '+bad)
                  names=z.namelist();receipt[p.name]={'sha256':h,'bytes':p.stat().st_size,'members':names}
                  print('ARCHIVE',p.name,'SIZE',p.stat().st_size,'SHA',h,'MEMBERS',names[:55],flush=True)
                  if p.stem=='rf':
                      n=next(x for x in names if x.endswith('R2_aA_m45_full_seed0_ONE_STEP.npz'))
                      with np.load(io.BytesIO(z.read(n)),allow_pickle=False) as a:print('RF_ARRAYS',n,{k:[a[k].shape,str(a[k].dtype)] for k in a.files})
                  if p.stem=='n4b':
                      for n in names:
                          if ('DATA' in n or 'FEATURE' in n or 'PRED' in n or 'RESIDUAL' in n) and (n.endswith('.csv') or n.endswith('.gz')):
                              b=z.read(n);s=gzip.decompress(b).decode() if n.endswith('.gz') else b.decode();print('TABLE_SCHEMA',n,s.splitlines()[0],s.splitlines()[1][:600])
                  if p.stem=='bank':
                      for n in names:
                          if n.endswith('.npz'):
                              b=z.read(n);print('BANK_BYTES',n,len(b),hashlib.sha256(b).hexdigest())
          (d/'RECOVERY_RECEIPT.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Preserve reusable recovered inputs; no scientific PASS from download
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/chain_inputs/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
