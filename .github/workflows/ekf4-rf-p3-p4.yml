name: EKF4 P3 RF eligibility and P4 frozen one-step parity
on:
  push:
    branches: ['research/ekf4-r3-p2-p6-20261014']
    paths:
      - '.github/workflows/ekf4-rf-p3-p4.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf_p3_p4.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audited-frozen-rf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Source checkout with original EKF3 contract
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/research/EKF3_INDEPENDENT_20261013/P2_RUN_RECEIPT.json\n/.github/workflows/ekf4-rf-p3-p4.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory code audit before any numerical diagnosis or experiment
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_p3_p4.py --phase audit --out "$RUNNER_TEMP/rf_audit"
      - name: Download immutable original RF archive
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/frozen_rf.zip"
      - name: Install PINNED numeric libraries AFTER audit
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: P3 frozen RF source and trace eligibility
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_p3_p4.py --phase verify --audit "$RUNNER_TEMP/rf_audit/PRE_RUN_AUDIT.json" --archive "$RUNNER_TEMP/frozen_rf.zip" --out "$RUNNER_TEMP/p3"
      - name: P4 frozen identical-prior one-step joint parity
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf_p3_p4.py --phase p4 --audit "$RUNNER_TEMP/rf_audit/PRE_RUN_AUDIT.json" --archive "$RUNNER_TEMP/frozen_rf.zip" --p3 "$RUNNER_TEMP/p3/P3_FINAL.json" --out "$RUNNER_TEMP/p4"
      - name: Preserve verification receipts even on error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-rf-p3-p4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rf_audit/**
            ${{ runner.temp }}/p3/**
            ${{ runner.temp }}/p4/**
            research/EKF4_RANGE_S_STAGED_20261014/rf_p3_p4.py
            research/EKF4_RANGE_S_STAGED_20261014/P3_P6_RF_DEPENDENCY_AUDIT_CONTRACT_KO.md
          if-no-files-found: warn
          retention-days: 30
