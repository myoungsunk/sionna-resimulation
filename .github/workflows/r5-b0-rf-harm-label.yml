name: R5 B0 Full RF multipath proxy versus Heading harm diagnosis
on:
  push:
    branches: ['research/r5-b0-hard-soft-physics-20261015']
    paths:
      - '.github/workflows/r5-b0-rf-harm-label.yml'
      - 'research/R5_B0_HARM_DIAGNOSTIC_20261015/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r5_b0_harm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Exact audited sparse source checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_B0_HARM_DIAGNOSTIC_20261015/**\n/research/R5_FULLRF_B0_GATES_20261015/r5_b0_hard_soft.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-b0-rf-harm-label.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory static source and R5 input contract audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_B0_HARM_DIAGNOSTIC_20261015/r5_b0_risk_diagnostic.py --phase pre --out "$RUNNER_TEMP/r5risk_pre" | tee "$RUNNER_TEMP/r5risk_pre.log"
      - name: Download original immutable RF and completed B0 experimental traces
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/r5risk_original_RF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/r5risk_original_RF.zip" | sha256sum -c
          gh api -H 'Accept: application/vnd.github+json' /repos/myoungsunk/sionna-resimulation/actions/artifacts/11951360261/zip > "$RUNNER_TEMP/r5risk_b0_results.zip"
          echo 'f31a04cf2ba39011a5d685b13985b947b1659e5b63c3a5910ec68175fa7e806a  '"$RUNNER_TEMP/r5risk_b0_results.zip" | sha256sum -c
      - name: Pinned numpy scipy scikit and original sensor library
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Independently examine original J4 updates for harm vs physical risk
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_B0_HARM_DIAGNOSTIC_20261015/r5_b0_risk_diagnostic.py --phase run --raw "$RUNNER_TEMP/r5risk_original_RF.zip" --results "$RUNNER_TEMP/r5risk_b0_results.zip" --audit "$RUNNER_TEMP/r5risk_pre/PRE_AUDIT.json" --out "$RUNNER_TEMP/r5risk_out" | tee "$RUNNER_TEMP/r5risk_out.log"
      - name: Preserve every raw offline harm record and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-b0-harm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r5risk_pre/**
            ${{ runner.temp }}/r5risk_out/**
            ${{ runner.temp }}/r5risk_pre.log
            ${{ runner.temp }}/r5risk_out.log
          if-no-files-found: warn
          retention-days: 30
