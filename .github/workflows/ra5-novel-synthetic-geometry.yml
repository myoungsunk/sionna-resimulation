name: RA5 novel 12x12 synthetic echo geometry stress without RT
on:
  push:
    branches: ['audit/ra5-physical-tap-field-reuse-20261030']
    paths:
      - '.github/workflows/ra5-novel-synthetic-geometry.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/novel_synthetic_echo_geometry.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  novel_synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: false
          persist-credentials: false
          ref: c4d84e02b878af9835bef09d515d45f4010caa74
          path: upstream_mbvar
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.2
      - name: Check source and fetch only original FFD banks / sensor support
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code/world.py)" = 2129aefa65e8dba7abd39dd4a66a89c066eac593
          export REFLECT_ROOT="$RUNNER_TEMP/frozen"
          FETCH_RF=0 bash "$BASE/reflect_model/fetch_inputs.sh"
      - name: Simulate new poses and coherent echo without physical RT
        shell: bash
        run: |
          set -o pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/frozen"
          mkdir -p "$RUNNER_TEMP/newgeostr"
          python -u "$EXP/novel_synthetic_echo_geometry.py" \
            --mbvar-code "upstream_mbvar/$BASE/MBVAR_CONTROLLED_INFO_20261029/code" \
            --draw 256 --out "$RUNNER_TEMP/newgeostr" 2>&1 | tee "$RUNNER_TEMP/newgeostr/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-novel-synthetic-geometry-${{ github.run_id }}
          path: ${{ runner.temp }}/newgeostr/
          retention-days: 30
          if-no-files-found: warn
