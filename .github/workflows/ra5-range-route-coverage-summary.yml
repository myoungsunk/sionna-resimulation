name: RA5 calibrated mean model range coverage route-level accounting
on:
  push:
    branches: [audit/ra5-range-likelihood-selection-20261030]
    paths:
      - '.github/workflows/ra5-range-route-coverage-summary.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/range_loro_coverage_aggregate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirm original source SHA and fetch latest successful seven-case audit
        shell: bash
        run: |
          set -euo pipefail
          REPO=myoungsunk/sionna-resimulation
          test "$(gh api "repos/$REPO/actions/runs/40990582994" --jq '.conclusion')" = success
          gh run download 40990582994 --repo "$REPO" --pattern 'ra5-range-seven-case-loro-*' --dir "$RUNNER_TEMP/inputs"
      - name: Calculate uncertainty interval coverage per heldout source route
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/result"
          python -u research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/range_loro_coverage_aggregate.py \
            --src "$RUNNER_TEMP/inputs" --out "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/result/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-range-route-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          retention-days: 30
          if-no-files-found: warn
