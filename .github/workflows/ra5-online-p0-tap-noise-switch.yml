name: RA5 receiver-noise tap switching conditional distribution source heldout
on:
  push:
    branches: [audit/ra5-prior-joint-recursive-p0-20261030]
    paths:
      - '.github/workflows/ra5-online-p0-tap-noise-switch.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0/tap_switch_conditional_mc.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
  ORIGINAL: 9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  matched:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: R5_aA_m0
            poses: '100,900'
          - case: R2_aA_m45
            poses: '200,500'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/online_p0
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
            research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3
      - name: Fetch only original case Full H and fgrid, SHA verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source";mkdir -p "$ROOT"
          git init --bare "$RUNNER_TEMP/rf.git"
          git -C "$RUNNER_TEMP/rf.git" remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -C "$RUNNER_TEMP/rf.git" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$ORIGINAL"
          CASE="${{ matrix.case }}"
          BLK=results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C
          git -C "$RUNNER_TEMP/rf.git" cat-file -p "$ORIGINAL:$BLK/FULL_RF/H_$CASE.npy" > "$ROOT/H_$CASE.npy"
          git -C "$RUNNER_TEMP/rf.git" cat-file -p "$ORIGINAL:$BLK/freqs_hz.npy" > "$ROOT/freqs_hz.npy"
          python - "$ROOT" "$CASE" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);case=sys.argv[2]
          j=json.loads(pathlib.Path("research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json").read_text())
          a={x["path"]:x for x in j["assets"] if x.get("sha256")}
          names=(("FULL_RF/H_"+case+".npy","H_"+case+".npy"),("freqs_hz.npy","freqs_hz.npy"))
          pairs=[]
          for path,name in names:
              key=next(k for k in a if k.endswith(path))
              digest=hashlib.sha256((p/name).read_bytes()).hexdigest()
              assert digest==a[key]["sha256"],(key,digest)
              pairs.append(digest)
          (p/"LOCK.json").write_text(json.dumps(dict(H_sha256=pairs[0],freq_sha256=pairs[1]),indent=2))
          PY
      - name: Fit categorical model on first pose and evaluate the other
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python -u "$EXP/tap_switch_conditional_mc.py" \
            --case "${{ matrix.case }}" --poses "${{ matrix.poses }}" \
            --source "$RUNNER_TEMP/source" --lock "$RUNNER_TEMP/source/LOCK.json" \
            --draw 512 --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/RUN_LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-tap-noise-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: warn
