name: Office Mount0 Snowball migration receipt
on:
  push:
    branches: [research/office-mount0-rf-20261026]
    paths:
      - .github/workflows/office-m0-rf-20261026.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-m0-rf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record active Snowball campaign
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'RECEIPT'
          ## Office O01/O02/O03 Mount0: computing on Snowball
          User requested Snowball execution with an 8-hour target.
          The remote controller is running; input selftest passed and native RF output has started.
          Root: /home/KMS/OFFICE_M0_RF_20261026_01a17631
          Controller PID at launch: 3734979
          Source revision: b38a65748ae75c6678d87a6a963e8102ba392a78
          Runtime image: sha256:18a2a931b69ef39a028ee6b81e5e0a9dcb2ae0382d07c0093a22efd266eb3b9f
          Input archive SHA256: 6db5a88148b4fe0050816fb5956ced4c3acbc02cb309c9b32b170a706c06fe6b
          Scope: 811 matched RF poses, 257 frequencies, Full/Direct-LoS pairs, 42 batches.
          Gate: all 3 full-frequency pilots must pass before remaining batches.
          Resources: 8 concurrent full batches, 4 CPU and 8 GiB per batch.
          Status: SNOWBALL_STATUS.json. Logs: LOGS/. Raw evidence: BATCHES/.
          On success, aggregation verifies all batches and creates O01/O02/O03_M0.tar.gz plus hashes.
          Original Actions workflow remains available at the source revision above.
          This receipt cancels the superseded Actions campaign through its existing concurrency group.
          RF completion and scientific acceptance are not claimed by this receipt.
          RECEIPT
