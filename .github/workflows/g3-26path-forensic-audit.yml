name: G3 26-path source receipt forensic
on:
  push:
    branches: ['audit/g3-26ray-ra3-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/**'
      - '.github/workflows/g3-26path-forensic-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            src/qclean_uwb
            research/RA0_RA1_RA2_AUDIT_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2
      - name: Recover strict-failure positions and compute unmerged image-class diagnostic
        run: |
          set -euo pipefail
          python -u research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_receipt_reconstruct.py "$RUNNER_TEMP/g3" 2>&1 | tee "$RUNNER_TEMP/g3-forensic.log"
      - name: Upload receipts regardless of verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-26path-source-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/g3/G3_26_OFFENDING_STATIONS.csv
            ${{ runner.temp }}/g3/G3_26_EVIDENCE.json
            ${{ runner.temp }}/g3/G3_AT_RISK_H_ROWS.csv
            ${{ runner.temp }}/g3/G3_AT_RISK_MBVAR_CASES.csv
            ${{ runner.temp }}/g3/G3_H_AND_FILTER_SCOPE.json
            ${{ runner.temp }}/g3-forensic.log
          retention-days: 60
          if-no-files-found: warn
