name: POL-XCORR-001 F-11 power simulation + R-13b evidence preservation (label-free)
on:
  push:
    branches: ['research/pol-xcorr-freeze-v1-20261030']
    paths:
      - '.github/workflows/pol-xcorr-f11-power.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/power/f11_power_sim.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  power:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        auc0: ['0.70', '0.80']
        ell: ['0.1', '0.5', '1.0', '2.0']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Simulate (300 reps, B=2000, delta 0/0.02/0.05)
        run: |
          set -euo pipefail
          python -I -u research/POL_XCORR_UNRESOLVED_20261029/power/f11_power_sim.py --repo-root . \
            --out "/tmp/f11/auc${{ matrix.auc0 }}_ell${{ matrix.ell }}" --reps 300 --boot 2000 \
            --seed $(( 20261030 + ${{ strategy.job-index }} )) \
            --auc0 ${{ matrix.auc0 }} --delta 0.0 0.02 0.05 --ell ${{ matrix.ell }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f11-auc${{ matrix.auc0 }}-ell${{ matrix.ell }}-${{ github.run_id }}
          path: /tmp/f11/
          retention-days: 90
          if-no-files-found: error
  r13b_preserve:
    # preserved once in run 40983557008 (evidence/r13b_run_40983557008); rerun only on manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas==2.3.2
      - name: Download run 39376076166 artifact and extract key+G5 columns only (no labels)
        run: |
          set -euo pipefail
          mkdir -p /tmp/r13b /tmp/r13b_out
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation \
            --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/r13b
          f=$(find /tmp/r13b -name 'OBSERVATION_FEATURES_LABELS.csv.gz' | head -1); test -n "$f"
          python - "$f" <<'PY'
          import sys, hashlib, json, pandas as pd
          f = sys.argv[1]
          G5 = ['range_m','log_fp_power','abs_s_fp','early4','early8','early16','delay_rms_ns','peak_diff_ns','eta_fp_win80',
                's_diff4','s_diff8','s_diff16','tap_pol_var80','jones_diversity','freq_s_var','detector_s_span','detector_delay_span_ns']
          full = hashlib.sha256(open(f,'rb').read()).hexdigest()
          cols = list(pd.read_csv(f, nrows=0).columns)
          d = pd.read_csv(f, usecols=['case','channel','pose_id'] + G5)
          out = '/tmp/r13b_out/R13B_G5_EXTRACT.csv.gz'
          d.to_csv(out, index=False, compression={'method': 'gzip', 'mtime': 0})
          rec = {'source_run': 39376076166, 'source_artifact': 'POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166',
                 'source_artifact_id': 12243278686, 'source_expires_utc': '2026-11-19T05:41:39Z',
                 'source_file': 'prepared/OBSERVATION_FEATURES_LABELS.csv.gz', 'source_sha256': full,
                 'source_columns': cols, 'extract_columns': ['case','channel','pose_id'] + G5,
                 'label_columns_excluded': [c for c in cols if c not in ['case','channel','pose_id'] + G5],
                 'extract_rows': len(d), 'extract_sha256': hashlib.sha256(open(out,'rb').read()).hexdigest()}
          json.dump(rec, open('/tmp/r13b_out/R13B_PRESERVATION_RECEIPT.json','w'), indent=1)
          print(json.dumps({k: rec[k] for k in ('source_sha256','extract_rows','extract_sha256')}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13b-preserve-${{ github.run_id }}
          path: /tmp/r13b_out/
          retention-days: 90
          if-no-files-found: error
  aggregate:
    needs: [power, r13b_preserve]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Collect
        run: |
          set -euo pipefail
          P=research/POL_XCORR_UNRESOLVED_20261029
          OUT="$P/power/results_f11/run_${GITHUB_RUN_ID}"; EV="$P/evidence/r13b_run_${GITHUB_RUN_ID}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"; echo "EV=$EV" >> "$GITHUB_ENV"
          mkdir -p /tmp/in "$OUT" "$EV"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'f11-*' --dir /tmp/in || true
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'r13b-preserve-*' --dir /tmp/in || true
          cp -r /tmp/in/f11-* "$OUT/" 2>/dev/null || true
          cp /tmp/in/r13b-preserve-*/* "$EV/" 2>/dev/null || true
          python - "$OUT" <<'PY'
          import sys, glob, pandas as pd
          out = sys.argv[1]
          fs = sorted(glob.glob(out + '/**/F11_POWER.csv', recursive=True))
          T = pd.concat([pd.read_csv(f) for f in fs], ignore_index=True).sort_values(['auc0_target','ell_m','delta_target'])
          T.to_csv(out + '/F11_POWER_ALL.csv', index=False); print(T.to_string(index=False)); print('jobs', len(fs))
          PY
          printf '{"github_run_id":"%s","head_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$OUT/F11_RUN_RECEIPT.json"
      - name: Commit (append-only)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT" "$EV"
          git commit -m "POL-XCORR-001 F-11 power simulation and R-13b G5 evidence extract from run $GITHUB_RUN_ID (label-free)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
