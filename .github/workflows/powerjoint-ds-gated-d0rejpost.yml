name: POWERJOINT d0 rejection post-aggregation
on:
  push:
    branches: ['research/powerjoint-ds-gated-plan-20261021']
    paths: ['.github/workflows/powerjoint-ds-gated-d0rejpost.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2 scikit-learn==1.7.2
      - name: Download replay artifacts of run 39724375930 and analyse per file
        env:
          PJ_REJ_IN: /tmp/rej_in
        run: |
          set -euo pipefail
          mkdir -p /tmp/rej_in
          gh run download 39724375930 --repo myoungsunk/sionna-resimulation --pattern 'dr-*' --dir /tmp/rej_in
          python -u research/PJ_DS_GATED_20261021/d0reject_analyze.py 2>&1 | tee research/PJ_DS_GATED_20261021/results_d0reject/ANALYZE_LOG.txt
      - name: Commit results back
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_DS_GATED_20261021/results_d0reject || true
          git commit -m "d0 rejection post-aggregation (per-file analysis) for run 39724375930 (automated)" || echo 'nothing to commit'
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
