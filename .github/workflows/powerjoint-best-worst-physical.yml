name: POWERJOINT best worst RF physical interference causal controls
on:
  push:
    branches: ['research/powerjoint-crosscase-mechanism-20261020']
    paths: ['.github/workflows/powerjoint-best-worst-physical.yml']
permissions:
  contents: read
  actions: read
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        route: [C01, C02, C03, O01, O02, O03]
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_CROSSCASE_20261020/**
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Fetch exact pinned RF source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download 39277485012 --repo myoungsunk/sionna-resimulation --name "powerjoint-newrf-${{ matrix.route }}-39277485012" --dir "$RUNNER_TEMP/source"
      - name: Coherent polarization/FP ablations with predeclared event matching
        shell: bash
        run: |
          set -euo pipefail
          python research/POWERJOINT_CROSSCASE_20261020/physical_event_contrast.py "$RUNNER_TEMP/source/data" "$RUNNER_TEMP/metrics" "${{ matrix.route }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pj-extreme-physics-${{ matrix.route }}-${{ github.run_id }}
          path: ${{ runner.temp }}/metrics/**
          retention-days: 30
          if-no-files-found: warn
