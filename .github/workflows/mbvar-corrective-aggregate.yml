name: MB_VAR corrective aggregation and evidence audit
on:
  push:
    branches: ['research/mbvar-e2-e5-revalidation-20261029']
    paths: ['.github/workflows/mbvar-corrective-aggregate.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BASE: research/DS_MASK_CAUSAL_X1_X2_20261026
  DEST: research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_control_correction_20261029
            research/DS_MASK_CAUSAL_X1_X2_20261026/mbvar_e2_e5_revalidation_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2 tabulate==0.9.0
      - name: Aggregate only exact score shard filenames and verify raw hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/reaggregation" "$RUNNER_TEMP/out/corrective" "$RUNNER_TEMP/out/code"
          python "$DEST/aggregate_recovery.py" --input "$DEST/results/run_40830330560" --out "$RUNNER_TEMP/out/corrective"
          python "$DEST/audit_existing.py" --input "$BASE/mbvar_control_correction_20261029/results/run_40820579727" --out "$RUNNER_TEMP/out/reaggregation"
          cp "$DEST/"{revalidate.py,aggregate_recovery.py,audit_existing.py,seed_isolation.py} "$RUNNER_TEMP/out/code/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrective-final-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: Publish final corrected tables without changing original evidence
        if: success()
        run: |
          set -euo pipefail
          TARGET="$DEST/results/final_run_$GITHUB_RUN_ID"
          mkdir -p "$TARGET"; cp -R "$RUNNER_TEMP/out/". "$TARGET/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"; git commit -m "Verified E2/E5 aggregation and source audit run $GITHUB_RUN_ID" || exit 0
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git -c http.extraheader="$AUTH" pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
