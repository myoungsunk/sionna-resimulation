name: Exact LoS-LUT and RF drive/probe lag covariance audit
on:
  push:
    branches: [codex/lut-los-timecov-audit-20261011]
    paths:
      - '.github/workflows/lut-los-timecov-audit-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_lut_los_temporal_cov_audit_20261011.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-existing-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_lut_los_temporal_cov_audit_20261011.py
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/01_FEATURES.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R4_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R5_Tnone.csv
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R2_aA_m0/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R2_aB_m0/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R2_aA_m45/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aA_m0/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aB_m0/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R5_aA_m0/SAMPLES.json
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R5_aB_m0/SAMPLES.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'numpy==2.2.4' 'pandas==2.2.3' 'tabulate==0.9.0'
      - name: Audit 9519 native LoS and fixed LUT residual and temporal RF correlation
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_lut_los_temporal_cov_audit_20261011.py
          python -X utf8 research/HEADING_RELIABILITY_20261010/run_lut_los_temporal_cov_audit_20261011.py --out research_results/LUT_LOS_TIMECOV_20261011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lut-los-rf-lag-audit-20261011
          path: research_results/LUT_LOS_TIMECOV_20261011
          if-no-files-found: warn
          retention-days: 30
