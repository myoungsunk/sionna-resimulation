name: POWERJOINT M45 Compact Route Geometry Preflight (NO RF)
on:
  push:
    branches: ['research/powerjoint-m45-corridor-office-routes-20261019']
    paths:
      - 'research/POWERJOINT_M45_COMPACT_20261019/**'
      - '.github/workflows/powerjoint-m45-compact-routes-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install only deterministic route planning dependency (no Sionna solver)
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Generate/check route geometry, timestamps and 9 route-anchor cases
        shell: bash
        run: |
          set -euo pipefail
          python research/POWERJOINT_M45_COMPACT_20261019/02_prepare_routes.py --out "$RUNNER_TEMP/m45_routes"
          python - "$RUNNER_TEMP/m45_routes/ROUTE_PREFLIGHT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["route_count"]==6
          assert d["scene_count"]==2
          assert d["route_anchor_cases"]==9
          assert d["full_h_generated"] is False
          assert d["status"]=="ROUTE_GEOMETRY_ONLY_PASS_NOT_RF"
          assert all(x["frames_radio"]>0 and x["frames_motion"]>=x["frames_radio"] for x in d["routes"])
          print("ROUTE_PREFLIGHT_PASS_NO_RF")
          PY
      - name: Save immutable pose request; explicitly not RF simulation outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pj-m45-six-routes-no-rf-${{ github.run_id }}
          path: ${{ runner.temp }}/m45_routes/**
          retention-days: 30
          if-no-files-found: warn
