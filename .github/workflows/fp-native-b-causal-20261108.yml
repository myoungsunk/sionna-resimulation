name: FP Native vs B causal validation v3 (Release SHA + baseline gates)
on:
  push:
    branches:
      - analysis/fp-native-b-causal-20261108
    paths:
      - .github/workflows/fp-native-b-causal-20261108.yml
      - research/FP_NATIVE_B_CAUSAL_ABLATION_20261108/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fp-native-b-causal-v3-${{ github.sha }}
  cancel-in-progress: false
jobs:
  causal-validate:
    name: R2/R4/R5 B-only, K1/K2 replay and NN/BN/NB/BB causal split
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GH_TOKEN: ${{ github.token }}
      RUN_DIR: /tmp/fp-native-b-causal
      CODE_DIR: research/FP_NATIVE_B_CAUSAL_ABLATION_20261108
    steps:
      - name: Sparse checkout pinned source only (LFS not smudged)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fp-native-b-causal-20261108.yml
            /research/FP_NATIVE_B_CAUSAL_ABLATION_20261108/**
            /research/FP_SC_RECOVERY_R0_R5_20261107/**
            /research/FP_SC_MISSED_ONSET_T0T1_20261106/RUN_001/*FEATURES.csv
            /research/MBVAR_PRR_001_20261103/S1/runs/EVAL_001/SCORES_PER_SEED.csv
            /research/MBVAR_PRR_001_20261103/POST_S3_PROPOSER_20261104/R2_EXTENSION/FULL_002/NATURAL_SUMMARY.csv
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/FP_SELECTIVE_CORRECTION_001/E1_02_PREPARATION_R1_20261105/INPUTS/R2_B0_Full_10/**
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/FP_SELECTIVE_CORRECTION_001/E1_02_PREPARATION_R1_20261105/INPUTS/R4_B0_Full_10/**
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/FP_SELECTIVE_CORRECTION_001/E1_02_PREPARATION_R1_20261105/INPUTS/R5_B0_Full_10/**
            /research/FP_SC_S1_RUN_20261106/RESULTS/*/ROWS.json.gz
      - name: Verify checkout and pin execution source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR" /tmp/fp-causal-code
          git rev-parse HEAD | tee "$RUN_DIR/CHECKOUT_SHA.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$CODE_DIR/RELEASE_INPUT_LOCK.json"
          test -s research/FP_SC_RECOVERY_R0_R5_20261107/r45.py
          sha256sum "$CODE_DIR"/*.py "$CODE_DIR"/RELEASE_INPUT_LOCK.json > "$RUN_DIR/EXECUTED_SOURCE_SHA256.txt"
          echo 'CHECKOUT_PASS' | tee "$RUN_DIR/STAGES.txt"
      - name: Acquire eight exact-SHA Release inputs (fail closed)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 -u "$CODE_DIR/acquire_inputs.py" --out /tmp/fp-release-assets 2>&1 | tee "$RUN_DIR/ACQUISITION.log"
          echo 'RELEASE_INPUT_8_OF_8_SHA_PASS' | tee -a "$RUN_DIR/STAGES.txt"
      - name: Python and pinned numeric dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned libraries and test actual checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 pandas==2.3.3
          cp "$CODE_DIR"/*.py "$CODE_DIR"/*.json "$CODE_DIR"/*.md /tmp/fp-causal-code/
          python -m compileall -q "$CODE_DIR"
          python "$CODE_DIR/test_repairs.py" 2>&1 | tee "$RUN_DIR/REPAIR_TESTS.log"
          python "$CODE_DIR/fp_ns_ablation.py" --selftest | tee "$RUN_DIR/SELFTEST.log"
      - name: Stage 11 exact-SHA assets with safe retry
        shell: bash
        run: |
          set -euo pipefail
          python -u "$CODE_DIR/stage_inputs.py" --repo "$GITHUB_WORKSPACE" --assets /tmp/fp-release-assets --out "$RUN_DIR/stage"
          python -u "$CODE_DIR/stage_inputs.py" --repo "$GITHUB_WORKSPACE" --assets /tmp/fp-release-assets --out "$RUN_DIR/stage"
      - name: Native and B baseline parity first (R2 then R4 R5)
        shell: bash
        run: |
          set -euo pipefail
          python -u "$CODE_DIR/baseline_gate.py" --repo "$GITHUB_WORKSPACE" --out "$RUN_DIR/BASELINE" --routes R2 R4 R5 2>&1 | tee "$RUN_DIR/BASELINE.log"
      - name: Preserve completed baseline before full experiment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp-native-b-baseline-${{ github.run_id }}
          path: /tmp/fp-native-b-causal/BASELINE/**
          retention-days: 30
          if-no-files-found: error
      - name: Reproduce native/B and K1/K2 stored comparison
        shell: bash
        run: |
          set -euo pipefail
          python -u "$CODE_DIR/stored_audit.py" --repo "$GITHUB_WORKSPACE" --out "$RUN_DIR/STORED_AUDIT.json"
      - name: Replay B-only and original K1/K2 under frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          python -u "$CODE_DIR/k_recovery_parity.py" --repo "$GITHUB_WORKSPACE" --out "$RUN_DIR/B_K_REPLAY" 2>&1 | tee "$RUN_DIR/B_K_REPLAY.log"
      - name: NN BN NB BB natural and fixed-gate analysis plus calibration sensitivity
        shell: bash
        run: |
          set -euo pipefail
          for calibration in frozen zero_mean zero_mean_common_R; do
            python -u "$CODE_DIR/fp_ns_ablation.py" --repo "$GITHUB_WORKSPACE" --baseline "$RUN_DIR/BASELINE" --calibration "$calibration" --out "$RUN_DIR/CAUSAL_$calibration" 2>&1 | tee "$RUN_DIR/CAUSAL_$calibration.log"
          done
      - name: Archive source, checks, results, failures and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp-native-b-causal-v3-${{ github.run_id }}
          path: |
            /tmp/fp-native-b-causal/**
            /tmp/fp-causal-code/**
            /tmp/fp-release-assets/*RECEIPT.json
            /tmp/fp-release-assets/*FAILURE.json
          retention-days: 30
          if-no-files-found: warn
