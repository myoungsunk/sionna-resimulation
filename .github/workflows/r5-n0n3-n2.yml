name: N2 Range-s 2x2 LoS Full Joint4 SR4 Counterfactual
on:
  push:
    branches: ['research/r5-n0n3-audited-20261015']
    paths:
      - '.github/workflows/r5-n0n3-n2.yml'
      - 'research/R5_N0_N3_20261015/n2_factorial.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  N2_factorial_analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Exact original R2 observer and LUT sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/R5_N0_N3_20261015/n2_factorial.py\n/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_2deg.npy\n/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json\n/.github/workflows/r5-n0n3-n2.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Pre-run complete solver and LUT source audit
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n2_factorial.py --phase pre --out "$RUNNER_TEMP/n2_pre" | tee "$RUNNER_TEMP/n2_pre.log"
      - name: Exact N0-scoped gate and validated original RF/R2 artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11953640791/zip > "$RUNNER_TEMP/n0.zip"
          echo 'aade786b83357086c9e645fa9b87467a869289aa93040e3b48410f44af2d08fb  '"$RUNNER_TEMP/n0.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11782748118/zip > "$RUNNER_TEMP/frozenRF.zip"
          echo '88b0e89e752b482a54e882c25c72908ed115088a3f5783321945b627467ecd63  '"$RUNNER_TEMP/frozenRF.zip" | sha256sum -c
          gh api /repos/myoungsunk/sionna-resimulation/actions/artifacts/11940333419/zip > "$RUNNER_TEMP/frozenR2.zip"
          echo 'ac98c5b50077484f10bb3898138c46115d4921ac099753c5f935db33521da399  '"$RUNNER_TEMP/frozenR2.zip" | sha256sum -c
      - name: Exact numeric libraries after audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - name: N2 mathematical one-step and joint sequential canaries
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n2_factorial.py --phase test | tee "$RUNNER_TEMP/n2_test.log"
      - name: Original same-pose four RF combinations under common and natural gates
        shell: bash
        run: |
          set -euo pipefail
          python research/R5_N0_N3_20261015/n2_factorial.py --phase run --out "$RUNNER_TEMP/n2_result" --audit "$RUNNER_TEMP/n2_pre/N2_PRE_AUDIT.json" --n0 "$RUNNER_TEMP/n0.zip" --raw "$RUNNER_TEMP/frozenRF.zip" --r2 "$RUNNER_TEMP/frozenR2.zip" | tee "$RUNNER_TEMP/n2_result.log"
      - name: Preserve all numerical and source audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n2-factorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/n2_pre/**
            ${{ runner.temp }}/n2_result/**
            ${{ runner.temp }}/n2_pre.log
            ${{ runner.temp }}/n2_test.log
            ${{ runner.temp }}/n2_result.log
          if-no-files-found: warn
          retention-days: 30
