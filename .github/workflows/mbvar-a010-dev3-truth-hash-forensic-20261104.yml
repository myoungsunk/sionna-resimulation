name: MBVAR A010 DEV3 C3 TRUTH_ONLY hash forensic (READ-ONLY; NO solver replay)
on:
  push:
    branches: [execution/mbvar-a010-dev3-c3-user-approved-20261104]
    paths:
      - '.github/workflows/mbvar-a010-dev3-truth-hash-forensic-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  PIP_PKGS: numpy==2.3.3 scipy==1.16.2 pandas==2.3.2
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
  S1_RUN: '41769652106'
jobs:
  array-hash-diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - run: python -m pip install --disable-pip-version-check $PIP_PKGS
      - name: Restore fixed S1 original and exact FFD bank source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mi" "$RUNNER_TEMP/s1agg" "$RUNNER_TEMP/forensic"
          gh run download "$S1_RUN" --repo ${{ github.repository }} --name a010-dev3-s1-aggregate-$S1_RUN --dir "$RUNNER_TEMP/s1agg"
          gh run download "$S1_RUN" --repo ${{ github.repository }} --name a010-dev3-source-$S1_RUN --dir "$RUNNER_TEMP/mi"
          echo "28de7b01c9ef29175a7f5920b12ad700488c22f0b64eb9b5e0f4797eaa88d9ee  $RUNNER_TEMP/mi/out/INPUT_LOCK.sha256" | sha256sum -c -
          test -s "$RUNNER_TEMP/s1agg/MANIFEST.json"
      - name: Compare exact original S1 TRUTH arrays vs same-source C3 regenerated truth, no gate relaxation
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          python - <<'PY'
          import sys,os,json,numpy as np,pathlib
          EXP=pathlib.Path(os.environ["EXP"])
          sys.path.insert(0,str(EXP/"code"))
          import s1v5 as T, s1_mc as M, a10_validation as AV
          from pathlib import Path
          lk=T.lock_v5()
          M.check_code_lock(lk)
          S=T.canonical_setup(lk)
          manifest=json.loads((Path(os.environ["RUNNER_TEMP"])/"s1agg/MANIFEST.json").read_text())
          assert manifest["source_git_sha"]=="0bd5d706710f172ff6becb562eadd7573b5d3ffd"
          assert manifest["source_code_sha256"]==M.MF.code_hashes()
          keys=("Xtrue","poses","dts","ds_true","dth_true","prior_P0","mu","pose_keys_sha")
          result=dict(source_s1_run=41769652106,source_sha=manifest["source_git_sha"],
            contract_sha256=manifest["contract_sha256"],
            strict_C3_current_status="ERR_A010_TRUTH_ONLY_REPLAY",source_arrays_kept_immutable=True,
            checks=[],n_match=0,n_mismatch=0,max_abs_difference_by_name={})
          for field in (20,21,22,24,27,29):
            fn=Path(os.environ["RUNNER_TEMP"])/f"s1agg/S1V5_INPUTS_DEV3_{field}.zip"
            with np.load(fn,allow_pickle=False) as z:
              for role,w in S["wins"].items():
                for cell in S["cells"]:
                  if cell not in w["cells"]:continue
                  prefix=f"TRUTH|{field}|{role}|{cell}|"
                  truth={
                    "Xtrue":w["Xtrue"],"poses":w["poses"],"dts":w["dts"],
                    "ds_true":w["ds"],"dth_true":w["dth"],
                    "prior_P0":T.P0M,"mu":np.zeros((T.N,2)),
                    "pose_keys_sha":np.array(T.pose_keys_sha(w))}
                  for name in keys:
                    key=prefix+name
                    assert key in z,key
                    orig=z[key];regen=np.asarray(truth[name])
                    match=AV.array_sha(orig)==AV.array_sha(regen)
                    max_diff=None
                    if orig.shape==regen.shape and orig.dtype.kind in "fiu" and regen.dtype.kind in "fiu":
                      max_diff=float(np.max(np.abs(orig.astype("float64")-regen.astype("float64"))))
                      result["max_abs_difference_by_name"][name]=max(max_diff,result["max_abs_difference_by_name"].get(name,0.0))
                    result["n_match" if match else "n_mismatch"]+=1
                    if not match:
                      result["checks"].append(dict(field=field,role=role,cell=cell,array=name,
                        dtype_source=orig.dtype.str,dtype_regen=regen.dtype.str,
                        shape_source=list(orig.shape),shape_regen=list(regen.shape),
                        hash_source=AV.array_sha(orig),hash_regen=AV.array_sha(regen),
                        max_abs_diff=max_diff))
          out=Path(os.environ["RUNNER_TEMP"])/"forensic/C3_TRUTH_REPLAY_HASH_DIAGNOSTIC.json"
          out.write_text(json.dumps(result,indent=2,default=float))
          print("C3_TRUTH_HASH_FORENSIC_FINISHED",
            "n_equal",result["n_match"],"n_divergent",result["n_mismatch"],
            "max_deltas",result["max_abs_difference_by_name"])
          print("DIFFERENT_FIELDS",sorted({x["field"] for x in result["checks"]}))
          print("DIFFERENT_ARRAYS",sorted({x["array"] for x in result["checks"]}))
          print("C3_REPLAY_REMAINS_BLOCKED_IF_ANY_DIVERGENCE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-c3-truth-only-forensic-${{ github.run_id }}
          path: ${{ runner.temp }}/forensic/
          retention-days: 90
          if-no-files-found: warn
