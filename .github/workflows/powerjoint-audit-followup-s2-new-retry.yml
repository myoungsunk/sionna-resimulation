name: POWERJOINT followup S2 new-route restore retry
on:
  workflow_dispatch:
  push:
    branches: [research/powerjoint-audit-followup-20261020]
    paths: [.github/workflows/powerjoint-audit-followup-s2-new-retry.yml]
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        route: [C01, C02, C03, O01, O02, O03]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: work/source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S1_N1_EVENTS/independent_score.py
            /research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S0_CORRECTIONS/TRACE_RECEIPT.json
            /research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/restore_route.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/RELEASE_INPUTS.json
            /research/POWERJOINT_AUDIT_RERUN_20261020/canonical_engine.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/scalar_power.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T0_INPUTS/
            /research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/vendor/
            /research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/replay.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T1_MEMORY/unit_tests.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T2_NEW_ROUTE_BASELINE/prepare_inputs.py
            /research/POWERJOINT_AUDIT_RERUN_20261020/T2_NEW_ROUTE_BASELINE/PROTOCOL_LOCK.json
            /research/POWERJOINT_AUDIT_RERUN_20261020/T2_NEW_ROUTE_BASELINE/MANIFEST.json
            /research/POWERJOINT_AUDIT_RERUN_20261020/T2_NEW_ROUTE_BASELINE/ALL_METRICS.csv
            /research/POWERJOINT_AUDIT_RERUN_20261020/T9_SPEC/RESULTS.csv
            /research/CHAIN_HYPOTHESIS_20261019/
            /research/CHAIN_VALIDATED_RESULTS_20261019/evidence/KEY_B0_RESULTS.csv
            /research/FFD_P0P3_20261016/
            /research/EKF4_RANGE_S_STAGED_20261014/
            /research/R5_N4B_20261015/
            /research/R5_N4C_20261015/
            /research/PHYSICS_RS_STAGED_20261015/code/
            /research/R5_FULLRF_SAME_START_EKF4_20261015/
            /research/POWERJOINT_M45_COMPACT_20261019/
            /results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 requests==2.32.5
      - name: Restore immutable releases and verify SHA256
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore.py
      - name: Restore historical T2 or Native LoS reference traces
        if: matrix.route != 'R4' && matrix.route != 'R5'
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/restore_references.py --route ${{ matrix.route }} --out references
      - name: Restore actual new Full RF and frozen route metadata
        if: ${{ !startsWith(matrix.route, 'R') }}
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_RERUN_20261020/restore_route.py --route ${{ matrix.route }} --out source_route
      - name: Evaluate four frozen S2 models after committed lock
        working-directory: work
        run: python source/research/POWERJOINT_AUDIT_FOLLOWUP_20261020/S2_N2_GEOMETRY/evaluate.py --route ${{ matrix.route }} --execution-root . --out s2/${{ matrix.route }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: powerjoint-followup-s2-${{ matrix.route }}-${{ github.run_id }}
          path: |
            work/s2
            work/RESTORE_RECEIPT.json
            work/references/S2_REFERENCE_RECEIPT.json
            work/source_route/ARCHIVE_CONTENTS_AND_SHA.json
          retention-days: 30
