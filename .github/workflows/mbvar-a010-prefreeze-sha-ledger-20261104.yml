name: MBVAR A010 read-only prefreeze source and FFD hash ledger (NO RT)
on:
  push:
    branches: [proposer/mbvar-a010-freeze-review-packet-20261103]
    paths:
      - '.github/workflows/mbvar-a010-prefreeze-sha-ledger-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXP: research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029
  BASE_DIR: research/DS_MASK_CAUSAL_X1_X2_20261026
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  frozen-source-readonly-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/DS_MASK_CAUSAL_X1_X2_20261026/reflect_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/pol_bias_model
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/code
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/scripts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/tests
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/audit
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/contracts
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/config
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/SCIENCE_SPEC.md
            research/DS_MASK_CAUSAL_X1_X2_20261026/MBVAR_CONTROLLED_INFO_20261029/RUN_REQUEST.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Fetch only FFD code source hashes (no RT generation)
        shell: bash
        run: |
          set -euo pipefail
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          FETCH_RF=0 bash "$BASE_DIR/reflect_model/fetch_inputs.sh"
          rm -rf "$REFLECT_ROOT/.src.git"
          test -s "$REFLECT_ROOT/out/INPUT_LOCK.sha256"
      - name: Pin immutable whole Python tree and exact base D6 split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prefreeze"
          export REFLECT_ROOT="$RUNNER_TEMP/mi"
          python - <<'PY'
          import hashlib,json,os,sys,pathlib,subprocess
          exp=pathlib.Path(os.environ["EXP"])
          sys.path.insert(0,str(exp/"code"))
          import contract_lock as CL,manifest as MF
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          protected={
            "RUN_REQUEST.json":"2e8c23e8212ab8717c7b513045c02247e2a77146",
            "code/contract_lock.py":"a62d43dfce65d7a9ec9cc061916ecc836960d4e9",
            "code/s1v5.py":"01c84e028ee2326d5127ecdaa62d74fcd697ce54",
            "contracts/AMENDMENT-010.md":"3ee2e9995f46bfbe8e6e563fb18605feb47ba56f",
            "contracts/AMENDMENT-010-R5-PROPOSER-SPEC-V1.json":"6c1fb6e215809f0ca3a830e72e29e014511fed88"}
          for path,digest in protected.items():
            result=subprocess.check_output(["git","hash-object",str(exp/path)],text=True).strip()
            assert result==digest,(path,result,digest)
          req=json.loads((exp/"RUN_REQUEST.json").read_text())
          assert req["phase"]=="P2_A010P0_ABL"
          assert req["amendments"][-1]=="AMENDMENT-010-P0"
          assert "AMENDMENT-010" not in req["amendments"]
          locked=CL.effective_lock()
          assert locked["status"]=="FROZEN"
          assert "DEV3" not in locked["splits"]["S_field"]
          data=(exp/"contracts/AMENDMENT-010-D2D3D4D6-DRAFT.md").read_text()
          b=chr(96)*3+"json\n"
          draft=json.loads(data.split(b,1)[1].split("\n"+chr(96)*3,1)[0])
          assert draft["status"]=="DRAFT"
          future=dict(locked["splits"]["S_field"],DEV3=list(range(20,30)))
          assert future==draft["splits"]["S_field"],"ERR_A010_D6_FULL_S_FIELD_REPLACEMENT"
          for name in ("S1V5","C3V5"):
            assert draft["run_plan"][name]["fields"]==list(range(20,30))
            assert draft["run_plan"][name]["split"]=="DEV3"
          contract_sha=sha(exp/"contracts/EXPERIMENT_CONTRACT_MBVAR-INFO-001.md")
          assert contract_sha=="68d73bd22bf467625559f3092433f250cbe91cb2fef011f92151975975b00f34"
          codes=MF.code_hashes()
          assert len(codes)==49,("ERR_A010_SOURCE_FILES_COUNT",len(codes))
          pol=json.loads((exp/"contracts/AMENDMENT-010-R5-PROPOSER-SPEC-V1.json").read_text())
          assert len(pol["diagnostic_starts"])==9
          assert pol["polish"]["cost_descent_tol_chi2"]==.001
          assert pol["polish"]["max_steps"]==30
          assert pol["field_sensitivity"]["field_bootstrap_B"]==4000
          assert pol["field_sensitivity"]["field_bootstrap_seed"]==20261029
          assert pol["a010_science_frozen"] is False
          inputlock=pathlib.Path(os.environ["REFLECT_ROOT"])/"out/INPUT_LOCK.sha256"
          item={
            "schema":"MBVAR_A010_PREFREEZE_LEDGER_V1",
            "status":"READ_ONLY_PREFREEZE_SOURCE_VERIFIED_NOT_FROZEN",
            "source_git_sha":os.environ["GITHUB_SHA"],
            "governance_git_sha":"250d617ad89a4105fa1af546cc83ceed9de98f42",
            "experiment_contract_sha256":contract_sha,
            "plan_parameters_sha256":sha(exp/"config/PLAN_PARAMETERS.json"),
            "science_spec_sha256":sha(exp/"SCIENCE_SPEC.md"),
            "ffd_input_lock_sha256":sha(inputlock),
            "ffd_input_lock_content":inputlock.read_text(),
            "r5_numeric_policy_sha256":sha(exp/"contracts/AMENDMENT-010-R5-PROPOSER-SPEC-V1.json"),
            "draft_a010_sha256":sha(exp/"contracts/AMENDMENT-010.md"),
            "d2d3d4d6_draft_sha256":sha(exp/"contracts/AMENDMENT-010-D2D3D4D6-DRAFT.md"),
            "code_sha256":codes,"n_source_py_files":len(codes),
            "legacy_s_field_preserved":True,"holdout2_sealed":True,
            "dev3_fields":list(range(20,30)),"sensor_seeds":[0,1,2],
            "registered_batch_conditions_per_seed":36,
            "dev3_c3_registered_rows":1080,
            "dev3_s1_all_arm_rows":1980,
            "external_review_signed":False,"a010_science_frozen":False,
            "dev3":"NO-GO","rt":"NO-GO"
          }
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"prefreeze/A010_PREFREEZE_LEDGER.json"
          target.write_text(json.dumps(item,indent=2,sort_keys=True)+"\n")
          print("A010_PREFREEZE_INPUT_SOURCE_SHA_AUDIT_PASS",len(codes),sha(inputlock))
          print("A010_PREFREEZE_LEDGER_JSON "+json.dumps(item,sort_keys=True,separators=(",",":")))
          PY
      - name: Guard no repository write and DEV3 closed
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["EXP"])/"RUN_REQUEST.json").read_text())
          assert r["phase"]=="P2_A010P0_ABL"
          print("A010_NO_DEV3_NO_RT")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a010-prefreeze-source-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/prefreeze/A010_PREFREEZE_LEDGER.json
          if-no-files-found: warn
          retention-days: 90
