name: EKF4 P6 actual frozen RF local recursive pilot
on:
  push:
    branches: ['research/ekf4-r3-p2-p6-20261014']
    paths:
      - '.github/workflows/ekf4-rf4-p6-local-pilot.yml'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf4_recursive_pilot.py'
      - 'research/EKF4_RANGE_S_STAGED_20261014/rf4_pre_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-audited-p6-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Sparse checkout only source needed for PRE-RUN audit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/EKF4_RANGE_S_STAGED_20261014/**\n/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json\n/research/EKF3_INDEPENDENT_20261013/p2_frozen_rf_one_step.py\n/.github/workflows/ekf4-rf4-p6-local-pilot.yml\n' > .git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Mandatory source audit BEFORE any RF experiment or diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf4_pre_audit.py --out "$RUNNER_TEMP/pre_audit"
          echo "P6_AUDIT_PATH=$RUNNER_TEMP/pre_audit/PRE_RUN_AUDIT.json" >> "$GITHUB_ENV"
      - name: Expand sparse checkout to exact P0-listed frozen FFD and Sensor-v2 source AFTER audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json').read_text())
          patterns=['/research/EKF4_RANGE_S_STAGED_20261014/**',
                    '/research/EKF3_INDEPENDENT_20261013/**',
                    '/results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/**',
                    '/.github/workflows/ekf4-rf4-p6-local-pilot.yml']
          patterns+=['/'+x['path'] for x in p['assets']]
          Path('/tmp/ekf4-p6-sparse-patterns').write_text('\n'.join(patterns)+'\n')
          print('P0-listed patterns',len(patterns))
          PY
          git sparse-checkout set --no-cone --stdin < /tmp/ekf4-p6-sparse-patterns
      - name: Install pinned scientific dependencies
        run: python -m pip install --disable-pip-version-check -r research/EKF4_RANGE_S_STAGED_20261014/requirements.txt
      - name: Original P0 RF H LUT hashes and exact timeline alignment
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF3_INDEPENDENT_20261013/p0_verify_inputs.py | tee "$RUNNER_TEMP/p0_rf_input_audit.log"
      - name: Execute bounded 4-state recursive LoS Full RF pilot
        shell: bash
        run: |
          set -euo pipefail
          python research/EKF4_RANGE_S_STAGED_20261014/rf4_recursive_pilot.py --audit "$P6_AUDIT_PATH" --out "$RUNNER_TEMP/rf4_pilot" | tee "$RUNNER_TEMP/rf4_pilot.log"
      - name: Preserve all code, source-audit and numerical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekf4-p6-local-rf-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pre_audit/**
            ${{ runner.temp }}/p0_rf_input_audit.log
            ${{ runner.temp }}/rf4_pilot/**
            ${{ runner.temp }}/rf4_pilot.log
            research/EKF4_RANGE_S_STAGED_20261014/rf4_pre_audit.py
            research/EKF4_RANGE_S_STAGED_20261014/rf4_recursive_pilot.py
            research/EKF4_RANGE_S_STAGED_20261014/P5_P6_RF_CONTINUATION_CONTRACT_KO.md
          if-no-files-found: warn
          retention-days: 30
