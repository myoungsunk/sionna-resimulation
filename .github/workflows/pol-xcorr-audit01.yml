name: POL-XCORR-001 AUDIT-01 independent recompute (label-free, SELF_REVIEW_ONLY)
on:
  push:
    branches: ['research/pol-xcorr-audit01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-audit01.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/audit/audit01_recompute.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  audit01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies (auditor pins; deliberately different minor versions from implementer runs)
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - name: Fetch R-13b historical artifact (run 39376076166)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/r13b_audit
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation \
            --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/r13b_audit
          f=$(find /tmp/r13b_audit -name 'OBSERVATION_FEATURES_LABELS.csv.gz' | head -1)
          test -n "$f"; sha256sum "$f"
          echo "R13B=$f" >> "$GITHUB_ENV"
      - name: Independent recompute
        id: a
        run: |
          set -uo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/audit/results_audit01/run_${GITHUB_RUN_ID}"
          export OUT; echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS=(--repo-root . --out "$OUT")
          if [ -n "${R13B:-}" ]; then ARGS+=(--r13b-artifact "$R13B"); fi
          python -I -u research/POL_XCORR_UNRESOLVED_20261029/audit/audit01_recompute.py "${ARGS[@]}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          printf '{"github_run_id":"%s","head_sha":"%s","runner":"%s","r13b":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_NAME" "${R13B:-}" > "$OUT/AUDIT01_RUN_RECEIPT.json"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pol-xcorr-audit01-${{ github.run_id }}
          path: research/POL_XCORR_UNRESOLVED_20261029/audit/results_audit01/
          retention-days: 30
          if-no-files-found: error
      - name: Commit audit outputs (append-only)
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "POL-XCORR-001 AUDIT-01 recompute outputs from run $GITHUB_RUN_ID (label-free)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Fail if recompute did not exit cleanly
        if: always()
        run: test "${{ steps.a.outputs.rc }}" = "0"
