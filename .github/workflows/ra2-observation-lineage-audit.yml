name: RA2 observation lineage read-only source audit
on:
  push:
    branches: ['audit/ra0-ra1-ra2-observation-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra2/**'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/**'
      - '.github/workflows/ra2-observation-lineage-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029
            src/qclean_uwb
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Execute source SHA, key and negative controls
        shell: bash
        run: |
          set -o pipefail
          python -u research/RA0_RA1_RA2_AUDIT_20261029/ra2/ra2_readonly_lineage.py --work "$RUNNER_TEMP/ra2" | tee "$RUNNER_TEMP/RA2_LOG.txt"
      - name: G3 class-tolerance forensic counterexample and six source-report checks
        if: always()
        env:
          PYTHONPATH: src
        run: python research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_forensic_checks.py "$RUNNER_TEMP/ra2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra2-lineage-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ra2/RA2_AUDIT.json
            ${{ runner.temp }}/ra2/G3_FORENSIC_QA.json
            ${{ runner.temp }}/RA2_LOG.txt
          retention-days: 30
          if-no-files-found: warn
