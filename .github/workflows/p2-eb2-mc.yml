name: P2 error budget v2 (ACF, w vs q, bias path, memory) + Monte Carlo seeds
on:
  push:
    branches: ['research/d0-cir-p2-recursive-20261022']
    paths: ['.github/workflows/p2-eb2-mc.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PJ_SOURCE_ROOT: /tmp/pj_src
  PJ_OUT: /tmp/p2_out
  PJ_ART: /tmp/pj_art
  PJ_BANK_DOWNLOAD: /tmp/pj_bank
jobs:
  eb2:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {case: R2_aA_m0, held: R2}
          - {case: R2_aA_m45, held: R2}
          - {case: R2_aB_m0, held: R2}
          - {case: R4_aA_m0, held: R4}
          - {case: R4_aB_m0, held: R4}
          - {case: R5_aA_m0, held: R5}
          - {case: R5_aB_m0, held: R5}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact P2 smoke dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Stage and SHA-verify immutable RF traces and banks
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_ART" "$PJ_BANK_DOWNLOAD" /tmp/p2_models
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: Download ladder-4 control models (run 39893308814)
        run: |
          set -euo pipefail
          gh run download 39893308814 --repo myoungsunk/sionna-resimulation --name 'p2l4train-${{ matrix.held }}-39893308814' --dir /tmp/p2_l4train
      - name: Error budget v2
        run: |
          set -uo pipefail
          L4=$(find /tmp/p2_l4train -name '${{ matrix.held }}_L4TRAIN.joblib' -print -quit)
          python -u research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_ebudget2.py --case '${{ matrix.case }}' --l4models "$L4" --out "$PJ_OUT" > "$PJ_OUT/${{ matrix.case }}_EB2_LOG.txt" 2>&1; rc=$?
          tail -n 30 "$PJ_OUT/${{ matrix.case }}_EB2_LOG.txt"
          if [ $rc -ne 0 ]; then tail -n 12 "$PJ_OUT/${{ matrix.case }}_EB2_LOG.txt" | while IFS= read -r l; do echo "::error::$l"; done; exit $rc; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p2eb2-${{ matrix.case }}-${{ github.run_id }}
          path: /tmp/p2_out/
          retention-days: 30
          if-no-files-found: warn

  mc:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 28
      matrix:
        include:
          - {case: R2_aA_m0, held: R2, seeds: '0,1,2'}
          - {case: R2_aA_m0, held: R2, seeds: '3,4,5'}
          - {case: R2_aA_m0, held: R2, seeds: '6,7,8'}
          - {case: R2_aA_m0, held: R2, seeds: '9,10,11'}
          - {case: R2_aA_m45, held: R2, seeds: '0,1,2'}
          - {case: R2_aA_m45, held: R2, seeds: '3,4,5'}
          - {case: R2_aA_m45, held: R2, seeds: '6,7,8'}
          - {case: R2_aA_m45, held: R2, seeds: '9,10,11'}
          - {case: R2_aB_m0, held: R2, seeds: '0,1,2'}
          - {case: R2_aB_m0, held: R2, seeds: '3,4,5'}
          - {case: R2_aB_m0, held: R2, seeds: '6,7,8'}
          - {case: R2_aB_m0, held: R2, seeds: '9,10,11'}
          - {case: R4_aA_m0, held: R4, seeds: '0,1,2'}
          - {case: R4_aA_m0, held: R4, seeds: '3,4,5'}
          - {case: R4_aA_m0, held: R4, seeds: '6,7,8'}
          - {case: R4_aA_m0, held: R4, seeds: '9,10,11'}
          - {case: R4_aB_m0, held: R4, seeds: '0,1,2'}
          - {case: R4_aB_m0, held: R4, seeds: '3,4,5'}
          - {case: R4_aB_m0, held: R4, seeds: '6,7,8'}
          - {case: R4_aB_m0, held: R4, seeds: '9,10,11'}
          - {case: R5_aA_m0, held: R5, seeds: '0,1,2'}
          - {case: R5_aA_m0, held: R5, seeds: '3,4,5'}
          - {case: R5_aA_m0, held: R5, seeds: '6,7,8'}
          - {case: R5_aA_m0, held: R5, seeds: '9,10,11'}
          - {case: R5_aB_m0, held: R5, seeds: '0,1,2'}
          - {case: R5_aB_m0, held: R5, seeds: '3,4,5'}
          - {case: R5_aB_m0, held: R5, seeds: '6,7,8'}
          - {case: R5_aB_m0, held: R5, seeds: '9,10,11'}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact P2 smoke dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Stage and SHA-verify immutable RF traces and banks
        run: |
          set -euo pipefail
          mkdir -p "$PJ_SOURCE_ROOT" "$PJ_OUT" "$PJ_ART" "$PJ_BANK_DOWNLOAD" /tmp/p2_models
          gh run download 39256621315 --repo myoungsunk/sionna-resimulation --name powerjoint-chain-af-rf-snapshot-39256621315 --dir "$PJ_SOURCE_ROOT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir "$PJ_BANK_DOWNLOAD"
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir "$PJ_ART"
          python research/PJ_SEPARATE_RS_20261020/initialize.py
      - name: Download ladder-4 control models (run 39893308814)
        run: |
          set -euo pipefail
          gh run download 39893308814 --repo myoungsunk/sionna-resimulation --name 'p2l4train-${{ matrix.held }}-39893308814' --dir /tmp/p2_l4train
      - name: Monte Carlo seeds
        run: |
          set -uo pipefail
          L4=$(find /tmp/p2_l4train -name '${{ matrix.held }}_L4TRAIN.joblib' -print -quit)
          python -u research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_mc.py --case '${{ matrix.case }}' --l4models "$L4" --seeds '${{ matrix.seeds }}' --out "$PJ_OUT" > "$PJ_OUT/${{ matrix.case }}_MC_LOG.txt" 2>&1; rc=$?
          tail -n 30 "$PJ_OUT/${{ matrix.case }}_MC_LOG.txt"
          if [ $rc -ne 0 ]; then tail -n 12 "$PJ_OUT/${{ matrix.case }}_MC_LOG.txt" | while IFS= read -r l; do echo "::error::$l"; done; exit $rc; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p2mc-${{ matrix.case }}-s${{ strategy.job-index }}-${{ github.run_id }}
          path: /tmp/p2_out/
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: [eb2, mc]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Aggregate error budget v2 and Monte Carlo
        run: |
          set -euo pipefail
          D=research/PJ_D0_CIR_P2_RECURSIVE_20261022/results_eb2_mc
          mkdir -p /tmp/p2_in "$D"
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'p2eb2-*' --dir /tmp/p2_in
          gh run download "$GITHUB_RUN_ID" --repo myoungsunk/sionna-resimulation --pattern 'p2mc-*' --dir /tmp/p2_in
          python research/PJ_D0_CIR_P2_RECURSIVE_20261022/p2_eb2_mc_aggregate.py --input /tmp/p2_in --out "$D" --n_seeds 12 | tee "$D/EB2_MC_LOG.txt"
      - name: Commit ladder 2 summaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/PJ_D0_CIR_P2_RECURSIVE_20261022/results_eb2_mc
          git commit -m "P2 error budget v2 + Monte Carlo from run $GITHUB_RUN_ID" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
