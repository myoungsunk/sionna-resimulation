name: Real RF packet correction G0 E0-E3 observable benefit audit
on:
  push:
    branches: ['research/real-rf-packet-selector-20261023']
    paths: ['.github/workflows/real-rf-selector-stage1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  real_packet_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned scientific libraries
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 scipy==1.16.2 pandas==2.3.2 scikit-learn==1.7.2 joblib==1.6.0
      - name: Freeze previous held-route model and trajectory artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/realrf_source /tmp/realrf_models /tmp/realrf_series /tmp/realrf_out
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation \
            --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/realrf_source
          gh run download 39885708483 --repo myoungsunk/sionna-resimulation \
            --pattern 'p2ptrain-*' --dir /tmp/realrf_models
          gh run download 39885708483 --repo myoungsunk/sionna-resimulation \
            --pattern 'p2lad3-*' --dir /tmp/realrf_series
          test "$(find /tmp/realrf_models -name '*_PTRAIN.joblib' | wc -l)" -eq 3
          test "$(find /tmp/realrf_series -name '*_LADDER3_SERIES.csv.gz' | wc -l)" -eq 7
          test "$(find /tmp/realrf_source -name 'OBSERVATION_FEATURES_LABELS.csv.gz' | wc -l)" -eq 1
          sha256sum research/PJ_DS_GATED_20261021/results_hpath/HP_PACKETS.csv.gz \
            research/PJ_DS_GATED_20261021/results_hpath/HP_SERIES.csv.gz \
            research/PJ_D0_CIR_P2_RECURSIVE_20261022/results_r2diag/*_R2DIAG_PACKETS.csv.gz \
            > /tmp/realrf_out/G0_INPUT_SHA256.txt
      - name: Join Full CIR observed features with actual BASE prior, evaluate E0-E3
        run: |
          set -euo pipefail
          python -u research/REAL_RF_SELECTOR_20261023/e0e3_probe.py \
            --repo . --source /tmp/realrf_source --models /tmp/realrf_models \
            --series /tmp/realrf_series --out /tmp/realrf_out \
            2>&1 | tee /tmp/realrf_out/E0_E3_LOG.txt
          test -s /tmp/realrf_out/G0_E3_QA.json
          test -s /tmp/realrf_out/E3_UNIVARIATE_FEATURES.csv
          test -s /tmp/realrf_out/E2_PACKET_BENEFIT_OFFLINE.csv.gz
      - name: Preserve QA and per-packet labels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-rf-e0-e3-${{ github.run_id }}
          path: /tmp/realrf_out/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit checked summaries
        if: success()
        run: |
          set -euo pipefail
          mkdir -p research/REAL_RF_SELECTOR_20261023/results_stage1
          cp /tmp/realrf_out/E0_E2_STRATA.csv /tmp/realrf_out/E3_UNIVARIATE_FEATURES.csv \
             /tmp/realrf_out/G0_E3_QA.json /tmp/realrf_out/G0_INPUT_SHA256.txt \
             /tmp/realrf_out/E0_E3_LOG.txt research/REAL_RF_SELECTOR_20261023/results_stage1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/REAL_RF_SELECTOR_20261023/results_stage1/
          git commit -m "Real RF packet E0-E3 held-route observable benefit audit ($GITHUB_RUN_ID)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
