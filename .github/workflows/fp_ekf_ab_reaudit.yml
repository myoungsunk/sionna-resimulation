name: FP EKF A-B recurrence re-audit
on:
  push:
    branches: [audit/fp-ekf-ab-recursion-20261105]
    paths:
      - research/FP_EKF_AB_REAUDIT_20261105/audit.py
      - .github/workflows/fp_ekf_ab_reaudit.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fp-ekf-ab-reaudit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: research/FP_EKF_AB_REAUDIT_20261105
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 requests==2.32.5
      - name: Validate script and audit original archived data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python -m py_compile research/FP_EKF_AB_REAUDIT_20261105/audit.py
          mkdir -p research/FP_EKF_AB_REAUDIT_20261105/evidence
          python -u research/FP_EKF_AB_REAUDIT_20261105/audit.py --out research/FP_EKF_AB_REAUDIT_20261105/evidence 2>&1 | tee research/FP_EKF_AB_REAUDIT_20261105/RUN_LOG.txt
      - name: Preserve inputs, outputs, code and failure evidence in branch
        if: always()
        run: |
          printf '*.npz -filter -diff -merge -text\n*.zip -filter -diff -merge -text\n' > research/FP_EKF_AB_REAUDIT_20261105/.gitattributes
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f research/FP_EKF_AB_REAUDIT_20261105
          if ! git diff --cached --quiet; then
            git commit -m "Preserve FP/EKF re-audit evidence run $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:audit/fp-ekf-ab-recursion-20261105
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-ekf-ab-reaudit-${{ github.run_id }}
          path: research/FP_EKF_AB_REAUDIT_20261105
          retention-days: 90
