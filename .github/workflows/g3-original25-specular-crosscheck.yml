name: G3 25 ray finite-face specular angle check
on:
  push:
    branches: ['audit/g3-original23-physical-h-revalidation-20261029']
    paths:
      - 'research/RA0_RA1_RA2_AUDIT_20261029/g3/g3_23_specular_geometry.py'
      - '.github/workflows/g3-original25-specular-crosscheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            src/qclean_uwb
            research/RA0_RA1_RA2_AUDIT_20261029/g3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Independent finite planar reflections and original ray angular direction
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          EXP=research/RA0_RA1_RA2_AUDIT_20261029/g3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/r2a_original_ray.npz" "https://raw.githubusercontent.com/myoungsunk/sionna-resimulation/9bcd5da2fbadde626c9ff8cdc9ea940e6c980b13/results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/STORED_PATH_TRACES_R2_aA/x3.7036_y-0.5204_trace.npz"
          echo "d962e8c6f98484d851617bfea77fe24836c0d2caec6705ebeb8be2219c6004b6  $RUNNER_TEMP/r2a_original_ray.npz" | sha256sum -c -
          python -u "$EXP/g3_23_specular_geometry.py"             --zip "$EXP/original_source_delivery_20261029/G3_ORIGINAL_23_TRACE_PAIRS.zip"             --lock "$EXP/G3_23_ORIGINAL_SOURCE_LOCK.json"             --out "$RUNNER_TEMP/out" --r2a "$RUNNER_TEMP/r2a_original_ray.npz" | tee "$RUNNER_TEMP/out/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g3-25-specular-crosscheck-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: warn
