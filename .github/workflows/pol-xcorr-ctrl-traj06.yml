name: CTRL-TRAJ-06 closed-loop EKF ceiling detect-and-drop (exploratory)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths:
      - '.github/workflows/pol-xcorr-ctrl-traj06.yml'
      - 'research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/ctrl_traj_06.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mount: ['0', '45']
        sigma: ['0.09', '0.03']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.2
      - name: Download sha-verified FFD banks (run 38875080492)
        run: |
          set -euo pipefail
          mkdir -p /tmp/banks
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation --name ffd-verified-original-38875080492 --dir /tmp/banks
      - name: Run
        run: |
          set -euo pipefail
          OUT="research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/results_run_${GITHUB_RUN_ID}/m${{ matrix.mount }}_s${{ matrix.sigma }}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$OUT")"
          python -u research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_06/ctrl_traj_06.py \
            --bank-dir /tmp/banks --out "$OUT" --mounts ${{ matrix.mount }} --sigmas ${{ matrix.sigma }} --biases B0,L2 \
            --n-eval 100 --n-cal 50 | tee /tmp/log.txt
          cp /tmp/log.txt "$OUT/LOG.txt"
      - name: Commit outputs
        if: always()
        run: |
          set -euo pipefail
          test -n "${OUT:-}" && test -d "$OUT" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m "CTRL-TRAJ-06 outputs m${{ matrix.mount }} s${{ matrix.sigma }} run $GITHUB_RUN_ID (exploratory)" || echo no-changes
          for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep $((RANDOM % 20 + 5)); done
