name: Range-only full P6 heading gain causal ablation
on:
  push:
    branches: [codex/range-heading-p6-causal-audit-20261011]
    paths:
      - '.github/workflows/range-heading-p6-causal-test-20261011.yml'
      - 'research/HEADING_RELIABILITY_20261010/run_range_heading_gain_causal_ablation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  range-p6-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/HEADING_RELIABILITY_20261010/run_range_heading_gain_causal_ablation.py
            research/HEADING_RELIABILITY_20261010/run_range_bias_consistency_ablation.py
            results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/CASES.json
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/source/src/qclean_uwb/
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/01_FEATURES.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/OUTPUT/02_LABELS_EVAL_ONLY.csv
            results/DRIVE_SIM_HEADING_SENSOR_V2_20261010/RUN_01a124ff/LUT/hs_lut_meta.json
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R4_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R5_Tnone.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R2_T10.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R4_T10.csv
            results/DRIVE_SIM_20261007/S1/routes/timeline_R5_T10.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.4 pandas==2.2.3 scipy==1.15.2 tabulate==0.9.0
      - name: Smoke one-case and verify P6 Joseph and Schur identity
        run: |
          python -m py_compile research/HEADING_RELIABILITY_20261010/run_range_heading_gain_causal_ablation.py
          python research/HEADING_RELIABILITY_20261010/run_range_heading_gain_causal_ablation.py --out experiments/RANGE_HEADING_SMOKE --smoke
      - name: Compare range-to-heading causal branches 7case x3drift x8seed
        run: python research/HEADING_RELIABILITY_20261010/run_range_heading_gain_causal_ablation.py --out experiments/RANGE_HEADING_FULL --seeds 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range-heading-full-P6-7case-causality-audit
          path: experiments/
          retention-days: 30
          if-no-files-found: warn
