name: DLP P3 independent geometry and third-anchor C0 input preflight
on:
  push:
    branches: ['audit/dlp-p3-preflight-20261102']
    paths:
      - '.github/workflows/dlp-p3-geometry-preflight.yml'
      - 'research/DUAL_LP_PAPER_GAP_20261030/audits/P3_20261102/p3_geometry_preflight.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  DLP_P3_BANK_DIR: /tmp/dlp_p3_banks
  DLP_P3_PREFLIGHT_OUT: /tmp/dlp_p3_preflight
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Sparse load immutable P1 and P2 C0 and locked P3 geometry science contract
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin https://github.com/myoungsunk/sionna-resimulation.git
          export GIT_LFS_SKIP_SMUDGE=1
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git config core.sparseCheckout true
          mkdir -p .git/info
          printf '/research/DUAL_LP_PAPER_GAP_20261030/contracts/**\n/research/DUAL_LP_PAPER_GAP_20261030/audits/P3_20261102/p3_geometry_preflight.py\n' >.git/info/sparse-checkout
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('research/DUAL_LP_PAPER_GAP_20261030/contracts/DLP-EKF-GAPS-001/P1_20261101/P1_INPUT_LOCK.json').read_text())
          p=['/research/DUAL_LP_PAPER_GAP_20261030/contracts/**',
             '/research/DUAL_LP_PAPER_GAP_20261030/audits/P3_20261102/p3_geometry_preflight.py',
             '/research/EKF3_INDEPENDENT_20261013/P0_INPUT_MANIFEST.json',
             '/research/FFD_P0P3_20261016/source_model.py',
             '/research/DUAL_LP_PAPER_GAP_20261030/runs/P2_FROZEN_RANGE_ONLY_41315429738/P2_POSTRUN_QA.json',
             '/research/DUAL_LP_PAPER_GAP_20261030/runs/P2_FROZEN_RANGE_ONLY_41315429738/P2_RECOVERY_RECEIPT.json',
             '/research/DUAL_LP_PAPER_GAP_20261030/runs/P2_FROZEN_RANGE_ONLY_41315429738/P2_ALL_28_TRACES_IMMUTABLE.zip']
          p+=['/'+a['path'] for a in data['base_assets']]
          pathlib.Path('/tmp/p3_sparse').write_text('\n'.join(sorted(set(p)))+'\n')
          PY
          git sparse-checkout set --no-cone --stdin </tmp/p3_sparse
          test -s research/DUAL_LP_PAPER_GAP_20261030/runs/P2_FROZEN_RANGE_ONLY_41315429738/P2_ALL_28_TRACES_IMMUTABLE.zip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preflight numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Fetch actual original two FFD banks and verify source-only preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DLP_P3_BANK_DIR" "$DLP_P3_PREFLIGHT_OUT"
          gh run download 38875080492 --repo myoungsunk/sionna-resimulation \
            --name ffd-verified-original-38875080492 --dir "$DLP_P3_BANK_DIR"
      - name: Execute geometry, rank and frozen outcome-blind pilot selection ONLY
        shell: bash
        run: |
          set -uo pipefail
          python -u research/DUAL_LP_PAPER_GAP_20261030/audits/P3_20261102/p3_geometry_preflight.py \
            2>&1 | tee "$DLP_P3_PREFLIGHT_OUT/P3_PRE_RUN_LOG.txt"
          exit "${PIPESTATUS[0]}"
      - name: Preserve complete audit and pilot plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlp-p3-outcome-blind-preflight-${{ github.run_id }}
          path: /tmp/dlp_p3_preflight/
          retention-days: 30
          if-no-files-found: warn
      - name: Append-only commit of P3 pre-run verification and pilot plan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DLP_P3_PREFLIGHT_OUT/P3_PRE_RUN_AUDIT.json" || { echo "No complete P3 receipt"; exit 0; }
          D="research/DUAL_LP_PAPER_GAP_20261030/audits/P3_20261102/runs/${GITHUB_RUN_ID}"
          mkdir -p "$D"
          cp -a "$DLP_P3_PREFLIGHT_OUT/." "$D/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f "$D"
          git commit -m "audit(p3): preserve physical third-anchor geometry and fixed pilot plan ${GITHUB_RUN_ID}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
