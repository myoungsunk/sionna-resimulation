name: CTRL-TRAJ-03 discover EKF TRACE keys (exploratory)
on:
  push:
    branches: ['research/pol-xcorr-ctrl-traj01-20261030']
    paths: ['.github/workflows/pol-xcorr-ctrl-traj03-discover.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: true, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Download and list
        run: |
          set -euo pipefail
          mkdir -p /tmp/art
          gh run download 39376076166 --repo myoungsunk/sionna-resimulation --name POWERJOINT_SEPARATE_RS_FINAL_VALIDATION_39376076166 --dir /tmp/art
          python - <<'PY'
          import numpy as np, glob, json, os
          out = {'files': sorted(os.path.relpath(p, '/tmp/art') for p in glob.glob('/tmp/art/**/*', recursive=True) if os.path.isfile(p))}
          tr = sorted(glob.glob('/tmp/art/**/*_TRACE.npz', recursive=True))
          out['traces'] = {}
          for p in tr[:4]:
              z = np.load(p, allow_pickle=False)
              out['traces'][os.path.relpath(p, '/tmp/art')] = {k: [list(z[k].shape), str(z[k].dtype)] for k in z.files}
          out['n_traces'] = len(tr)
          json.dump(out, open('research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_03/TRACE_DISCOVERY.json', 'w'), indent=1)
          print(json.dumps(out['traces'], indent=1)); print(len(out['files']), 'files', out['n_traces'], 'traces')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/POL_XCORR_UNRESOLVED_20261029/explore/CTRL_TRAJ_03/TRACE_DISCOVERY.json
          git commit -m "CTRL-TRAJ-03 TRACE key discovery (run $GITHUB_RUN_ID)" || echo no-changes
          git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"
