name: RA5 aggregate three source-locked NO-RT experiments and exact stop gates
on:
  push:
    branches: ['audit/ra5-physical-tap-field-reuse-20261030']
    paths:
      - '.github/workflows/ra5-no-rt-evidence-aggregate.yml'
      - 'research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/aggregate_no_rt_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.3
      - name: Download three immutable upstream successful evidence archives
        shell: bash
        run: |
          set -euo pipefail
          REPO=myoungsunk/sionna-resimulation
          mkdir -p "$RUNNER_TEMP/source/observer" "$RUNNER_TEMP/source/fisher" "$RUNNER_TEMP/source/new-geometry"
          for ID in 40986273213 40985784668 40986462306; do
            RESULT=$(gh api "repos/$REPO/actions/runs/$ID" --jq '.conclusion')
            test "$RESULT" = "success" || { echo "ERR_UPSTREAM_RUN $ID $RESULT"; exit 2; }
          done
          gh run download 40986273213 --repo "$REPO" --pattern 'ra5-no-rt-integration-*' --dir "$RUNNER_TEMP/source/observer"
          gh run download 40985784668 --repo "$REPO" --pattern 'ra5-conditional-info-*' --dir "$RUNNER_TEMP/source/fisher"
          gh run download 40986462306 --repo "$REPO" --pattern 'ra5-novel-synthetic-geometry-*' --dir "$RUNNER_TEMP/source/new-geometry"
      - name: Validate original source QA and compute conditional information summary
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/merged"
          python -u research/RA0_RA1_RA2_AUDIT_20261029/ra5/integration/aggregate_no_rt_evidence.py \
            --root "$RUNNER_TEMP/source" --out "$RUNNER_TEMP/merged" 2>&1 | tee "$RUNNER_TEMP/merged/LOG.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ra5-integrated-science-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/merged/
          retention-days: 30
          if-no-files-found: warn
