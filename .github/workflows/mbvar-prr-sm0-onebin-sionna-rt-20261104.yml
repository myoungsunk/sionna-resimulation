name: MBVAR PRR native Sionna RT original R4-B194 center BIN (ONE SOLVER CALL)
on:
  push:
    branches: [selfrun/mbvar-prr001-onebin-native-rt-20261104]
    paths:
      - '.github/workflows/mbvar-prr-sm0-onebin-sionna-rt-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  GIT_LFS_SKIP_SMUDGE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  rt-one-original-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/INPUT_LOCK_DRAFT_002.json
            /research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/**
            /src/qclean_uwb/**
            /scripts/corridor_sionna_run.py
            /scripts/g2_completion/sionna_native_runtime.py
            /results/SIONNA_NATIVE41_REFRESH_20260925_01a0d84e/CONFIG.json
            /results/SIONNA_G2_FFD_NOFLIP_20260924_01a0d30b/bank/BANK_MANIFEST.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/freqs_hz.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/H_LoS_R4_aB_m0.npy
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aB_m0/MANIFEST.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/R4_aB_m0/SAMPLES.json
            /results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/INPUTS/timeline_R4_Tnone.csv
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert explicit one-bin hard limit and code+source hash
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/run_onebin.py
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path.cwd()
          lock=json.loads((root/"research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/INPUT_LOCK_DRAFT_002.json").read_text())
          files=("scripts/corridor_sionna_run.py","src/qclean_uwb/scenarios/corridor.py",
                 "results/SIONNA_NATIVE41_REFRESH_20260925_01a0d84e/CONFIG.json",
                 "results/DRIVE_SIM_20261007/POST_A23_RESULTS_20261010/SUPPLEMENT_01a12449/BLOCK_C/H_LoS_R4_aB_m0.npy")
          for n in files:
            p=root/n
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==lock["source_sha256"][n],n
          print("MBVAR_NATIVE_ONEBIN_SOURCE_SHA_PASS",len(files))
          PY
      - name: Pinned Native CPU Sionna RT environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.14.1' 'sionna-rt==2.0.1' 'mitsuba==3.8.0' 'drjit==1.3.1'
          if ! ldconfig -p | grep -q 'libLLVM'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm-18 libllvm18
          fi
          python - <<'PY'
          import mitsuba as mi
          mi.set_variant('llvm_ad_mono_polarized')
          import sionna.rt as rt
          assert mi.variant()=='llvm_ad_mono_polarized'
          print("MBVAR_SIONNA_CPU_IMPORT_AND_LLVM_OK",rt.PathSolver().__class__.__name__)
          PY
      - name: Restore SHA-locked LP+45/−45 FFD banks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original_banks" "$RUNNER_TEMP/bank"
          gh run download 38875080492 --repo ${{ github.repository }} --name ffd-verified-original-38875080492 --dir "$RUNNER_TEMP/original_banks"
          python - <<'PY'
          import pathlib,os,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          expected=json.loads(pathlib.Path('research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0/INPUT_LOCK_DRAFT_002.json').read_text())['bank_sha256']
          for name,dig in expected.items():
            matched=list((root/'original_banks').rglob(name))
            assert len(matched)==1,(name,len(matched))
            with matched[0].open('rb') as f:
              h=hashlib.file_digest(f,'sha256').hexdigest()
            assert h==dig,(name,h,dig)
            (root/'bank'/name).symlink_to(matched[0])
          print("MBVAR_SIONNA_2_FFD_BANK_BYTES_PINNED")
          PY
      - name: Exactly one real PathSolver call, bin 128 / R4-B original pose194
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/onebin"
          rc=0
          python -u research/MBVAR_PRR_001_20261103/PHYSICAL_CAUSALITY_20261104/NEW_RT_DATA/SM0_GITHUB_ONEBIN/run_onebin.py \
            --out "$RUNNER_TEMP/onebin/result" --bank "$RUNNER_TEMP/bank" \
            > "$RUNNER_TEMP/onebin/RUN.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/onebin/RUN.log"
          echo "MBVAR_ONEBIN_EXIT_STATUS=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mbvar-native-onebin-rt-${{ github.run_id }}
          path: ${{ runner.temp }}/onebin/
          retention-days: 90
          if-no-files-found: warn
